p:["Risque de bascule pendant la pose des cales escalier du calage primaire."]},

{id:"arrimage",ch:"stab",t:"Arrimage",src:"Référentiel 2.5 · GDO ch.3 §3.1",
cle:"Obligatoire dès qu’un véhicule peut glisser, basculer ou se déplacer. Point fixe très résistant (arbre, poteau) ; lampadaires à proscrire ; une roue qui tourne n’est pas fiable.",
b:[["Déroulé",["Sangles à cliquet (plus simples et rapides), estropes, crochets, halligan en point fixe.","Points d’amarrage solides (roues, berceau, triangle de roue).","Rattraper l’excédent de sangle puis tendre au cliquet sur ordre du CA (sinon la bobine se charge et bloque).","Vérifier la fermeture du cliquet ; protections de coupe sur les parties saillantes.","Intercaler des cales entre véhicules/obstacles si besoin.","Usages : éviter le balancier (PL), maintenir des parties découpées, neutraliser les suspensions lors d’un levage.","Engin de secours en point fixe : possible s’il est calé ; treuil des engins SR utilisable.","Aucun engagement dans un véhicule instable tant qu’il n’est pas stabilisé ou arrimé totalement (GDO)."]]],
o:["« Sangle du triangle de roue à l’arbre, tu ravales le mou, et tu cliquettes à mon ordre. »"],
p:["Lampadaire : point fixe à proscrire.","Aucune normalisation de l’arrimage : utiliser les points forts."]},

/* ============ OUVERTURES ============ */
{id:"porte-serrure",ch:"ouv",t:"Ouverture de porte par la serrure",src:"Référentiel 3.1",
cle:"D’abord les poignées et la clé. Ensuite chasser le cadre de porte hors de son logement. Écarteur à moins de 90°, quasi parallèle au véhicule, sur les parties dures.",
b:[
 ["Règles communes",["Ne pas se positionner entre l’écarteur et le véhicule.","Ne pas faire appuyer la porte au sol (stabilité).","Travailler dans le sens d’ouverture ; balle ou cale dans la poignée ; gérer le vitrage.","Ouvrir et non écraser la porte : angle < 90°, quasi parallèle.","Becs sur les parties dures (charnières, cadre intérieur) ; espace suffisant sinon l’écarteur recule.","Ouvrir/fermer rapidement l’écarteur pour se créer de l’espace sans déchirer.","Plus le cadre est comprimé, plus le risque de déchirure est grand. Porte qui se déchire : couper l’arrêt de porte et sécuriser avec une corde à cliquet."]],
 ["Méthodes",["Travers de fenêtre : écarteur vertical dans le cadre de vitre, au plus près du montant B ou C (sur l’épaule = bon angle), tension, ouverture pour faire céder la serrure.","Écrasement de serrure (plus efficace sur portes arrière) : pincer en biais au-dessus de la poignée, dans les 10 cm de la serrure, angle ~45°. Airbags latéraux dans la porte : dégarnir ou autre technique.","Espaces naturels : utiliser les déformations (cisaille-écarteur possible).","Outil de forcement : Halligan (partie plate puis rotation vers le bas) ou OFD pour introduire le bec.","Alternative cadre de porte : travailler sur les parties rigides, descendre vers la serrure avec le poids de l’écarteur."]],
 ["Enlever la porte",["Charnière inférieure puis supérieure (évite l’appui de l’angle de porte au sol qui modifie le calage).","Charnières coupées (sécables), écartées, déboulonnées ou dégoupillées.","Rupture de charnière = propulsion possible de la porte ; un équipier maintient la porte.","Une fois ouverte : couper le frein de porte, forcer, sécuriser à la corde à cliquet + protections de coupe."]],
 ["VL sur le toit",["Écraser le bas de caisse sans appuyer sur la porte, puis ouvrir l’écarteur dans la déformation.","Interdit sur les VEA : zone de 20 cm du bas de caisse.","Possible de couper le cadre supérieur de la porte à la cisaille."]]
],
o:["« Équipier 1, balle dans la poignée, vitre gérée. Équipier 2, écarteur en travers de fenêtre au ras du montant B, tu poses sur ton épaule. Bouclier côté victime. »","« Charnière du bas d’abord, puis celle du haut. Tu tiens la porte. »"],
p:["Enlèvement : charnière INFÉRIEURE d’abord.","Écrasement de serrure : dans les 10 cm, angle 45°, plus efficace à l’arrière."]},

{id:"porte-charn",ch:"ouv",t:"Ouverture de porte par les charnières",src:"Référentiel 3.2",
cle:"Si la serrure est inaccessible ou si l’on veut enlever complètement la porte (anticipation d’une levée de tableau de bord). Contrôler la FAD (Start & Stop).",
b:[
 ["Déroulé",["Vérifier sur la FAD l’absence de Start & Stop ou autre.","Sens d’ouverture ; balle dans les poignées intérieure et extérieure ; gérer le vitrage.","Retirer le répétiteur de clignotant ; engager la pointe du Halligan dans le trou et pousser (à deux si besoin, sans à-coup) : un espace se crée.","Puis déboulonner, couper (si sécables), forcer ou chasser une goupille.","Privilégier la technique la plus simple, rapide et économe en matériel.","Technique 3 : bec de l’écarteur sur les parties dures des charnières, rupture ; puis forcer la serrure (porte propulsée possible).","À l’issue : protéger les angles saillants, réévaluer le calage."]],
 ["Variantes",["Pas de répétiteur : baguette ou logo offrent les mêmes possibilités.","Ailes plastique : plus difficiles (projections) ; on peut écarter ou dévisser l’aile.","Écraser l’aile à l’écarteur au passage de roue : INTERDIT si Start & Stop.","Halligan entre aile et porte, en descendant progressivement."]]
],
o:["« Retire le répétiteur, Halligan dans le trou, tu pousses sans à-coup. »"],
p:["Écrasement de l’aile au passage de roue interdit avec Start & Stop (ultracapacité dans l’aile avant gauche)."]},

{id:"porte-lat",ch:"ouv",t:"Porte latérale coulissante",src:"Référentiel 3.3",
cle:"Libérer la serrure (balle/cale), créer un espace au Halligan, écarteur dans le rail horizontal jusqu’à extraire le dispositif coulissant, puis faire glisser la porte.",
b:[["Déroulé",["Ouverture manuelle d’abord (poignée intérieure, clé).","Balle ou cale ; espace au Halligan ; becs dans le rail horizontal.","Bouclier + couverture obligatoires.","Écarter jusqu’à extraire le coulissant ; après rupture de serrure, faire glisser sur le ou les rails.","Dépose complète : écarteur dans les brides supérieures ou couper/dévisser les pattes guides.","Même méthode possible côté poignée ; si ouverture par l’avant : écarteur dans le rail."]]],
o:[],p:["Fréquent sur utilitaires et familiales."]},

{id:"capot",ch:"ouv",t:"Ouverture de capot",src:"Référentiel 3.4",
cle:"Surtout pour accéder à la batterie. D’abord la poignée de déverrouillage. Localiser la batterie sur la FAD, le sens d’ouverture et la serrure.",
b:[
 ["Déroulé",["Insérer l’écarteur ou créer un jour en pinçant et rabattant le capot.","Ouvrir assez pour débrancher la batterie, voire faire céder serrure ou charnières.","Cale pour maintenir un jour entre capot et aile."]],
 ["Alternatives",["Serrure côté pare-choc : retirer l’optique côté conducteur (calandre, grille).","Ford : verrou dans le logo, à déverrouiller avec la clé.","Tirer sur le câble et sa gaine (passe à cet endroit dans 80 % des cas).","Serrure qui résiste : l’écarter, la couper, dévisser l’anneau ou couper autour à la scie sabre."]],
 ["Risques",["Pincement lors de la pose de cale.","Capots actifs, pare-chocs actifs, phares xénon, Start & Stop, liquide de refroidissement."]]
],
o:[],p:[]},

{id:"coffre-avec",ch:"ouv",t:"Coffre avec accès intérieur",src:"Référentiel 3.5",
cle:"Actionner le mécanisme intérieur d’ouverture du coffre avec un petit outil. Le coffre s’ouvre sans effort.",
b:[["Déroulé",["Lunette brisée : protéger le cadre de verre ou la retirer.","Mécanisme parfois accessible de l’extérieur (logo, plaque, feu arrière).","Retrait complet : dégarnir le plafond, dévisser les écrous (10 ou 13 mm), ou couper les charnières (2 fers plats sécables au coupe-boulon sur les récents ; plus grosses : autre technique).","Les vérins poussent le coffre ; une fois charnières et vérins enlevés, le coffre fait bras de levier sur le verrou.","Coffres composites : couper à la scie sabre de chaque côté du verrou (après dégarnissage) ou une seule moitié (bien retenir le coffre).","Protéger toutes les parties coupantes."]]],
o:[],p:["Effet ressort du coffre pendant l’écartement ; projections plastiques en déposant le bloc optique."]},

{id:"coffre-sans",ch:"ouv",t:"Coffre sans accès intérieur",src:"Référentiel 3.6",
cle:"Gérer le vitrage et le laisser en place, déposer un bloc optique (côté passager de préférence), écarteur entre hayon et contour du feu sur un point rigide, faire pivoter sur la serrure.",
b:[["Déroulé",["Privilégier l’optique côté passager : la gâche s’ouvre généralement dans ce sens.","Bouclier de protection.","Alternative : pré-écarter avec un outil de forcement jusqu’à une partie rigide, puis écarteur à la serrure (ou aux charnières en variante).","Coffre ouvert : le laisser (sécurisé à la cordelette à cliquet) ou le retirer : goupille du vérin, vérin, capitonnage, écrous, câble, montants à la cisaille, charnières au coupe-boulon.","Certaines charnières : chasser la goupille."]]],
o:[],p:[]},

/* ============ TABLEAU DE BORD ============ */
{id:"tdbgen",ch:"tdb",t:"Tableau de bord : généralités",src:"Référentiel 4.1",
cle:"Poussée de TdB (vérin) : la compression vient contre les jambes. Levée de TdB (écarteur ou vérin) : la compression vient du dessus. Ne lever/pousser que le strict nécessaire : une victime est bloquée entre 3 et 7 cm.",
b:[
 ["Principes",["Choc frontal violent : le bloc moteur comprime l’espace devant et sous les jambes. Limiter le délai jusqu’à la prise en charge médicale (période d’or).","Au-delà de 7 cm de coincement, le membre est sectionné : l’espace apporté est adapté, non exagéré.","Les deux techniques sont possibles sans dépose de la porte (version rapide).","Obstacle devant la voiture : la poussée est difficile, envisager autre chose."]],
 ["Poussée rapide",["Renfort de travellage si possible ; jeu de cales sous le pied du vérin.","Tête du vérin à l’angle du montant A et du renfort de TdB, pied au pied du montant B.","Écarter juste ce qu’il faut ; laisser le vérin en place avec un équipier jusqu’au dégagement. Un ou deux vérins."]],
 ["Levée rapide",["Localiser la barre de renfort (avec ou sans dégarnissage).","Un bec sous la barre, l’autre sur le bas de caisse ; écarter jusqu’au dégagement ; laisser l’écarteur avec un équipier.","Déboulonner la barre possible APRÈS avoir positionné l’écarteur.","Dégarnir joints et plastiques (glissement) ; bouclier.","Alternative console centrale : barre de renfort centrale et bas de caisse devant le levier de vitesse, quelques cm sans coupe de décharge, bouclier obligatoire."]],
 ["Critères",["Caler impérativement sous la charge à lever (montant A), cales plates.","Vérifier le calage après chaque action ; protéger les angles saillants.","Deux victimes : un vérin du côté opposé.","Coupes de décharge seulement si nécessaire."]]
],
o:["« Compression contre les jambes : poussée. Vérin tête à l’angle montant A / renfort, pied au pied du B, jeu de cales dessous. Tu restes au vérin jusqu’à la sortie. »"],
p:["Poussée = contre les jambes ; levée = par le dessus.","3 à 7 cm : on ne crée que l’espace nécessaire."]},

{id:"volant",ch:"tdb",t:"Gestion du volant",src:"Référentiel 4.2",
cle:"D’abord le levier de réglage du volant. Jouer sur la flexibilité des matériaux, ne pas confondre flexibilité et point de rupture.",
b:[
 ["Techniques",["Sangle à cliquet : cliquet sur un montant, pas sur le pare-brise (une cale s’enfoncerait) ; sangle sous le volant (attention aux jambes) ; crochets bien liés ; ravaler, cliqueter, verrouiller. Réalisable avec les portes mais bloque leur ouverture ensuite. Garde les outils hydrauliques libres.","Par le montant A (avec la porte) : bec 1 contre l’extérieur du montant A (plus il est haut, plus le volant monte), bec 2 sur la branche la plus proche, corps parallèle au véhicule, on REFERME l’écarteur.","Appui sur le longeron : porte ouverte/fixée ; bec 1 sous le volant (près de la victime, visuel permanent), bec 2 sur le bas de caisse, calage sous l’appui ; on OUVRE l’écarteur.","Appui sur la base du levier de vitesse : identifier l’ECU sur la FAD.","Stab-Fast (avec la porte) : couper un carré dans le pare-brise au-dessus du volant ; pied sur partie dure du capot, tête sur le pavillon.","Couper les branches du volant (cisaille, coupe-pédale, scie sabre) sans couper l’airbag.","Couper l’axe à la base du volant : UNIQUEMENT si identifié sur la FAD ; tenir le volant (chute).","Vérin sous l’axe du volant, cale sous le pied ; demande de la place aux jambes (jambe gauche mobilisable) ; plus efficace sur PL/camionnette."]],
 ["Après",["Laisser l’outil, ou sécuriser le volant par une sangle en trouant le pare-brise ; retiré, il peut redescendre (flexibilité).","Le raisonnement tactique du CA mène à la technique la plus simple et rapide."]]
],
o:["« Sangle à cliquet sous le volant, cliquet sur le montant A, pas sur le pare-brise. Tu ravales et tu cliquettes doucement, je regarde les jambes. »"],
p:["Couper l’axe du volant : seulement si la FAD l’indique.","Technique montant A : on referme l’écarteur ; technique longeron : on l’ouvre."]},

{id:"levee",ch:"tdb",t:"Levée de tableau de bord (complète)",src:"Référentiel 4.3",
cle:"Opération longue : enlever la porte dès le plan d’urgence. Fenêtre au-dessus de la charnière basse et sous la charnière haute, écarteur sur la barre de renfort, coupes de décharge selon les tensions.",
b:[["Déroulé",["Dégarnir, charte graphique avec la FAD ; retirer la porte (dès le PU).","Déposer l’aile avant (Start & Stop, supercondensateur, extincteur).","Fenêtre : coupe au-dessus de la charnière basse (impératif : point de renfort et zone 20 cm VEA), deuxième coupe sous la charnière haute adaptée au besoin. Plus la fenêtre est grande, moins on peut lever.","Rabattre ou écarter les parties du montant A ; au moins une coupe doit traverser tout le montant et le bas de caisse. La fenêtre donne accès aux pieds et aux pédales.","Mettre en place l’écarteur, vérifier le calage sous le montant A, identifier la barre de renfort (absente sur les anciennes).","Mettre en tension, coupes de décharge si nécessaire ; une personne à l’écarteur rattrape la tension ; laisser l’écarteur jusqu’au retrait de la victime.","Si nécessaire, couper le montant A et le pare-brise en partie haute, au plus près du pavillon.","Inefficace : coupe de décharge droite sur la poutre de joue d’aile (entre suspension et montant A), puis charnière du capot, puis barres de renfort (ou les déboulonner).","Alternative depuis la colonne centrale (vigilance ECU), sans coupe de décharge.","Peut se coupler avec la poussée."]]],
o:["« On dépose la porte maintenant, dans le plan d’urgence. Fenêtre : première coupe au-dessus de la charnière basse, toute la profondeur. »"],
p:["Peu efficace sur les voitures récentes (matériaux).","Le CA décide des coupes de décharge selon les tensions observées."]},

{id:"poussee",ch:"tdb",t:"Poussée de tableau de bord (complète)",src:"Référentiel 4.4",
cle:"Vérin TOUJOURS en tension AVANT les coupes de décharge. Vérin du bas de caisse (angle du montant B) au montant A près de la barre de renfort ; contre-calage tout au long de la poussée.",
b:[["Déroulé",["Dégarnir, charte graphique ; retirer la porte (dès le PU) ; déposer l’aile (Start & Stop, supercondensateur).","Vérin sur le bas de caisse (angle du montant B) et sur le montant A au plus près de la barre de renfort ; jeu de cales sous le pied ; renfort de travellage si l’espace le permet.","Mettre en tension, réajuster le calage sous le montant au fur et à mesure.","Inverser (coupes avant tension) accroît le risque de compression de la victime.","Coupe de décharge du montant A au-dessus de la charnière basse, totalité du montant et du bas de caisse ; surveiller que la cisaille ne chasse pas le vérin.","Si nécessaire, couper le montant A et le pare-brise en haut, au plus près du pavillon.","Ne pousser que le strict nécessaire ; contre-calage ; cale possible dans la coupe de décharge.","Difficultés : coupe de décharge du longeron en biais vers le pare-brise, entre suspension et montant A ; puis charnière de capot, barres de renfort.","Cale d’appui de vérin (ou écarteur pinçant une cale bois) ; entaille à la scie sabre en calant sous le vérin.","Poussée à deux vérins en simultané possible ; vérin en partie centrale possible."]]],
o:["« Vérin en tension d’abord. Ensuite seulement, coupe de décharge du montant A au-dessus de la charnière basse. Toi, tu rattrapes la tension. »"],
p:["Ordre impératif : tension du vérin → coupes de décharge."]},

{id:"pedales",ch:"tdb",t:"Gestion des pédales",src:"Référentiel 4.5",
cle:"Avant toute technique : essayer de retirer la chaussure. Ensuite ceinture/sangle autour de la pédale et traction (porte, écarteur, sangle à cliquet).",
b:[["Techniques",["Ceinture autour de la pédale et sur le cadre de porte, porte presque fermée ; ouvrir la porte sans à-coup : la pédale se dégage. Attention au volant sur les jambes.","Avec l’écarteur (avec ou sans porte) : sangle de bonne longueur, boucle autour de la pédale ; écarteur vertical, ouvrir ; plus il est loin du montant A, plus la sangle glisse. Pédales plastique moins flexibles : pas jusqu’à la rupture. Bouclier.","Ne jamais passer les deux becs dans la même boucle (étirement, rupture).","Sangle à cliquet à la place de l’écarteur.","Couper la pédale (cisaille, coupe-pédale) : demande plus d’espace ; écarteur horizontal possible, bien maintenu.","Accès aussi par la fenêtre de la levée de TdB.","Nœuds : nœud de sangle, nœud de huit double, boucles ; serrer au maximum."]]],
o:["« D’abord, on enlève sa chaussure. Ensuite boucle de ceinture sur la pédale, écarteur vertical au plus près du montant A. »"],
p:["Deux becs dans une même boucle = rupture."]},

/* ============ REFORMATION ============ */
{id:"reformation",ch:"ref",t:"Reformation",src:"Référentiel 5.1 · FMPA SR 2026 · FRO 51",
cle:"Redonner du volume à un véhicule déformé, juste ce qu’il faut : espace adapté, non exagéré. À privilégier à la découpe sur les véhicules nouvelle génération.",
b:[
 ["Quand ?",["Victime coincée dans un véhicule fortement déformé, accès direct insuffisant.","Alternative rapide au retrait de pavillon quand c’est plus sûr ou plus rapide.","Compression ou incarcération : stop compression et décompression."]],
 ["Matériel",["Vérin (hydraulique/télescopique, « ram »), écarteur ou outil combiné.","Plaques de répartition / support de base ; cales, sangles, haubans ; EPI complet ; documentation constructeur."]],
 ["Déroulé (référentiel)",["Observer les déformations, réfléchir aux conséquences d’une poussée dans cet axe ; le CA prend du recul et anticipe.","Dégarnir les deux zones d’appui du vérin ; le CA peut marquer la position de la tête.","Plaques d’appui si besoin ; cale sous le vérin sur appuis meubles (sièges).","Tête de vérin : uniquement les cales prévues pour la reformation (les autres = effet missile) ; à défaut, autre solution.","Mettre en appui, bouclier pour la victime ; contrôler l’axe de poussée (calage de réaction possible).","Laisser travailler jusqu’au nécessaire ; contrôler et poursuivre ; 2e vérin avec rallonge pour la substitution, sans relâcher la tension.","Recontrôler le calage ; on peut enlever le vérin pour la sortie (sur pavillon : il revient de quelques cm).","Protéger les angles saillants."]],
 ["Points clés",["Pousser sur les zones renforcées : montants, cadres de porte, blocs ceintures (souvent déconseillés à la coupe).","Couplage possible avec le tunnel (facilite la scie sabre).","Vérin dans tous les sens, ou pour remettre un montant avant de le couper ; écarteur aussi possible.","Ne pas couper la structure avant d’avoir obtenu la forme souhaitée (garder la force de poussée).","Tester le passage avec le plan dur. Très efficace sur véhicules déformés, faible sur véhicules intacts."]],
 ["Risques",["Vérin maintenu en permanence à l’intérieur de l’habitacle par un équipier SR.","Écrasement ; toujours après dégarnissage.","Airbags/prétensionneurs : dégarnissage préalable, contrôle de la FAD.","Rebond : éviter de repositionner en cours de poussée.","Appui insuffisant : plaque répartitrice ou autre point.","VEA : procédures, marquage, isolement.","Le vérin ne gêne ni l’homme d’intérieur au maintien tête, ni la future sortie."]]
],
o:["« Je marque la tête du vérin ici, sur le cadre de porte. Dégarnis les deux appuis. Cale de reformation en tête, bouclier sur la victime. Pousse doucement… stop. On regarde. »","« Prépare le deuxième vérin avec la rallonge pour la substitution, on ne relâche pas. »"],
p:["Ne pas couper avant d’avoir la forme voulue.","Cale classique en tête de vérin = projectile."]},

{id:"tunnel",ch:"ref",t:"Le tunnel",src:"Référentiel 5.2",
cle:"Le toit est fin, peu renforcé, rarement équipé de sécurités actives : découpe facile et sortie dans l’axe sécurisée, sans toucher au pare-brise.",
b:[
 ["Sur ses roues",["Coupe en commençant par l’arrière.","Dégarnir et ôter l’habillage du plafond ; le CA dessine la charte avec la FAD.","Amorces à la cisaille sur les parties renforcées ; découper à la scie sabre sans entamer les rails.","Possible de commencer par un trou (pointe du Halligan, perceuse) ; demi-toit possible.","Bouclier, protections des zones de coupe."]],
 ["Sur le côté",["Par l’arrière ; amorces cisaille, scie sabre ; coupe linéaire sous le rail du toit puis verticale."]],
 ["Sur le toit",["Ôter le hayon ; dégarnir puis couper l’habillage du plafond (il agit comme un « pantalon de tronçonnage » et réduit l’efficacité de la lame).","Amorces cisaille, scie sabre, stopper quand l’espace suffit."]],
 ["Risques",["Visuel permanent sur la scie sabre et la lame ; coupure ; organes pyrotechniques."]]
],
o:["« Tunnel par l’arrière : habillage enlevé, amorces à la cisaille, puis scie sabre sans toucher aux rails. Quelqu’un surveille la lame à l’intérieur. »"],
p:["Pas de paillettes de verre : on ne touche pas au pare-brise."]},

/* ============ VL SUR ROUES ============ */
{id:"rouesgen",ch:"roues",t:"VL sur ses roues : choisir",src:"Référentiel 6.1",
cle:"Après sécurisation, vitrages gérés et espace de vie recréé (sièges, banquettes) : tunnel, demi-pavillon, pavillon, ou sortie latérale (latérale, voie américaine, troisième porte).",
b:[["Repères",["Nouvelle génération : couper les montants est difficile voire très chronophage ; la FAD guide ; le pavillon n’est pas systématique.","Tunnel / demi-pavillon : évitent le pare-brise et le montant A (souvent renforcé).","Pavillon : alternative rapide et viable sur les anciens véhicules.","Accès arrière impossible ou axe 0° hors axe du véhicule : plan dur inséré par l’arrière ou le côté, bassin à 0°, puis sortie par n’importe quel axe ou toboggan.","Sortie latérale avec gestion du montant B ; bases de montant B difficiles et chronophages sur les récentes : FAD.","Victime sortie dans le temps que nécessite son état."]]],
o:[],p:[]},

{id:"demipav",ch:"roues",t:"Demi-pavillon",src:"Référentiel 6.2",
cle:"Quand les dossiers avant fonctionnent et que les montants A et B sont renforcés. Couper les montants C, coupes de décharge au niveau des rails avant le montant B, rabattre vers l’avant.",
b:[["Déroulé",["Dégarnir, charte pour les montants C et les coupes de décharge ; coupe en V dans le pavillon selon la FAD.","Coupe basse = moins gênante pour l’extraction ; montant C : partie la moins large.","Couper les montants C en commençant par le plus éloigné de la victime ; annoncer chaque coupe ; faire maintenir le pavillon.","Coupes de décharge (attaque à 45° pour couper droit), adaptables.","Un équipier de chaque côté rabat le pavillon vers l’avant ; barre à mine sur l’axe de rotation si difficulté.","Fixer le pavillon (sangle à cliquet, rope ratchet), protections de coupe, revérifier le calage, couper les ceintures selon la hauteur de coupe.","Avantage : pas de gestion du pare-brise.","Variantes : demi-pavillon avant (couper les A, gérer le pare-brise ; camionnettes, ravin), un seul montant + décharges, garder le coffre (sans couper les vérins), pousser à l’écarteur/vérin si très déformé."]]],
o:["« Montant C droit en premier, c’est le plus loin de la victime. J’annonce : coupe ! Vous deux, vous tenez le pavillon. »"],
p:["Demi-pavillon = dossiers avant FONCTIONNELS. Demi-pavillon complet = dossiers NON fonctionnels."]},

{id:"demipavc",ch:"roues",t:"Demi-pavillon complet",src:"Référentiel 6.3",
cle:"Couper les montants B et C. Coupes de décharge au niveau des rails, à environ 10 cm du haut du pare-brise. Commencer par le B le plus éloigné, finir par le B le plus proche.",
b:[["Quand",["Les dossiers avant ne fonctionnent pas.","Besoin de plus de place pour une autre technique.","Deux victimes à l’avant.","Montant A renforcé. Pas de pare-brise à gérer, donc pas de paillettes."]],
 ["Déroulé",["Charte pour montants B et C + décharges.","Ordre : B le plus éloigné → C → … → B le plus proche de la victime.","Annoncer, maintenir le pavillon, décharges, rabattre vers l’avant, fixer, protections, calage."]]],
o:["« Ordre de coupe : B gauche, C gauche, C droit, B droit en dernier, côté victime. »"],p:[]},

{id:"pavillon",ch:"roues",t:"Pavillon",src:"Référentiel 6.4",
cle:"Couper A, B, C et le pare-brise. Commencer par le montant A le plus éloigné de la victime, ordre logique 1 à 6, toujours finir par le plus proche. Évacuer vers l’arrière si possible.",
b:[["Déroulé",["Dégarnir, charte A, B, C et pare-brise ; retirer ceintures et vérins de coffre pendant le dégarnissage.","Couper progressivement dans le sens de la longueur ; écraser les montants larges à l’écarteur possible.","Ordre 1-6 pour limiter les allers-retours ; numéroter les coupes possible.","Un équipier de chaque côté maintient le pavillon.","Pare-brise : trait de coupe unique au niveau des traits des montants.","Évacuer vers l’arrière (éventuellement vers l’avant) : attention chute, ne pas heurter la victime.","Protections, calage."]],
 ["Quand",["Après gestion des sièges, victime non critique et temps disponible.","Option rapide sur ancienne génération.","Montants non renforcés et FAD favorable."]]],
o:["« Coupe 1 : A droit, le plus loin. On tourne, on finit par le A gauche, côté victime. »"],
p:["Pavillon : on commence par un montant A, contrairement au demi-pavillon complet (montant B)."]},

{id:"3eporte",ch:"roues",t:"Troisième porte",src:"Référentiel 6.5",
cle:"Sur véhicule 3 portes (2 portes), notamment avec 4 victimes. Marquage légèrement au-dessus de la banquette, amorce à la cisaille en haut du cadre de glace, scie sabre, finir par le haut du montant B.",
b:[["Déroulé",["Ouvrir la porte avant, couper l’arrêt de porte, fixer à la corde à cliquet.","Dégarnir, charte avec la FAD ; marquer légèrement au-dessus de la banquette ; dégarnir la paroi intérieure.","Première amorce à la cisaille en haut du cadre de glace ; scie sabre en suivant le marquage, en surveillant l’intérieur.","VEA : vérifier qu’aucun système ne passe dans le bas de caisse ; doute = autre technique.","Finir par le haut du montant B à la cisaille : il ne rentre pas dans l’habitacle et l’énergie de coupe part vers le sol.","Retirer, vérifier le calage, protéger. Réalisable entièrement à la cisaille (long).","Urgence absolue : amorces en haut et bas du B (x2), puis pliage (écarteur/vérin en tension ou pincer l’aile et laisser le poids de l’écarteur plier)."]]],
o:[],p:["Toujours finir par le haut du montant B."]},

{id:"voieam",ch:"roues",t:"Voie américaine",src:"Référentiel 6.6",
cle:"Ouvrir la porte arrière, écarteur entre la base du montant B (pas sur l’enrouleur) et la structure de caisse, déchirer la base, couper le sommet du B, basculer portes + montant vers l’avant.",
b:[["Déroulé",["Ouverture porte arrière ; dégarnir, charte.","Écarteur (ou vérin) entre la base du B et sous la banquette/bas de caisse ; ne pas s’appuyer directement sur l’enrouleur.","Ouvrir pour déchirer la base ; finir à la cisaille ou scie sabre si besoin. Difficile, déconseillée voire interdite (FAD) sur les récents.","Couper le sommet du B (coupe en V dans le pavillon selon FAD).","Basculer l’ensemble vers l’avant avec les charnières de la porte avant ; sécuriser à la corde à cliquet.","Renforcer le calage sous le montant B possible.","Alternative : coupe de fragilisation en haut du B, écarteur dans la coupe, puis vérin en substitution ; laisser le vérin avec un personnel."]]],
o:[],p:[]},

{id:"laterale",ch:"roues",t:"Latérale",src:"Référentiel 6.7",
cle:"Ouvrir porte avant (fixée) et arrière, couper la base du montant B (au-dessus ou au-dessous de la charnière basse arrière), finir par le haut du B à la cisaille, au plus près du pavillon.",
b:[["Déroulé",["Porte avant ouverte, arrêt coupé, fixée ; ouverture porte arrière ; dégarnir, charte, gérer la ceinture.","Couper au-dessus de la charnière basse (on enlève la porte) ou au-dessous (on la laisse).","Base du B : en plusieurs fois (1, 2, 3), coupe basse, partie la moins large ; coupe en V dans le bas de caisse possible.","Rester attentif à la pénétration de la lame ; VEA : rien dans le bas de caisse.","Finir par le haut du B à la cisaille, au plus près du pavillon ; tenir la partie découpée et la retirer ; calage, protections.","Avec la portière : couper le bloc porte, couper la base du B sous la charnière basse.","Alternative base trop large : 2 à 3 coupes en V sur la base, couper le haut en tirant le montant vers l’extérieur, plier jusqu’au sol."]]],
o:["« Base du B en V, deux coupes. Ensuite le haut du B en dernier, je tiens le montant. »"],
p:["Rendue difficile, déconseillée voire interdite sur les véhicules récents (bases renforcées, pyrotechnie, enrouleurs)."]},

/* ============ CÔTÉ ============ */
{id:"cotegen",ch:"cote",t:"VL sur le côté : choisir",src:"Référentiel 7.1",
cle:"Sécuriser, gérer les vitrages, recréer l’espace de vie. Puis charnière (demi-pavillon latéral), tunnel, ou demi-pavillon si la charnière est impossible.",
b:[["Repères",["Objectif : limiter le nombre d’actions ; sur nouvelle génération, découpe de montants chronophage voire impossible.","Charnière impossible (arbre, rocher, FAD), victime coincée sous le montant, ou axe 0° hors axe : tunnel ou demi-pavillon."]]],
o:[],p:[]},

{id:"charniere",ch:"cote",t:"Charnière (VL sur le côté)",src:"Référentiel 7.2",
cle:"Couper A, B, C au ras du pavillon, le pare-brise, coupe de décharge en partie basse du pavillon aux montants A et C, préparer un lit de cales, faire pivoter sans secousse aux ordres du CA.",
b:[["Déroulé",["Protéger victimes et sauveteurs ; dégarnir, charte.","Couper les montants au ras du pavillon (il ne gênera pas au sol) ; attention aux chutes de débris (cadres de portière) ; annoncer, maintenir le pavillon.","Vérifier en permanence la stabilisation ; couper le pare-brise si pas fait.","Coupe de décharge : trait horizontal au plus bas du pavillon, au-dessus des rails, au niveau des montants A et C ; évolutive.","Préparer un lit de cales ; pivoter sans secousse aux ordres du CA, prévenir le SUAP.","Caler le pavillon au sol ; ne pas se déplacer avec la victime et le plan dur sur le pavillon.","Protéger les coupes, revérifier le calage ; pousser à l’écarteur/vérin possible."]],
 ["Montants renforcés",["Découper horizontalement la partie haute du toit à la scie sabre (amorces cisaille) ; désigner une « sonnette » pour surveiller la lame.","Pare-brise en dernier (en diagonale si besoin) pour le rabattre sans qu’il tombe à l’intérieur.","Variantes : demi-toit, agrandir un toit ouvrant, quart de pavillon (victime debout, obstacles)."]]],
o:["« Lit de cales prêt. SUAP, on bascule le pavillon. À mon ordre… on accompagne, sans secousse. »"],
p:["Ne pas marcher sur le pavillon au sol avec la victime sur le plan dur."]},

/* ============ TOIT ============ */
{id:"toitgen",ch:"toit",t:"VL sur le toit : choisir",src:"Référentiel 8.1",
cle:"La gestion des sièges suffit souvent. Sinon : tunnel, demi-pavillon inversé (abaisser le pavillon, stabiliser le plancher), voile (accès arrière impossible).",
b:[["Repères",["Lever le véhicule a peu d’intérêt (partie lourde en haut) ; pas d’intérêt à faire entrer un SP debout.","Voile : accès arrière impossible, demi-pavillon inversé impossible, axe 0° hors de cet axe, ou bilan imposant plus de rapidité."]]],
o:[],p:[]},

{id:"dpi",ch:"toit",t:"Demi-pavillon inversé",src:"Référentiel 8.2",
cle:"Compléter le calage (Stab Fast), enlever le hayon, gérer banquette et sièges, couper C et B (ras du pavillon), décharge entre A et B, retirer les cales escalier et abaisser le pavillon en le retenant ; vérin si nécessaire, jamais dans l’axe de sortie.",
b:[["Déroulé",["Calage + Stab Fast ; hayon enlevé ; banquette retirée ou démontée ; sièges avant allongés.","Couper C et B au ras du pavillon (le B pas toujours nécessaire : décharge en biais ou droite avant les montants).","Coupe de décharge entre A et B (cisaille ou scie sabre) ; barre de renfort : la décharger si on ne coupe pas les B.","Vérifier la stabilisation (étais, cales, nature du sol).","Retirer les cales escalier, abaisser le pavillon en le retenant ; ne pas écraser les sangles d’étais passant sous le toit.","Protections de coupe ; dégagement complet possible en coupant les A et le pare-brise.","Vérin si nécessaire : pas dans l’axe de sortie ; cales stables sous le pied ; pas de cale en tête sauf si elle s’enfonce (à maintenir).","Développer jusqu’à l’espace suffisant ; manœuvre dangereuse, coordination ; ajuster les étais (calage évolutif).","Deux vérins possibles ; personne au vérin ou reprise de stabilisation vérifiée."]],
 ["Alternative",["Pavillon trop déformé : découpe de tôle fine à la scie sabre (pas sur les rails), cale escalier sous le toit pendant la découpe (vibrations), accompagner le pavillon jusqu’au sol."]]],
o:["« Cales escalier retirées une par une, vous retenez le pavillon, on descend doucement. »"],
p:["Vérin jamais dans l’axe de sortie de la victime."]},

{id:"voile",ch:"toit",t:"Voile",src:"Référentiel 8.3",
cle:"Équivalent de la latérale sur le toit. Ouvrir portes avant et arrière, couper la base du B (10 cm de part et d’autre, plus loin sur les récents), puis le haut du B en dernier, relever le B par-dessus le véhicule.",
b:[["Déroulé",["Calage (Stab Fast si besoin), vitrage côté ouverture.","Porte avant : couper le cadre de glace et l’arrêt de porte, fixer à la corde à cliquet ; ouvrir la porte arrière.","Dégarnir, charte ; couper de part et d’autre de la base du B côté châssis : 10 cm, davantage sur les véhicules récents ; tout le bas de caisse doit être sectionné.","VEA : rien dans le bas de caisse, sinon autre technique.","Réajuster le calage, faire tenir la porte.","Couper le B en partie haute EN DERNIER, au plus près du pavillon (V possible).","Contrôler le calage, relever le montant B par-dessus le véhicule, sécuriser à la corde à cliquet, protéger.","Alternatives : couper le B au-dessus de l’enrouleur (si FAD et dégarnissage), garder la porte, incliner le montant vers le bas."]]],
o:[],p:["Enchaînement de techniques simples, peu de coupes, sortie plus rapide."]},

/* ============ SPÉCIFIQUES ============ */
{id:"relocgen",ch:"spe",t:"Relocalisation : généralités",src:"Référentiel 9.1",
cle:"En dernier recours, très grande maîtrise. Faire reprendre du volume à un véhicule encastré ou couché contre un obstacle quand la sortie est impossible.",
b:[["Indications",["Pas d’accès aux pieds ; gêne de la console centrale ; reformation impossible (arbre) ; impossibilité de sortir dans l’axe (lésions du bassin probables) ; peu de place au pare-brise/lunette ; travail en hauteur difficile.","Le sol doit permettre le déplacement.","Garantir la solidité des points d’amarrage ; souplesse et coordination."]]],
o:[],p:[]},

{id:"remiseroues",ch:"spe",t:"Remettre un véhicule sur ses roues",src:"Référentiel 9.2",
cle:"1) Caler, 2 sangles sous le châssis · 2) au crochet du treuil/tirefort · 3) basculer au vérin grande longueur jusqu’au point d’équilibre · 4) le treuil accompagne au sol · 5) stabiliser 4-5 points.",
b:[["Points clés",["Un écureuil maintient la tête de la victime pendant toute la manœuvre ; il est la « sonnette », position stable, anticipe la descente.","Zone de retournement libre et stable ; point fixe fiable.","Véhicule en point fixe : caler, frein à main, clés retirées, vitesse engagée.","Point fixe ou véhicule à l’opposé du côté du retournement.","Calage côté pavillon (cales escalier + cales de roues) ; calage côté roues retiré une fois le dispositif en tension.","Dégonfler les roues limite le glissement.","Deux élingues (triangles des deux roues ou partie basse) ; au montant B : le plus haut possible.","Longueur utile de câble = distance au véhicule + hauteur du pavillon.","Enlever le système de traction et caler."]]],
o:["« Écureuil, tu tiens la tête et tu me parles pendant toute la bascule. Treuil : tu accompagnes, sans à-coup. »"],p:[]},

{id:"deplacer",ch:"spe",t:"Déplacer un véhicule d’un obstacle",src:"Référentiel 9.3",
cle:"1) Déplacer de 50 cm maximum · 2) reprendre le volume · 3) extraire. Points d’accroche fixes, solides, au plus près du sol.",
b:[["Points clés",["Écureuil au maintien tête pendant toute la manœuvre.","Encastrement : mouflage parfois nécessaire ; baliser la zone, protéger le câble.","Au moindre doute, stopper et changer de technique.","Sur roues : prévoir la trajectoire une fois débloqué, frein à main, cales en butée ; caler 4-5 points avant de retirer la traction.","Sur le côté : calage primaire côté pavillon, secondaire (étais côté roues) ; câble sur les deux roues basses ; étai côté pavillon accompagné pendant le dégagement.","Faire glisser : morceaux de pare-brise, bouclier, émulseur ou pelle sous les roues ; pare-brise coupé sous les étais.","Hydraulique (écarteur, vérin) en complément, jamais en appui au niveau de la victime ; coussins comme pivot."]]],
o:[],p:["50 cm suffisent."]},

{id:"levage",ch:"spe",t:"Levage et soulèvement",src:"Référentiel 9.4-9.5",
cle:"Estimer la masse, choisir l’outil, caler, 2 points de levage pour charges lourdes ou en déséquilibre, soulever avec contre-calage permanent, dégager.",
b:[
 ["Coussins de levage",["Caler en 4 points (en priorité côté victime) pour un levage linéaire et stable.","Lire les spécificités de la marque ; souvent : pas de cale au-dessus, pas plus de deux coussins superposés.","Deux coussins : le plus gros en dessous ; plus il est déployé, moins il est puissant et stable.","Robinets de fermeture (soupape de surpression) ; dérouler totalement les flexibles ; pupitre raccordé à une bouteille d’ARI ; visuel sur toute la manœuvre.","Jeu de cales pour suivre le levage ; neutraliser les suspensions à la sangle si la victime est sous une roue.","Deux voitures superposées ou charge dessus : sangler l’ensemble en un bloc unique."]],
 ["Écarteur",["Mêmes règles ; électroportatif = gain de temps ; cale coin au sol pour une levée droite ; points durs."]],
 ["Charges lourdes",["Étais à rattrapage automatique."]]
],
o:["« Contre-calage à chaque centimètre. On lève, on cale, on lève, on cale. »"],
p:["Le plus gros coussin TOUJOURS en dessous."]},

/* ============ CONTEXTE ============ */
{id:"acteurs",ch:"ctx",t:"Acteurs & partenaires",src:"GDO ch.1 §6 · ch.3 · ch.5",
cle:"Binôme COS-exploitant. Police de la circulation : police ou gendarmerie. Régulation de la circulation et réouverture : pas les SP.",
b:[["Rôles",["Exploitant : signalisation pour protéger les intervenants, info usagers (PMV, 107.7), organisation de la circulation, enlèvement des véhicules, fret, mise en sécurité des non-blessés, remise en état.","FDO : mise en sécurité, restrictions de circulation, aide à la progression, info autorités, ordre public, constatations ; en l’absence d’exploitant, enlèvement des véhicules ; décide du rétablissement de la circulation avec le COS après avis de l’exploitant.","Spécialistes (VSR…) : le chef de détachement se met sous les ordres du COS, recueille mission, intentions, temps imparti, spécificités ; le COS valide son idée de manœuvre.","Désengagement coordonné ; ne pas garder sur place les engins dont la mission est terminée ; après l’opération, le code de la route s’applique sans dérogation.","Nettoyage de chaussée possible, en sécurité, sans jamais se prononcer sur la réouverture."]],
 ["Réseau routier",["Autoroute : V1 voie de droite… V4 voie de gauche ; bornes d’appel tous les 2 km.","Hauteur libre sous pont d’autoroute 4,75 m, autres routes 4,30 m.","Cartouches : A/N blanc sur rouge, D noir sur jaune, M et T blanc sur bleu, C noir sur blanc."]]],
o:[],p:[]},

{id:"tunnels",ch:"ctx",t:"Tunnels routiers : l’essentiel",src:"GDO ch.1 §1.3.2 · ch.2 §1.2 · ch.5 §3.5",
cle:"La lutte contre le feu n’est pas l’objectif prioritaire : d’abord l’évacuation et le sauvetage. Progression dans le sens d’évacuation des fumées.",
b:[["Repères",["Un incendie de PL est l’événement le plus redouté ; VL 2-8 MW, PL 30-100 MW, PL TMD ~200 MW.","Vitesse de fuite des usagers : 1 m/s normal, 0,5 m/s visibilité dégradée, 0,3 m/s sans visibilité.","Niches de sécurité tous les 150-200 m (ne protègent pas du feu) ; niches incendie tous les 200 m ; abris tous les 200-400 m.","Contre-sens : voie de droite, feux de croisement + détresse + gyrophares, 30 km/h, 20 m entre engins.","Désenfumage : géré par l’exploitant.","Gaz en tunnel : réflexion des torchères, effets d’explosion accentués, confinement.","Binational : CGOS confié au pays où advient l’accident."]]],
o:[],p:[]},

{id:"ecarts",ch:"ctx",t:"Écarts entre documents : les pièges",src:"Synthèse de tes 5 documents",
cle:"Le référentiel départemental et les FRO s’appliquent au SDIS 88 ; le GDO donne le cadre national. Connais les deux versions.",
b:[["À connaître",["Masque : FFP3 obligatoire (FRO 50, vitrages + montants carbone) ; « FFP2 obligatoire » dans le texte du référentiel 1.7 alors que le matériel liste des FFP3 ; GDO a minima FFP2.","Marquage énergie : SDIS 88 (EL, HE, H2, GNV, GPL, GO, ESS, en jaune) ≠ GDO (ES, GO, H², GPL-GNV-GNC, VE, HY).","Vocabulaire victime : sortie seule / piégée / incarcérée / éjectée (88) ≠ accessible / incarcérée / éjectée (GDO).","Zonage : chantier 3-5 m / 5-10 m (FRO 50, référentiel) ≠ zonage opérationnel réflexe 50 m / 100 m (GDO) ; feux de véhicules a priori 50 m.","Sécurisation des techniques : 3D (FRO 51) vs immobilisation + dégarnissage + marquage (GDO).","Verre trempé : 5 fois (FRO 50) vs 3 à 5 fois (GDO) plus résistant qu’un verre classique.","Port de l’outil « comme un enfant » : au-dessus de la ceinture (référentiel) / au-delà de l’abdomen (GDO).","Emplacement du marquage énergie : près du réservoir (88) / capot avant ou montant arrière gauche (GDO)."]]],
o:[],p:[]}
];

{th:"cmd",ty:"multi",q:"Quelles situations justifient un dégagement d’urgence selon le tableau du référentiel ?",o:["Feu de véhicule","Arrêt cardiaque","Traumatisme crânien","Hémorragie non contrôlée"],a:[0,1],x:"Feu et arrêt cardiaque : danger réel, vital, immédiat et non contrôlable.",s:"Référentiel 1.1"},
{th:"cmd",ty:"qcm",q:"Dans le vocabulaire du référentiel SDIS 88, une victime qui ne peut pas sortir seule à cause de ses blessures, sans compression de la structure, est dite…",o:["Accessible","Piégée","Incarcérée","Impliquée"],a:1,x:"Piégée : ne peut sortir seule, soit par ses blessures, soit par la déformation de la structure. Incarcérée = élément intrusif ou compressif sur la victime. « Accessible » est le terme du GDO.",s:"Référentiel 1.1"},
{th:"cmd",ty:"qcm",q:"Pour le GDO, une victime est dite incarcérée quand…",o:["Elle ne peut pas sortir seule du véhicule","Elle est en état critique et coincée","La déformation du véhicule la comprime et impose des outils combinés dans une manœuvre souvent longue, indépendamment de sa gravité","Elle est coincée sous un autre véhicule ou un obstacle"],a:2,x:"GDO : définition dissociée de l’état de gravité. À l’inverse, la notion d’éjection doit être associée à un critère de gravité.",s:"GDO ch.2 §2.2.1"},

{th:"cmd",ty:"ordre",q:"Remets les 5i dans l’ordre.",o:["Identifier","Inspecter","Interdire","Immobiliser","Isoler"],x:"Moyen mnémotechnique des 5i (FRO 51, GDO).",s:"FRO 51 · GDO ch.5 §4.2"},
