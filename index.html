    return html + `<div class="ctable">${CHIFFRES.map(([v,m,s])=>`<div class="cr"><b>${esc(v)}</b><span>${esc(m)} <span class="src">${esc(s)}</span></span></div>`).join("")}</div>`;
  }
  if(!cur.deck){ cur.deck = shuffle(CHIFFRES.map((_,i)=>i)); cur.di=0; cur.flip=false; cur.known=0; cur.failed=[]; }
  if(cur.di>=cur.deck.length){
    return html + `<section class="card" style="text-align:center"><div class="score">${cur.known}/${CHIFFRES.length}</div><p style="font-weight:700;margin:6px 0 0">repères sus du premier coup</p></section><button class="btn primary" data-act="deck-again">Rebattre les cartes</button>`;
  }
  const [v,m,s] = CHIFFRES[cur.deck[cur.di]];
  const front = mode==="flash" ? `<span class="v">${esc(v)}</span>` : `<span class="m">${esc(m)}</span>`;
  const back = mode==="flash" ? `<span class="m">${esc(m)}</span>` : `<span class="v">${esc(v)}</span>`;
  html += `<div class="flash-meta"><span class="pill">Carte ${cur.di+1} / ${cur.deck.length}</span><span class="pill">${cur.known} sue${cur.known>1?"s":""}</span></div>
  <button class="plate" data-act="flip" aria-label="Retourner la carte" style="width:100%;cursor:pointer">${cur.flip ? `<span>${back}<br><span class="src" style="margin-top:8px;background:rgba(255,255,255,.35);color:#111;border-color:#111">${esc(s)}</span></span>` : `<span>${front}<br><span style="font-size:13px;opacity:.75">Touche pour retourner</span></span>`}</button>`;
  if(cur.flip) html += `<div class="row"><button class="btn" data-act="deck-no" style="flex:1">À revoir</button><button class="btn primary" data-act="deck-yes" style="flex:1">Je savais</button></div>`;
  return html;
}


/* ---------- Photos du référentiel ---------- */
const GAL = {};
function loadGallery(fid){
  const box = $("#gal"); if(!box) return;
  const show = items => {
    const g = $("#gal"); if(!g || g.dataset.f!==fid) return;
    const groups = {};
    items.forEach((it,i)=>{ (groups[it.b||"top"] = groups[it.b||"top"] || []).push(i); });
    document.querySelectorAll(".iph").forEach(c=>{
      const ids = groups[c.dataset.b]; if(!ids) return;
      if(!document.querySelector(`.blk .iph[data-b="${c.dataset.b}"]`) && c.dataset.b!=="top") return;
      c.innerHTML = (c.dataset.b==="top"?`<div class="eyebrow" style="margin-bottom:6px">En un coup d’œil</div>`:"") + `<div class="mini">${ids.map(i=>{ const it=items[i]; return `<button data-ph="${i}" aria-label="Agrandir la photo, page ${it.p}"><img src="${it.d}" alt="" loading="lazy" width="${it.w}" height="${it.h}"></button>`; }).join("")}</div>`;
    });
    // photos rattachées à une étape absente : en tête
    const st=$("#phstate"); if(st) st.textContent = items.length+" photos placées sous les étapes · touche pour agrandir";
    document.querySelectorAll("[data-ph]").forEach(b=>b.onclick=()=>openLb(items,+b.dataset.ph));
  };
  if(GAL[fid]) return show(GAL[fid]);
  fetch("photos/"+fid+".json").then(r=>{ if(!r.ok) throw 0; return r.json(); }).then(j=>{ GAL[fid]=j; show(j); })
   .catch(()=>{ const l=$("#phstate"); if(l) l.textContent="Photos indisponibles sans réseau"; });
}
let LB=null;
function openLb(items,i){ LB={items,i,page:false,zoom:false}; drawLb(); }
function drawLb(){
  let el=$("#lb"); if(!LB){ if(el) el.remove(); document.body.style.overflow=""; return; }
  if(!el){ el=document.createElement("div"); el.id="lb"; el.className="lb"; el.setAttribute("role","dialog"); el.setAttribute("aria-modal","true"); document.body.appendChild(el); }
  document.body.style.overflow="hidden";
  const it=LB.items[LB.i];
  const src = LB.page ? "photos/p/"+it.p+".webp" : it.d;
  el.innerHTML = `<div class="bar"><button data-lb="close" aria-label="Fermer">✕</button><button data-lb="prev" aria-label="Photo précédente" ${LB.i?"":"disabled"}>‹</button><span class="sp">${LB.i+1} / ${LB.items.length}</span><button data-lb="next" aria-label="Photo suivante" ${LB.i<LB.items.length-1?"":"disabled"}>›</button><button data-lb="zoom">${LB.zoom?"Ajuster":"Zoom"}</button></div>
  <div class="stage ${LB.zoom?"zoom":""}"><img src="${src}" alt="${LB.page?"Page "+it.p+" du référentiel":"Photo du référentiel"}"></div>
  <div class="cap">${LB.page?`Page ${it.p} du référentiel SR.`:esc(it.c||"")}<div class="row" style="margin-top:8px;align-items:center"><span class="src">Référentiel SR · page ${it.p}</span><button class="btn" data-lb="page" style="min-height:38px;background:transparent;color:inherit;border-color:rgba(255,255,255,.3)">${LB.page?"Revenir à la photo":"Voir la page entière"}</button></div></div>`;
  el.querySelectorAll("[data-lb]").forEach(b=>b.onclick=()=>{
    const a=b.dataset.lb;
    if(a==="close") LB=null;
    else if(a==="prev" && LB.i>0){ LB.i--; LB.page=false; LB.zoom=false; }
    else if(a==="next" && LB.i<LB.items.length-1){ LB.i++; LB.page=false; LB.zoom=false; }
    else if(a==="zoom") LB.zoom=!LB.zoom;
    else if(a==="page"){ LB.page=!LB.page; LB.zoom=false; }
    drawLb();
  });
  linkify(el.querySelector(".cap"));
}
document.addEventListener("keydown",e=>{ if(!LB) return; if(e.key==="Escape"){LB=null;drawLb();} if(e.key==="ArrowRight"&&LB.i<LB.items.length-1){LB.i++;LB.page=false;drawLb();} if(e.key==="ArrowLeft"&&LB.i>0){LB.i--;LB.page=false;drawLb();} });

/* ---------- Lexique ---------- */
const ACR = {};
LEXIQUE.forEach(([k,d,t])=>{ if(t!=="a") return; k.split(" / ").forEach(x=>{ x=x.trim(); if(!/[()]/.test(x)) ACR[x]=[k,d]; }); });
const ACR_RE = new RegExp("(?<![A-Za-zÀ-ÿ0-9’'-])(" + Object.keys(ACR).sort((a,b)=>b.length-a.length).map(k=>k.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|") + ")(?![A-Za-zÀ-ÿ0-9’-])","g");
function linkify(root){
  if(!root) return;
  const tw=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>{
    let p=n.parentElement; while(p && p!==root){ if(p.tagName==="BUTTON"||p.tagName==="SELECT"||p.tagName==="INPUT"||p.classList.contains("acr")||p.classList.contains("noacr")) return NodeFilter.FILTER_REJECT; p=p.parentElement; }
    ACR_RE.lastIndex=0; return ACR_RE.test(n.nodeValue)?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_SKIP; }});
  const nodes=[]; while(tw.nextNode()) nodes.push(tw.currentNode);
  nodes.forEach(n=>{
    const frag=document.createDocumentFragment(); let last=0; const t=n.nodeValue; ACR_RE.lastIndex=0; let m;
    while((m=ACR_RE.exec(t))){ frag.appendChild(document.createTextNode(t.slice(last,m.index))); const s=document.createElement("span"); s.className="acr"; s.textContent=m[1]; s.dataset.acr=m[1]; s.tabIndex=0; frag.appendChild(s); last=m.index+m[1].length; }
    frag.appendChild(document.createTextNode(t.slice(last))); n.parentNode.replaceChild(frag,n);
  });
}
let popT=null;
function showPop(k){
  const e=ACR[k]; if(!e) return; let p=$("#pop");
  if(!p){ p=document.createElement("div"); p.id="pop"; p.className="pop"; p.setAttribute("role","status"); document.body.appendChild(p); }
  p.innerHTML=`<b>${esc(e[0])}</b>${esc(e[1])}`; clearTimeout(popT); popT=setTimeout(()=>p.remove(),6000);
}
document.addEventListener("click",e=>{ const a=e.target.closest(".acr"); if(a){ e.preventDefault(); e.stopPropagation(); showPop(a.dataset.acr); } else { const p=$("#pop"); if(p && !e.target.closest("#pop")) p.remove(); } },true);
document.addEventListener("keydown",e=>{ if((e.key==="Enter"||e.key===" ") && e.target.classList && e.target.classList.contains("acr")){ e.preventDefault(); showPop(e.target.dataset.acr); } });

function vLexique(){
  const q=norm(cur.lq||""); const f=cur.lf||"all";
  let list = LEXIQUE.filter(l=> f==="all" || l[2]===f).filter(l=>!q || norm(l[0]+" "+l[1]).includes(q));
  list = list.slice().sort((a,b)=>a[0].localeCompare(b[0],"fr",{sensitivity:"base"}));
  let html = `<div><div class="eyebrow">${LEXIQUE.filter(l=>l[2]==="a").length} sigles · ${LEXIQUE.filter(l=>l[2]==="t").length} termes techniques</div><h2 class="sec-title">Lexique</h2><p class="muted" style="margin:6px 0 0">Partout dans l’appli, les sigles soulignés en pointillés s’expliquent d’une touche.</p></div>
  <div class="field"><label for="inLex">Chercher un sigle ou un mot</label><input id="inLex" type="search" placeholder="ex. FLU, VEA, écureuil" value="${esc(cur.lq||"")}" autocomplete="off"></div>
  <div class="chips"><button data-lf="all" aria-pressed="${f==="all"}">Tout</button><button data-lf="a" aria-pressed="${f==="a"}">Sigles</button><button data-lf="t" aria-pressed="${f==="t"}">Termes techniques</button></div>`;
  if(!list.length) return html + `<div class="card empty">Rien trouvé pour « ${esc(cur.lq)} ».</div>`;
  html += `<div class="lex noacr">`; let L="";
  list.forEach(([k,d])=>{ const l=k[0].toUpperCase().normalize("NFD").replace(/[̀-ͯ]/g,""); const ll=/[0-9]/.test(l)?"#":l; if(ll!==L && !q){ html+=`<div class="letter">${ll}</div>`; L=ll; } html += `<div class="li"><b>${esc(k)}</b><span>${esc(d)}</span></div>`; });
  return html + `</div>`;
}

/* ---------- Événements ---------- */
function bind(){
  const v=$("#view");
  v.querySelectorAll("[data-goto]").forEach(b=>b.onclick=()=>go(b.dataset.goto));
  v.querySelectorAll("[data-train]").forEach(b=>b.onclick=()=>{ setup.n=20; startQuiz("training", b.dataset.train.split(",")); });
  v.querySelectorAll("[data-fiche]").forEach(b=>b.onclick=()=>{ cur.id=b.dataset.fiche; render(); window.scrollTo(0,0); });
  v.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{ setup.mode=b.dataset.mode; render(); });
  v.querySelectorAll("[data-theme]").forEach(b=>b.onclick=()=>{ const k=b.dataset.theme; setup.themes = setup.themes.includes(k)? setup.themes.filter(x=>x!==k) : setup.themes.concat(k); render(); });
  v.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>{ setup.n=+b.dataset.n; render(); });
  v.querySelectorAll("[data-opt]").forEach(b=>b.onclick=()=>{
    const R=cur.run, P=R.list[R.i], oi=+b.dataset.opt; if(P.done) return;
    if(P.q.ty==="multi"){ P.picked = P.picked.includes(oi)? P.picked.filter(x=>x!==oi) : P.picked.concat(oi); render(); }
    else answer(oi);
  });
  v.querySelectorAll("[data-seq]").forEach(b=>b.onclick=()=>{ const P=cur.run.list[cur.run.i]; P.seq.push(+b.dataset.seq); render(); });
  v.querySelectorAll("[data-cas]").forEach(b=>b.onclick=()=>{ cur={tab:"cas",cas:+b.dataset.cas,step:0,pts:0,choice:null,order:null}; render(); window.scrollTo(0,0); });
  v.querySelectorAll("[data-choice]").forEach(b=>b.onclick=()=>{ if(cur.choice!=null) return; cur.choice=+b.dataset.choice; cur.pts+=CAS[cur.cas].st[cur.step].o[cur.choice].v; render(); const fb=$(".fb"); if(fb) fb.scrollIntoView({behavior:"smooth",block:"nearest"}); });
  v.querySelectorAll("[data-cm]").forEach(b=>b.onclick=()=>{ cur={tab:"chiffres",cm:b.dataset.cm}; render(); });
  const sel=$("#selChap"); if(sel) sel.onchange=()=>{ cur.chap=sel.value; render(); };
  const ins=$("#inSearch"); if(ins){ ins.oninput=()=>{ cur.search=ins.value; const pos=ins.selectionStart; render(); const n=$("#inSearch"); n.focus(); try{n.setSelectionRange(pos,pos);}catch(e){} }; }
  v.querySelectorAll("[data-lf]").forEach(b=>b.onclick=()=>{ cur.lf=b.dataset.lf; render(); });
  const il=$("#inLex"); if(il){ il.oninput=()=>{ cur.lq=il.value; const pos=il.selectionStart; render(); const n=$("#inLex"); n.focus(); try{n.setSelectionRange(pos,pos);}catch(e){} }; }
  v.querySelectorAll("[data-act]").forEach(b=>b.onclick=()=>act(b.dataset.act));
  if(cur.tab==="quiz" && cur.run && cur.run.mode==="exam" && !cur.run.list[cur.run.i].done && !timerId) startTimer();
}
function act(a){
  const R=cur.run;
  switch(a){
    case "install": if(deferredPrompt){ deferredPrompt.prompt(); deferredPrompt.userChoice.finally(()=>{ deferredPrompt=null; render(); }); } break;
    case "dismiss": S.installDismissed=true; save(); render(); break;
    case "exam": setup.themes=[]; startQuiz("exam"); break;
    case "training": setup.mode="training"; go("quiz"); break;
    case "errors": startQuiz("errors"); break;
    case "sudden": startQuiz("sudden"); break;
    case "reset": cur.confirmReset=true; render(); break;
    case "reset-no": cur.confirmReset=false; render(); break;
    case "reset-yes": S.q={}; S.cas={}; save(); cur.confirmReset=false; render(); toast("Progression effacée"); break;
    case "back-fiches": cur.id=null; render(); window.scrollTo(0,0); break;
    case "all-themes": setup.themes=[]; render(); break;
    case "start": startQuiz(setup.mode); break;
    case "quit": if(R && R.answers.length) finish(); else { stopTimer(); cur={tab:"quiz"}; render(); } break;
    case "validate": { const P=R.list[R.i]; answer(null,false); break; }
    case "undo": { const P=R.list[R.i]; P.seq.pop(); render(); break; }
    case "next": next(); break;
    case "restart": startQuiz(cur.result.mode==="errors"?"errors":cur.result.mode); break;
    case "setup": cur={tab:"quiz"}; render(); break;
    case "cas-list": cur={tab:"cas"}; render(); break;
    case "cas-next": cur.step++; cur.choice=null; cur.order=null; render(); window.scrollTo(0,0); break;
    case "flip": cur.flip=!cur.flip; render(); break;
    case "deck-yes": if(!cur.failed.includes(cur.deck[cur.di])) cur.known++; cur.di++; cur.flip=false; render(); break;
    case "deck-no": if(!cur.failed.includes(cur.deck[cur.di])) cur.failed.push(cur.deck[cur.di]); cur.deck.push(cur.deck[cur.di]); cur.di++; cur.flip=false; render(); break;
    case "allph": if(cur.id && GAL[cur.id]) openLb(GAL[cur.id],0); break;
    case "deck-again": cur.deck=null; render(); break;
  }
}
function toast(msg){ const t=document.createElement("div"); t.className="toast"; t.textContent=msg; t.setAttribute("role","status"); document.body.appendChild(t); setTimeout(()=>t.remove(),2200); }

/* ---------- Démarrage ---------- */
const h = location.hash.slice(1);
cur.tab = TABS.includes(h) ? h : "accueil";
render();
setInterval(updateChip, 60000);
})();
