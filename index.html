<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Agrès SR</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#C8102E">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>body{margin:0}:root{padding-top:env(safe-area-inset-top,0px)}[hidden]{display:none!important}img{max-width:100%}</style>
<script>if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout : appli mobile à une colonne (max 760px), en-tête collant + barre d'onglets en bas.
   Monde visuel : chantier SR — tôle et asphalte, rouge SP, jaune du crayon carrosserie, hachures « coupe interdite », orange HT. */
:root{
  --bg:#EEF1F4; --surface:#FFFFFF; --surface2:#E3E8EE; --ink:#151A21; --muted:#56606D; --line:#CDD4DD;
  --accent:#C8102E; --accent-ink:#FFFFFF; --mark:#F2B705; --mark-soft:#FBE7A1; --ok:#1C7A4B; --ok-soft:#D7F0E2;
  --bad:#B4232F; --bad-soft:#F8DADD; --ht:#E8590C; --plate:#F28C00; --plate-ink:#111;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11151A; --surface:#1A2027; --surface2:#232B34; --ink:#E8ECF1; --muted:#9BA6B4; --line:#2E3843;
  --accent:#EF4A5F; --accent-ink:#14080A; --mark:#F5C431; --mark-soft:#4A3E12; --ok:#47C98A; --ok-soft:#163527;
  --bad:#F06A74; --bad-soft:#3B1A1E; --ht:#FF7A33; --plate:#E98300; --plate-ink:#0B0B0B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11151A; --surface:#1A2027; --surface2:#232B34; --ink:#E8ECF1; --muted:#9BA6B4; --line:#2E3843;
  --accent:#EF4A5F; --accent-ink:#14080A; --mark:#F5C431; --mark-soft:#4A3E12; --ok:#47C98A; --ok-soft:#163527;
  --bad:#F06A74; --bad-soft:#3B1A1E; --ht:#FF7A33; --plate:#E98300; --plate-ink:#0B0B0B; color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
*{box-sizing:border-box}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--mark);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.1}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* En-tête */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.badge-sr{width:34px;height:34px;border-radius:7px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:18px;letter-spacing:.02em;flex:none;position:relative;overflow:hidden}
.badge-sr::after{content:"";position:absolute;inset:auto 0 0 0;height:6px;background:repeating-linear-gradient(135deg,var(--mark) 0 5px,transparent 5px 10px)}
.brand h1{font-size:24px;font-weight:700;letter-spacing:.01em}
.brand small{display:block;font-size:12px;color:var(--muted);font-family:var(--f-body);font-weight:400;letter-spacing:.02em}
.chip-j{margin-left:auto;font-family:var(--f-mono);font-size:13px;padding:5px 9px;border-radius:999px;border:1px solid var(--line);background:var(--surface2);white-space:nowrap}

main{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
main .wrap{padding-block:18px;display:flex;flex-direction:column;gap:18px}

/* Navigation basse */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
nav.tabs button{background:none;border:0;padding:8px 0 9px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted);letter-spacing:.02em}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--accent);font-weight:700}

/* Éléments communs */
.lane{height:4px;background:repeating-linear-gradient(90deg,var(--line) 0 30px,transparent 30px 130px);border-radius:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.eyebrow{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.08em;font-size:13px;color:var(--muted);font-weight:600}
.sec-title{font-size:26px;font-weight:700}
.muted{color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:11px 14px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap}
.src{font-family:var(--f-mono);font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:2px 6px;display:inline-block}
.mark{background:linear-gradient(transparent 58%,var(--mark-soft) 58%);padding:0 2px}
.pill{font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--surface2);color:var(--muted);letter-spacing:.02em;white-space:nowrap}

/* Installation */
.install{border:2px solid var(--accent);border-radius:var(--r);background:var(--surface);padding:14px 16px;display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start}
.install .ic{width:44px;height:44px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.install h3{font-size:20px}
.install p{margin:4px 0 10px;font-size:14px;color:var(--muted)}
.install ol{margin:6px 0 10px;padding-left:20px;font-size:14px}

/* Hero accueil */
.hero{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.hero .band{height:10px;background:repeating-linear-gradient(135deg,var(--accent) 0 12px,var(--surface) 12px 24px)}
.hero .in{padding:16px;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:end}
.hero h2{font-size:30px;font-weight:700}
.count{font-family:var(--f-display);text-align:right}
.count b{font-size:56px;line-height:.9;display:block;color:var(--accent);font-weight:700}
.count span{font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.stat b{font-family:var(--f-mono);font-size:22px;display:block;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.quick button{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:4px;min-height:92px}
.quick button b{font-family:var(--f-display);font-size:20px;font-weight:700}
.quick button span{font-size:13px;color:var(--muted)}
.quick button.hot{border-color:var(--accent);box-shadow:inset 4px 0 0 var(--accent)}
.plan{display:flex;flex-direction:column;gap:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.plan .d{display:grid;grid-template-columns:64px 1fr;gap:10px;padding:10px 14px;border-top:1px solid var(--line);align-items:center}
.plan .d:first-child{border-top:0}
.plan .d .j{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.plan .d.today{background:var(--mark-soft)}
.plan .d.today .j{color:var(--ink);font-weight:600}
.plan .d.past{opacity:.55}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:minmax(0,1fr) 110px 42px;gap:10px;align-items:center;font-size:14px}
.bar .t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .g{height:8px;background:var(--surface2);border-radius:4px;overflow:hidden}
.bar .g i{display:block;height:100%;background:var(--ok)}
.bar .g i.lo{background:var(--bad)}
.bar .g i.mid{background:var(--mark)}
.bar .p{font-family:var(--f-mono);font-size:13px;text-align:right;color:var(--muted)}

/* Fiches */
.filters{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px;font-weight:700}
.field select,.field input{width:100%;min-height:46px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px}
.flist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.flist button{all:unset;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:13px 14px;border-top:1px solid var(--line);align-items:center}
.flist button:first-child{border-top:0}
.flist button:focus-visible{outline:3px solid var(--mark);outline-offset:-3px}
.flist .ft{font-weight:700}
.flist .fc{font-size:13px;color:var(--muted);display:block;margin-top:2px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.chapter-h{font-family:var(--f-display);font-size:14px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:10px 14px 6px;background:var(--surface2);border-top:1px solid var(--line);font-weight:600}
.chapter-h:first-child{border-top:0}
.fiche h2{font-size:30px;font-weight:700;margin-top:4px}
.fiche .cle{font-size:17px;margin:12px 0 0;padding:12px 14px;border-left:5px solid var(--mark);background:var(--surface2);border-radius:0 8px 8px 0}
.blk h3{font-size:20px;font-weight:700;margin:0 0 8px}
.blk ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.blk li{max-width:68ch}
.ordres{border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.ordres .hd{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);font-family:var(--f-display);font-size:18px;font-weight:700}
.ordres .hd svg{color:var(--accent)}
.ordres p{margin:0;padding:10px 14px;border-top:1px dashed var(--line);font-style:italic}
.ordres p:first-of-type{border-top:0}
.ordres small{display:block;padding:8px 14px 12px;color:var(--muted);font-size:12px}
.pieges{border-radius:var(--r);overflow:hidden;border:1px solid var(--bad)}
.pieges .hd{padding:8px 14px;font-family:var(--f-display);font-size:18px;font-weight:700;color:#fff;background:repeating-linear-gradient(135deg,var(--bad) 0 10px,#8E1823 10px 20px)}
.pieges ul{margin:0;padding:12px 14px 12px 32px;background:var(--bad-soft);display:flex;flex-direction:column;gap:6px}
.backbar{display:flex;align-items:center;gap:10px}

/* Quiz */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:14px;min-height:38px}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.seg{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px;text-align:left;min-height:64px}
.seg button b{display:block;font-family:var(--f-display);font-size:18px}
.seg button span{font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{border:2px solid var(--accent);padding:9px}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.prog{height:6px;background:var(--surface2);border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);transition:width .25s}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 16px;display:flex;flex-direction:column;gap:14px}
.qcard .q{font-size:19px;font-weight:700;line-height:1.35}
.typetag{font-family:var(--f-display);font-size:13px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--accent)}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{all:unset;cursor:pointer;display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;align-items:start;border:1px solid var(--line);border-radius:9px;padding:12px;background:var(--surface)}
.opt:focus-visible{outline:3px solid var(--mark);outline-offset:2px}
.opt .k{width:28px;height:28px;border-radius:6px;border:1px solid var(--line);display:grid;place-items:center;font-family:var(--f-mono);font-size:13px;background:var(--surface2)}
.opt[aria-pressed="true"]{border:2px solid var(--ink);padding:11px}
.opt.good{border:2px solid var(--ok);background:var(--ok-soft);padding:11px}
.opt.wrong{border:2px solid var(--bad);background:var(--bad-soft);padding:11px}
.opt.locked{cursor:default}
.seq{display:flex;flex-direction:column;gap:8px;min-height:20px}
.seq .it{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;align-items:start;padding:10px 12px;border:1px dashed var(--line);border-radius:9px;background:var(--surface2)}
.seq .it .n{font-family:var(--f-mono);font-weight:600}
.fb{border-radius:9px;padding:12px 14px;font-size:15px}
.fb.ok{background:var(--ok-soft);border:1px solid var(--ok)}
.fb.ko{background:var(--bad-soft);border:1px solid var(--bad)}
.fb b.v{font-family:var(--f-display);font-size:19px;display:block;margin-bottom:4px}
.timer{font-family:var(--f-mono);font-size:14px;padding:3px 8px;border-radius:6px;background:var(--surface2)}
.timer.low{background:var(--bad);color:#fff}
.score{font-family:var(--f-display);font-size:64px;font-weight:700;line-height:1;color:var(--accent)}
.review{display:flex;flex-direction:column;gap:10px}
.review .r{border:1px solid var(--line);border-left:5px solid var(--bad);border-radius:8px;padding:10px 12px;background:var(--surface);font-size:14px}
.review .r.okr{border-left-color:var(--ok)}

/* Cas concrets */
.case-list{display:grid;grid-template-columns:1fr;gap:10px}
.case-list button{all:unset;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:4px}
.case-list button:focus-visible{outline:3px solid var(--mark)}
.case-list b{font-family:var(--f-display);font-size:21px}
.situ{background:var(--surface2);border-radius:9px;padding:12px 14px;font-size:15px}

/* Chiffres : plaques type TMD */
.plate{background:var(--plate);color:var(--plate-ink);border:4px solid #111;border-radius:6px;min-height:150px;display:grid;place-items:center;text-align:center;padding:16px;position:relative}
.plate::after{content:"";position:absolute;left:10px;right:10px;top:50%;border-top:3px solid #111;opacity:.0}
.plate .v{font-family:var(--f-mono);font-weight:600;font-size:34px;line-height:1.15;letter-spacing:.01em}
.plate .m{font-size:17px;font-weight:700;line-height:1.35}
.flash-meta{display:flex;justify-content:space-between;align-items:center;gap:10px}
.ctable{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.ctable .cr{display:grid;grid-template-columns:minmax(110px,38%) minmax(0,1fr);gap:12px;padding:10px 14px;border-top:1px solid var(--line);font-size:14px}
.ctable .cr:first-child{border-top:0}
.ctable .cr b{font-family:var(--f-mono);font-size:14px}

.empty{padding:22px;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);padding:10px 14px;border-radius:8px;font-size:14px;z-index:20}


/* Photos du référentiel */
.gal{display:flex;flex-direction:column;gap:10px}
.gal .hd{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.strip{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px;-webkit-overflow-scrolling:touch}
.strip button{all:unset;cursor:pointer;flex:none;width:min(72vw,300px);scroll-snap-align:start;background:var(--surface);border:1px solid var(--line);border-radius:9px;overflow:hidden;display:flex;flex-direction:column}
.strip button:focus-visible{outline:3px solid var(--mark)}
.strip .ph{height:190px;background:var(--surface2);display:grid;place-items:center;overflow:hidden}
.strip img{width:100%;height:100%;object-fit:cover}
.strip .cp{font-size:13px;padding:8px 10px;color:var(--ink);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;min-height:3.2em}
.strip .pg{font-family:var(--f-mono);font-size:11px;color:var(--muted);padding:0 10px 8px}
.gal-load{padding:30px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:9px}
.lb{position:fixed;inset:0;z-index:30;background:#0B0D10;color:#EEF1F4;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.lb .bar{display:flex;align-items:center;gap:8px;padding:10px max(12px,env(safe-area-inset-right,0px)) 10px max(12px,env(safe-area-inset-left,0px))}
.lb .bar button{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:8px;min-height:42px;min-width:42px;padding:6px 12px;font-weight:700}
.lb .bar .sp{flex:1;font-family:var(--f-mono);font-size:13px;opacity:.8;text-align:center}
.lb .stage{flex:1;overflow:auto;display:flex;align-items:flex-start;justify-content:center;touch-action:pan-x pan-y pinch-zoom}
.lb .stage img{max-width:100%;height:auto;margin:auto;display:block}
.lb .stage.zoom img{max-width:none;width:220%}
.lb .cap{padding:12px max(16px,env(safe-area-inset-left,0px));font-size:15px;line-height:1.45;max-height:30vh;overflow:auto;border-top:1px solid rgba(255,255,255,.15)}
.lb .cap .src{color:#cfd6de;border-color:rgba(255,255,255,.3)}
.phbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.iph:empty{display:none}
.iph.top{display:block}
.mini{display:flex;gap:8px;overflow-x:auto;margin:8px 0 4px;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.mini button{all:unset;cursor:pointer;flex:none;height:150px;max-width:88%;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:var(--surface2)}
.mini button:focus-visible{outline:3px solid var(--mark)}
.mini img{height:100%;width:auto;max-width:100%;object-fit:cover;display:block}
.iph.top .mini button{height:190px}
/* Lexique et acronymes */
.acr{border-bottom:1.5px dotted var(--muted);cursor:help}
.lex{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.lex .li{display:grid;grid-template-columns:minmax(80px,30%) minmax(0,1fr);gap:12px;padding:11px 14px;border-top:1px solid var(--line);font-size:15px}
.lex .li:first-child{border-top:0}
.lex .li b{font-family:var(--f-display);font-size:19px;line-height:1.2;word-break:break-word}
.lex .letter{font-family:var(--f-display);font-weight:700;font-size:15px;padding:6px 14px;background:var(--surface2);border-top:1px solid var(--line);color:var(--muted)}
.lex .letter:first-child{border-top:0}

/* Fiches de révision — sources : GDO DGSCGC « Opérations de secours en milieu routier » (juil. 2025),
   Référentiel départemental SR SDIS 88 (v1 janv. 2023), FRO 50 Sécurité SR (janv. 2023),

const CHAPITRES = [

  ["ouv","Ouvertures"],
  ["tdb","Tableau de bord"],
  ["ref","Reformation & tunnel"],
  ["roues","VL sur ses roues"],
  ["cote","VL sur le côté"],
  ["toit","VL sur le toit"],
  ["spe","Techniques spécifiques"],
  ["ctx","Contexte & pièges"]
];

const FICHES = [
/* ============ COMMANDEMENT ============ */
{id:"mgo",ch:"cmd",t:"MGO SR : la règle des 5S",src:"FRO 51 v2 (2026) · GDO ch.5 §4",
cle:"Sécurisation du site → Sécurisation & Stabilisation du véhicule → SUAP → Sécurisation des techniques → Sortie de la victime. Pas d’ordre chronologique strict : certaines actions sont simultanées.",
b:[
 ["Les 5S",["<b>S</b>écurisation du site : zonage opérationnel (cônes, tri-flash…), protection incendie adaptée aux risques (VEA…), reconnaissance extérieure à 360°.","<b>S</b>écurisation et <b>S</b>tabilisation du véhicule : les 5i (Identifier, Inspecter, Interdire, Immobiliser, Isoler).","<b>S</b>ecours d’urgence aux personnes : bilan XABCDE par l’équipe SUAP, STOP compression (mission conjointe SUAP/SR).","<b>S</b>écurisation des techniques : les 3D (Dégarnir, Dessiner, Distance 30-60-90).","<b>S</b>ortie de la victime : les 2D (Découper, Dégager), de la victime vers l’extérieur du cheminement d’extraction."]],
 ["Reconnaissance à 360° : ce que tu prends en compte",["Historique de l’accident (témoins).","Nombre et type de véhicules.","Déformations, estimation de la vitesse, point d’impact et d’atterrissage.","Risques liés aux véhicules (incendie, explosion, électrisation, coupure, écrasement…) et au chargement (inflammables, radioactivité…).","Dommages causés (câble électrique, coffret gaz…).","Victimes : décédées / blessées (non critique = état léger, critique = état grave) / impliquées.","Repérage du QR code ou du type de véhicule → FAD.","Outils cités : caméra thermique, détecteur multigaz."]],
 ["Concertation",["Les plans de secours sont définis en concertation CA SUAP + CA SR + médecin SMUR + COS.","La stratégie d’extraction incombe au COS, au regard des contraintes imposées par l’état de la victime et l’analyse de la zone d’intervention.","Le choix d’une idée de manœuvre doit toujours s’accompagner d’une solution de remplacement (plan d’urgence)."]]
],
o:["« Équipe SR, zonage : cônes et tri-flash en amont, protection incendie établie côté opposé à la circulation. »","« Je fais mon 360°. Personne ne pénètre dans le véhicule avant mon ordre de calage. »","« Chef VSAV, je te propose : plan d’urgence par la porte AVG, plan complet par le hayon. On valide avec le médecin à son arrivée. »"],
p:["Les 5S ne sont PAS chronologiques strictement (FRO 51).","STOP compression = mission conjointe SUAP/SR, pas seulement SR.","Le bilan XABCDE est fait par l’équipe SUAP, pas par le CA SR."]},

{id:"5i",ch:"cmd",t:"Les 5i : sécuriser le véhicule",src:"FRO 51 · GDO ch.5 §4.2",
cle:"Identifier, Inspecter, Interdire, Immobiliser, Isoler. Objectif : faciliter l’action des secours tout en protégeant les victimes.",
b:[
 ["Identifier",["Dangers éventuels : chargement TMD, bouteille de gaz, fuite, verre…","Type de véhicule et énergie (logos, câbles orange, réservoirs) → cibler la FAD.","La lecture de la FAD est primordiale et facilite le travail du COS."]],
 ["Inspecter",["Localiser fuite carburant/GPL, câble HT endommagé, batterie HT abîmée, problème de chargement."]],
 ["Interdire",["Éviter de toucher, sectionner, déplacer, comprimer toute source (réservoir, batterie) ou vecteur d’énergie (câbles, durites, tuyaux GPL/GNC/GNL/H2)."]],
 ["Immobiliser",["Mise à l’arrêt moteur : coupure contact + frein de parc + levier en P.","Smart key : l’éloigner d’au moins 5 m du véhicule.","Caler les roues (y compris en lutte incendie, ex. forte pente), voire arrimer dans l’axe le plus menaçant."]],
 ["Isoler",["La coupure du contact = 1er niveau : ouverture des relais HT (VE/hybride), fermeture des électrovannes (GPL, GNC, H2).","Batterie 12 V : isolée APRÈS les reconnaissances extérieures et intérieures et après réflexion sur les mobilités utiles (sièges, vitres, colonne de direction, frein, coffre — en priorité par l’intérieur —, portes).","Neutraliser : énergie de servitude (basse tension) ; énergie de traction (phase réflexe puis réfléchie).","Sans connaissance des préconisations de la FAD : AUCUNE manipulation du service plug ni de la boucle d’isolement."]]
],
o:["« Équipier, coupe le contact, frein de parc, levier en P, et éloigne la carte main libre à plus de 5 m. »","« Avant de couper la batterie : descends toutes les vitres, recule les sièges et ouvre le coffre par l’intérieur. »","« On ne touche ni aux câbles orange ni au service plug : j’attends la FAD. »"],
p:["Couper la batterie 12 V n’est pas un réflexe immédiat (sauf début d’incendie ou risque électrique) mais c’est obligatoire avant toute désincarcération.","Coffre : ouverture par l’intérieur en priorité, par l’extérieur seulement si impossible."]},

{id:"apco",ch:"cmd",t:"Analyser, planifier, commander, organiser",src:"Référentiel 1.1",
cle:"La mission du COS en 4 étapes. Victime sortie seule / piégée / incarcérée / éjectée : un vocabulaire commun avec le CTRA-CODIS et les équipes médicales.",
b:[
 ["1. Analyser",["La zone d’intervention, du point d’impact au point d’atterrissage.","Le type de choc, le mécanisme et la cinétique (forte, moyenne, faible).","L’état des véhicules (extérieur, intérieur) et leur position (roues, côté, toit).","L’état et le nombre de victimes : évaluation primordiale, elle oriente méthodes et priorités.","Les risques, le niveau de piégeage, la FAD."]],
 ["Niveaux de piégeage (référentiel SDIS 88)",["Victime sortie seule.","Victime piégée : ne peut sortir seule, soit par ses blessures, soit par la déformation de la structure (mécanique).","Victime incarcérée : présence d’un élément intrusif ou compressif de la structure sur la victime.","Victime éjectée."]],
 ["Types de dégagement",["Feu de véhicule, arrêt cardiaque → dégagement d’urgence (danger réel, vital, immédiat et non contrôlable).","Hémorragie non contrôlée, perte de connaissance, traumas (crâne, abdomen) → rapide = plan d’urgence (critique).","Blessures aux extrémités, blessure isolée de la colonne → normal = plan complet (non critique)."]],
 ["Heure d’or (schéma du référentiel)",["Trajet 15-20 min.","Prise en charge et dégagement 20-30 min.","Transport vers le milieu hospitalier adapté 15-20 min."]],
 ["2. Planifier · 3. Commander · 4. Organiser",["Planifier : concertation CA VSAV & SR + équipes médicales → un plan d’urgence et un plan complet par victime, actions de désincarcération après FAD, extraction.","Commander : le COS commande et contrôle ; il est garant de la sécurité (individuelle, collective, balisage).","Organiser : zone de travail 3-5 m, zone logistique 5-10 m, zone de débris juste à l’extérieur, hors axe de sortie."]]
],
o:["« CODIS de VSR : 2 VL, choc frontal, forte cinétique. 1 victime incarcérée à la place conducteur, critique, 1 victime sortie seule. Énergie : essence. »"],
p:["Le GDO parle de victime ACCESSIBLE / INCARCÉRÉE / ÉJECTÉE ; le référentiel 88 parle de SORTIE SEULE / PIÉGÉE / INCARCÉRÉE / ÉJECTÉE.","GDO : la notion d’incarcération est dissociée de l’état de gravité ; la notion d’éjection doit être associée à un critère de gravité."]},

{id:"plans",ch:"cmd",t:"Plans : dégagement d’urgence, plan d’urgence, plan complet",src:"FMPA SR 2026 · FRO 51 · Référentiel 1.1",
cle:"Un plan d’urgence ET un plan complet PAR victime. Le plan d’urgence n’est pas seulement recherché : il est réalisé, pour garantir une sortie d’urgence à tout moment.",
b:[
 ["Plan immédiat (dégagement d’urgence)",["QUAND : à l’arrivée, danger réel, vital, immédiat et non contrôlable pour la victime.","POURQUOI : sauver la vie, stopper la compression.","AVEC QUOI : zonage, EPI, protections, cale(s).","COMMENT : sécurisation, stop compression, gestes vitaux.","RISQUES : suraccident, aggravation des lésions voire mort.","EFFICACITÉ : victime sortie rapidement."]],
 ["Plan d’urgence (sortie rapide)",["QUAND : urgence vitale persistante (victime critique ou qui le devient).","POURQUOI : STOP compression, réduire le temps de piégeage, prioriser la survie avant médicalisation/stabilisation.","AVEC QUOI : calage, outils SR, protections.","COMMENT : accès rapide, extraction contrôlée, plan dur (collier, ACT si nécessaire), idéalement dans l’axe 0° du bassin.","RISQUES : déséquilibre, blessures secondaires.","Peut nécessiter 2 techniques : 1) supprimer le piégeage ou l’incarcération ; 2) une extraction rapide.","Il permet aussi l’accès à la victime et un bilan plus complet en attendant une sortie de confort."]],
 ["Plan complet (sortie dans l’axe)",["QUAND : victime stable (non critique).","POURQUOI : extraction dans l’axe 0° du bassin, limiter l’aggravation des lésions (rachis cervical).","AVEC QUOI : calage, outils SR, protections, plan dur.","COMMENT : stratégie progressive, extraction contrôlée.","RISQUES : allongement des délais.","EFFICACITÉ : sécurité maximale. Plus de techniques donc plus long."]],
 ["Marquage",["Le CA indique PU et PC sur le véhicule (ex. PU : porte correspondante ; PC : coffre).","L’état de la victime doit être surveillé en permanence : le plan d’urgence peut être déclenché à n’importe quel moment."]]
],
o:["« PU : porte AVD, je veux l’ouverture par la serrure tout de suite. PC : demi-pavillon arrière, on dégarnit les montants C. »","« Équipier, marque PU sur la porte avant droite et PC sur le hayon. »"],
p:["Le plan d’urgence n’est pas le dégagement d’urgence : le DU, c’est la victime sortie immédiatement face à un danger vital non contrôlable.","Code couleur FRO 51 : DU rouge, PU orange/jaune, PC vert."]},

{id:"reac3",ch:"cmd",t:"Les 3 réactions immédiates du CA SR",src:"FMPA SR 2026 (synthèse)",
cle:"1) Sécurité de la zone (zonage opérationnel) · 2) Sécurité des véhicules et de leur chargement (5i) · 3) Sécurité et survie des victimes (STOP compression, STOP hémorragie, dégagement d’urgence).",
b:[
 ["Les 3 réactions",["Faire assurer la sécurité de la zone d’intervention : « zonage opérationnel », première mission de tout CA SR.","Faire assurer la sécurité du ou des véhicules et de leur chargement (engins lourds) pour que le SUAP intervienne vite et en sécurité : stabiliser, mettre à l’arrêt, 5i pour les VEA.","Faire assurer la sécurité et la survie des victimes : STOP compression (cales, vérins…), STOP hémorragie, dégagement d’urgence."]],
 ["L’idée clé",["Dans tous les chocs, l’espace se réduit autour d’êtres humains. Plus tôt je stoppe ou j’agrandis cet espace, plus je préserve la vie.","La sécurité est au cœur de chaque action, avant, pendant et jusqu’au retour au centre."]]
],
o:["« Premier ordre : zonage. Deuxième : calage et mise à l’arrêt. Troisième : on soulage la jambe de la victime avec une cale dès que le calage primaire est fait. »"],
p:[]},

{id:"choix",ch:"cmd",t:"Choisir et sécuriser la technique",src:"FRO 51 · GDO ch.5 §4.4-4.5",
cle:"5 critères de choix · 3D pour sécuriser · 2D pour sortir. La reformation doit être privilégiée à la découpe sur les véhicules nouvelle génération.",
b:[
 ["5 critères de choix",["Informations liées aux véhicules.","Position et état de la victime.","Niveau de piégeage.","Matériel disponible.","Temps disponible."]],
 ["Sécurisation des techniques : 3D",["Dégarnir les parties devant être découpées.","Dessiner les endroits de coupe selon la charte graphique.","Distance : règle des 30-60-90 (déploiement des airbags)."]],
 ["Sortie de la victime : 2D",["Découper : désincarcérer selon les techniques.","Dégager : techniques de sortie (SUAP) avec le personnel SR en soutien.","Toujours partir de la victime (libération des pieds) vers l’extérieur du cheminement d’extraction (ex. ouverture du hayon)."]],
 ["Contraintes pour le SUAP",["Accès à la victime, axe de sortie idéal (0° du bassin), contraintes temporelles, protection contre les risques environnementaux, multi-victimes, position du véhicule (+ techniques de désincarcération dans le GDO)."]],
 ["Sorties selon le GDO",["Dégagement d’urgence : danger réel vital, imminent, non contrôlable.","Extraction rapide : on privilégie le délai sur le respect strict de l’axe tête-cou-tronc.","Extraction améliorée : meilleures conditions possibles, vie non menacée dans l’imminence."]]
],
o:["« On part des pieds de la victime vers l’extérieur : d’abord les pédales, ensuite la porte, ensuite le montant B. »"],
p:["GDO : la sécurisation des techniques = immobilisation + dégarnissage + marquage si nécessaire. FRO 51 : Dégarnir, Dessiner, Distance.","Le médecin, quand il est présent, aide le COS à parfaire l’évaluation ; en son absence, le COS anticipe en préparant les voies d’extraction."]},

{id:"axes",ch:"cmd",t:"Axe 0° du bassin et axes de sortie",src:"Référentiel 1.1 & 6.1",
cle:"Hors extraction rapide : sortie dans l’axe 0° du bassin. Les schémas du référentiel classent les axes de 1 à 5. En sortie latérale (90°), l’axe tête-cou-tronc n’est préservé qu’avec ACT + collier cervical.",
b:[
 ["Principes",["Le positionnement de l’axe du bassin et le type de siège déterminent le type de sortie.","Si l’accès arrière est impossible ou si l’axe 0° n’est pas dans l’axe du véhicule : insérer le plan dur par l’arrière ou le côté en gardant le bassin à 0°, puis extraire par n’importe quel axe (pare-brise, porte…) à 0° ou en sortie toboggan.","Extraction rapide : la règle de l’axe peut être adaptée."]]
],
o:["« Plan dur par le hayon, on garde le bassin à 0°. Écureuil : maintien tête jusqu’au plan dur. »"],
p:["Sortie latérale à 90° = ACT + collier, sinon l’axe tête-cou-tronc n’est pas préservé."]},

{id:"lecture",ch:"cmd",t:"Lecture de l’accident & mécanismes",src:"GDO ch.2 §2 · ch.5 §4.3 · annexe F",
cle:"La lecture de l’accident complète le bilan primaire : rechercher les lésions non visibles, catégoriser la criticité, partager les mêmes critères que la régulation médicale.",
b:[
 ["Critères véhicule",["Energy Equivalent Speed (EES) : vitesse à laquelle il faudrait projeter le véhicule contre un obstacle fixe indéformable pour obtenir les mêmes déformations.","Déformations, intrusion directe, taux de recouvrement, génération et typologie du véhicule.","Type et localisation du choc (ex. choc latéral opposé à la victime), obstacle déformable ou non.","Port de la ceinture, dispositifs de sécurité déclenchés."]],
 ["Critères victime",["Âge, morphologie, position, objets missiles, déplacements dans l’habitacle, sièges auto."]],
 ["Mécanismes",["Frontal : airbags frontaux, montants avant déformés, roue dans l’habitacle, victime coincée par le volant/TdB = forte cinétique.","Latéral : le plus létal pour les passagers (sauf enfants en siège auto) ; abord du côté opposé quand c’est possible.","Arrière : atteintes cervicales, crâniennes, dorsales (~11,6 % des accidents corporels).","Retournement : pavillon intact ou déformé ; pas forcément une grande cinétique.","Encastrement : sous un PL, contre un arbre ou un poteau → stabilisation et décompression.","Écrasement : calage particulier, plusieurs dispositifs de stabilisation.","Suraccident : un des principaux risques pour les SP ; prévention prioritaire par le balisage."]],
 ["Autres victimes",["Piéton : fractures membres inférieurs/bassin à l’impact, puis chute tête la première (cervicales).","Deux-roues : majoritairement éjectés ; fracture bilatérale des fémurs spécifique ; casque et équipements compliquent le bilan."]]
],
o:[],
p:["EES ne se mesure pas de façon fiable sur le terrain : c’est une orientation (déformations des montants et longerons).","On parle de choc (un véhicule) mais de collision (deux véhicules) : collision fronto-latérale."]},

/* ============ SÉCURITÉ ============ */
{id:"fro50",ch:"secu",t:"Sécurité individuelle et collective",src:"FRO 50 (janv. 2023) · GDO ch.3",
cle:"Personnels SR, chef de groupe, VPB, VBU : tenue de feu + chasuble HV. Personnels SUAP : TSI/F1 manches baissées + chasuble HV.",
b:[
 ["Sécurité individuelle",["Chef de groupe, personnels moyens SR, véhicule de protection balisage et véhicule balisage d’urgence : tenue de feu + chasuble haute visibilité.","Personnels SUAP : tenue de travail manches baissées (TSI/F1) + chasuble haute visibilité."]],
 ["En transit",["Ceinture de sécurité.","Priorité demandée par avertisseurs lumineux et sonores.","Attention aux autres usagers, rester maître de son véhicule, adapter la vitesse (intersections, feux)."]],
 ["À l’arrivée",["Avant de descendre : vérifier que la circulation le permet ; descendre côté opposé à la circulation si possible.","Rester attentif à la circulation ; une vigie (sonnette) face à la circulation peut compléter.","Déplacement seul : de préférence derrière les glissières, le plus loin possible du trafic."]],
 ["Arrivée des engins (GDO)",["Ralentir progressivement, clignotants, avertisseurs lumineux maintenus.","Se mettre du même côté que les engins déjà engagés, selon les consignes du COS.","Manœuvres obligatoirement guidées.","À l’arrêt : roues braquées à l’opposé de la zone de flux (en cas de choc arrière, l’engin n’est pas projeté vers l’accident)."]],
 ["Masques",["FRO 50 : FFP3 obligatoire pour sauveteurs ET victimes lors de la découpe des vitrages et des montants en fibre de carbone.","GDO : a minima FFP2 préconisé lors de la découpe des vitrages et matériaux produisant des poussières."]]
],
o:["« Conducteur, roues braquées vers l’extérieur de la chaussée. Tout le monde descend côté accotement. »"],
p:["Roues braquées dans la direction OPPOSÉE à la zone de flux.","Le niveau de masque diffère selon les documents : FRO 50 = FFP3 obligatoire ; référentiel 1.7 = masques FFP3 en matériel mais texte « FFP2 obligatoire » ; GDO = a minima FFP2."]},

{id:"zchantier",ch:"secu",t:"Zonage du chantier SR",src:"FRO 50 §5 · Référentiel 1.1 · GDO ch.3 §3.5",
cle:"Zone de travail ≈ 3 à 5 m autour des véhicules · zone logistique 5 à 10 m · zone de dépôt des structures juste à l’extérieur, hors axe de sortie des victimes.",
b:[
 ["Les zones",["Zone de travail (zone d’actions, SUAP et SR) : cercle de 3 à 5 m ; seul le personnel indispensable s’y trouve.","Zone logistique : 5 à 10 m ; parc à matériel SR, parc SUAP, personnel en attente (équipiers SUAP, SMUR). Elle reste dégagée.","Zone de débris (dépôt des structures) : juste à l’extérieur de la zone logistique, jamais dans l’axe de sortie.","Les personnels SR et SUAP sans mission se placent à leur parc respectif."]],
 ["Les 3 parcs (GDO)",["Parc à matériels (outils rangés en position de sécurité).","Parc à débris.","Parc SSUAP (personnel VSAV et médical)."]]
],
o:["« Parc matériel SR à 5 m côté avant gauche, débris derrière le VSR, l’axe arrière reste libre pour la sortie. »"],
p:["Dans la zone logistique : pas de matériel inutile aux opérations.","Les débris ne vont jamais dans l’axe de sortie de la victime."]},

{id:"zonage",ch:"secu",t:"Zonage opérationnel & signalisation d’urgence",src:"GDO ch.3 §1 · ch.5 §1 · annexe G",
cle:"Zones rouge (exclusion) / orange (contrôlée) / verte (soutien). Réflexe : 50 m et 100 m. Balisage : zone d’approche → tampon → travail → stationnement.",
b:[
 ["Principe des 3 zones",["Zone d’exclusion (rouge) : danger absolu ; si on doit y accéder, faire couper la circulation.","Zone contrôlée (orange) : risque élevé ; présence seulement si strictement nécessaire (premiers secours, désincarcération, commandement).","Zone de soutien (verte) : risque acceptable ; impliqués mis en sécurité, personnels en attente.","Zonage réflexe à l’échelle : zone d’exclusion 50 m de rayon, zone contrôlée 100 m.","Les limites extérieures de la zone de soutien = périmètre de sécurité."]],
 ["Signalisation temporaire d’urgence",["Zone d’approche / présignalisation : avertir l’usager ; se termine au début du biseau ou au stop-voie.","Biseau : faire changer de voie sans arrêt, cônes de Lubeck espacés régulièrement.","Stop-voie : ne doit pas inciter à emprunter le sens opposé sans marquer d’arrêt.","FLU (flèche lumineuse d’urgence) : uniquement sur routes à chaussées séparées ; jamais plus de 2 FLU simultanées (gestionnaires + SP).","Zone tampon : permettre à un véhicule distrait de s’arrêter avant le premier engin ; longueur selon type d’axe, configuration, météo, jour/nuit.","Zone de travail : 4 sphères (SUAP côté victime, SR au plus proche, incendie, commandement).","Zone de stationnement : en file indienne dans le sens de la circulation ; stationnement en épi possible si nombreuses victimes. Seule zone susceptible de s’agrandir fortement."]],
 ["Distances de freinage (annexe G)",["50 km/h : 25 m sec / 38 m mouillé.","80 km/h : 64 m / 96 m.","130 km/h : 169 m / 254 m."]],
 ["Rôles",["La régulation de la circulation incombe aux forces de l’ordre, pas aux SP.","Réseau concédé : la signalisation posée par le SIS est remplacée intégralement et au plus vite par la société concessionnaire.","Retrait de la signalisation dans le sens inverse de la pose, sous la protection d’un véhicule.","Anticiper une zone de poser hélico : assez proche, assez loin pour le souffle."]]
],
o:["« Conducteur VSR, FLU en service, on se place en protection en amont du VSAV. Équipier, biseau de cônes avant la zone tampon. »"],
p:["Plus de 2 FLU en même temps : interdit.","Les SP ne se prononcent jamais sur la réouverture de la voie."]},

{id:"outils",ch:"secu",t:"Règles d’utilisation des outils",src:"Référentiel 1.3 (Weber, Lucas) · GDO ch.3 §3.5",
cle:"Écarteur : becs engagés au moins à moitié avant pleine puissance. Cisaille : couper au plus près de l’axe, lames perpendiculaires à la tôle. Jamais entre l’outil et le véhicule.",
b:[
 ["Préconisations fabricants",["Écarteurs/outils mixtes : becs engagés au moins à moitié avant la pleine puissance.","Les pointes ne sont pas dimensionnées pour toute la puissance (risque de casse) : seulement pour agrandir une fente (ex. entre deux feuillures de porte).","Cisaille : coupe au plus près de l’axe, lames perpendiculaires aux tôles.","Aciers nouvelle génération (GDO) : couper avec le cœur de l’outil et à faible vitesse."]],
 ["Sécurité",["Se déplacer outil fermé, dirigé vers le bas ; ne l’ouvrir qu’aux abords du véhicule.","Flexibles : ne pas les vriller, éviter parties saillantes/chaudes et liquides de batterie, ne pas marcher dessus ; ne jamais porter/tirer l’outil par les flexibles.","Ne jamais se placer entre l’outil et le véhicule ou un obstacle ; si possible derrière l’outil, en position stable.","Bouclier et/ou couverture à chaque action de force.","Parc à matériel ; se relayer (poids des outils).","Ne jamais lutter contre la force de l’outil : replacer l’écarteur dans un interstice, rapprocher la cisaille de l’axe.","Jamais les mains sur mâchoires ou lames : utiliser les poignées.","Au-dessus de la ceinture (GDO : au-delà de l’abdomen), l’outil est porté avec l’avant-bras, comme un enfant.","Axe de l’outil : perpendiculaire, en plongée ou en contre-plongée.","Rester maître de son outil, connaître le sens de manipulation.","Outils électroportatifs : attention aux packs batteries."]]
],
o:["« Cisaille plus près de l’axe ! Ne lutte pas, on repositionne. »","« Bouclier côté victime avant chaque coupe. »"],
p:["Pleine puissance seulement becs engagés au moins à moitié.","La pointe des becs sert à agrandir une fente, pas à forcer."]},

{id:"charte",ch:"secu",t:"Dégarnissage & charte graphique",src:"Référentiel 1.2 · GDO ch.3 §3.3-3.4",
cle:"Le dégarnissage est obligatoire avant toute désincarcération sur la zone travaillée. La charte graphique est dessinée uniquement par le CA SR. Trait de coupe unique.",
b:[
 ["Dégarnissage",["Objectif : repérer l’emplacement exact des mécanismes et organes dangereux (prétensionneurs, cartouches, renforts, câbles HT, générateurs de gaz).","Le plus souvent par le CA ; un équipier peut aider (décoller les plastiques, couper le tissu d’un siège, enlever de la matière).","Ne pas tout dégarnir : seulement la zone où l’on va utiliser un outil (vérin, écarteur, cisaille…). La scie sabre peut couper un plastique difficile.","EPI, lunettes baissées ; attention à l’effet mécanique du plastique soulevé (projection)."]],
 ["Charte graphique (SDIS 88)",["Dessiner APRÈS avoir dégarni, avec la FAD.","Obligatoire : zone dangereuse = coupe interdite (rectangle hachuré rouge) et endroit de coupe (trait).","Optionnel : limites supérieure et inférieure de la zone de coupe (flèches).","Carburation notée en jaune près du réservoir, visible, sur les parties non mobiles : EL, HE, H2, GNV, GPL, GO, ESS. Position de la batterie : BAT.","Indiquer PU et PC. Couleur des marquages adaptée à la couleur de la voiture."]],
 ["Marquage selon le GDO",["Marquage de l’énergie nécessaire dès qu’il y a désincarcération : ES, GO, H², GPL-GNV-GNC, VE, HY.","Sur le capot avant ou sur le montant arrière gauche côté conducteur.","Interdit d’inscrire l’état des victimes sur les véhicules (dignité, réseaux sociaux)."]],
 ["Critères d’efficacité",["Toutes les parties césarisées sont dégarnies.","On ne coupe que là où il y a un trait de coupe.","La charte graphique donne la marche à suivre aux équipes."]]
],
o:["« Équipier, dégarnis le montant B côté conducteur, uniquement la zone de coupe. Je dessine derrière toi. »","« Tu coupes sur mon trait, nulle part ailleurs. »"],
p:["Abréviations SDIS 88 (EL, HE, ESS…) ≠ abréviations GDO (VE, HY, ES).","Le dégarnissage peut être partagé, la charte graphique non : CA SR uniquement."]},

{id:"fad",ch:"secu",t:"FAD, QR codes & applis",src:"FRO 51 §2 · Référentiel 1.2 · GDO annexe B",
cle:"La FAD (max 4 pages, norme ISO 17840) donne énergie, immobilisation, neutralisation des énergies, accès aux occupants, énergies stockées, infos incendie.",
b:[
 ["Rôle",["Garantir la sécurité des intervenants et des victimes.","Identifier les zones à risques (pyrotechniques, électriques, structurelles, énergie).","Adapter la tactique de désincarcération à la structure.","Gagner du temps (comme un plan de bâtiment) au profit de la victime.","Exigence EuroNCAP."]],
 ["Contenu",["En haut à droite : pictogramme de l’énergie de traction.","Vue centrale (dessus + côtés) : batterie 12 V, générateurs de gaz, dispositifs de sécurité HT, renforts.","Identification / Immobilisation-stabilisation-levage (zones d’interdiction de calage, ex. câbles HT) / Neutraliser les dangers directs / Accès aux occupants (renforts, classes de vitrage, inclinaison des sièges) / Énergie stockée / Incendie (vérins projetables, fireman access)."]],
 ["Outils",["Rescue Code : appli française gratuite (2012, accord DGSCGC), ≈ 3 611 FAD, fonctionne sans réseau ; QR codes 3 x 3,5 cm sur pare-brise et lunette arrière.","Euro Rescue : libre accès, 22 langues depuis 2023, ≈ 1 555 FAD ; recherche par photo, modèle, QR code (QR code = connexion nécessaire).","QR codes constructeurs (QRescue Renault/Dacia, RescueCard Mercedes).","Guides d’intervention d’urgence (ERG, ISO 17840-3) : trop longs pour l’intervention, utiles en formation."]]
],
o:["« Équipier, scanne le QR code sur le pare-brise et donne-moi la FAD. Je veux l’emplacement de la batterie et les zones interdites. »"],
p:["Rescue Code fonctionne sans réseau ; Euro Rescue demande une connexion pour le QR code.","Rétrofit : risque d’absence de FAD et de sécurité tertiaire."]},

/* ============ VÉHICULES ============ */
{id:"structure",ch:"veh",t:"Structure des véhicules",src:"GDO ch.1 §1.4 & §2",
cle:"Avant et arrière déformables, habitacle « cellule de survie ». Aciers HLE, THLE, UHLE : 7 à 10 fois plus résistants qu’un acier doux.",
b:[
 ["Catégories (SP)",["VL : transport de personnes, ≥ 4 roues, PTAC ≤ 3,5 t.","VUL : PTAC ≤ 3,5 t (minibus 9 places, camping-cars).","PL : PTAC > 3,5 t ; la plaque de tare renseigne sur la masse et le chargement.","Transport en commun : autobus (urbain, debout autorisé, pas de soute), autocar (assis obligatoire, ceinture obligatoire depuis 2013, minibus ~20, grand tourisme ~50, double étage jusqu’à 80).","Remorques > 500 kg : carte grise propre."]],
 ["Structure",["VL : zones d’absorption avant/arrière, habitacle renforcé = cellule de survie.","Aciers alliés au bore HLE/THLE/UHLE ; parfois CFRP (fibre de carbone).","PL : zone en H (traverse type tableau de bord) reliée par 4 points de fixation, contraignante pour la poussée de tableau de bord.","Autocar : habitacle sur châssis de longerons et poutrelles en tubes soudés ; soute, parfois couchette, toilettes."]],
 ["Sécurité active / passive / tertiaire",["Active (primaire) : ABS, AFU, AEB, ESP, AFIL, régulateur, limiteur, angles morts.","Passive (secondaire) : ceintures et prétensionneurs, airbags, capot actif, appui-tête, ROPS, sièges qui se redressent.","Tertiaire (post-accident) : eCall, QR code secours, fireman access, étiquette d’isolement de l’énergie."]]
],
o:[],
p:["L’ABS seul ne réduit pas la distance de freinage ; l’AFU, si.","Le GDO note un verre trempé 3 à 5 fois plus résistant ; la FRO 50 indique 5 fois."]},

{id:"airbags",ch:"veh",t:"Airbags, prétensionneurs, ECU & 30-60-90",src:"GDO ch.1 §2.3 · FRO 50 §3.4 · FRO 51",
cle:"Distances de sécurité au déploiement : 30 cm (latéraux), 60 cm (frontal conducteur), 90 cm (frontal passager). Couper le contact ou débrancher la 12 V rend le système airbag inerte.",
b:[
 ["Airbags",["Gonflage en moins de 30 ms ; déclenchement possible dès 25 km/h d’impact selon le choc.","Complète la ceinture (ratio 80 % ceinture / 20 % airbag) ; protège tête et thorax.","Générateur pyrotechnique : chaleur, fumée (pas un départ de feu), bruit de détonation ; ou générateur à gaz froid.","Tous les airbags ne se déclenchent pas : seulement ceux commandés par l’ECU selon le choc.","Airbags farside entre les sièges avant ; airbag piéton ; airbag moto (gilet, reste gonflé ~10 s)."]],
 ["ECU",["Contact mis : l’ECU, alimenté par la 12 V, commande seul airbags et prétensionneurs.","Il déclenche quand deux capteurs envoient simultanément un signal crash.","Batterie non débranchée : couper un faisceau contenant les fils d’un générateur peut le déclencher par court-circuit.","En feu : sécurité intrinsèque, déclenchement autour de 180-220 °C."]],
 ["Prétensionneurs",["Intégrés aux enrouleurs avant (parfois arrière) ou à la boucle ; générateur de gaz qui rétracte la ceinture.","Localisation sur la FAD ; limiteur d’effort = dispositif mécanique."]],
 ["Autres organes à risques",["Capot actif : se relève côté pare-brise (différent de l’airbag piéton).","Vérins de capot/hayon : projectiles en feu, projection d’huile si sectionnés → éviter de les couper.","Start & Stop / ultracapacité : écrasement → dégagement possible d’acétonitrile (toxique, inflammable), souvent aile avant gauche ou près du plancher.","Rétroviseurs électrochromes : liquide irritant.","Extinction automatique (ex. cartouche d’argon sous l’aile avant).","Pneus : éclatement possible à retardement (pyrolyse ≈ 430 °C)."]]
],
o:["« Personne dans la zone des 60 cm du volant tant que la 12 V n’est pas coupée. »"],
p:["La fumée d’un airbag déclenché n’est pas un départ de feu.","Distances 30-60-90 en centimètres, pas en mètres."]},

{id:"vitrage-gen",ch:"veh",t:"Les vitrages : identifier",src:"FRO 50 §4 · GDO ch.1 §2.2",
cle:"Trempé (nomenclature I) : casse en petits morceaux. Feuilleté (II ou III) : film plastique PVB, élasticité 240 %, retient l’occupant. Polycarbonate (IV) : pas de casse possible.",
b:[
 ["Types",["Trempé : vitres latérales, custodes, lunette arrière ; résiste 5 fois plus qu’une vitre classique (FRO 50).","Feuilleté : obligatoire pour les pare-brise, toits ouvrants ; se généralise aux autres vitres (acoustique).","Polycarbonate : certains pare-brise et toits panoramiques, casse peu probable.","Un VL ≈ 4 m² de surface vitrée."]],
 ["Identification",["Marquage ECE R43 : type de verre, fabricant, pays d’homologation (E2 = France), date.","LAMISAFE = feuilleté, TEMPERLITE = trempé.","Pare-brise collé : présence de ronds noirs sur les bandes noires.","Certains véhicules ont des vitres de portes ou une lunette arrière feuilletées (ex. Renault Vel Satis)."]],
 ["Kit gestion du verre",["Utilisation avec masque (FFP3 obligatoire selon FRO 50 pour la découpe des vitrages et des montants carbone, pour sauveteurs et victimes)."]]
],
o:[],
p:["Pas de règle absolue : vérifier le type de vitrage sur la FAD (classes de vitrage)."]},

/* ============ ÉNERGIES ============ */
{id:"ht",ch:"ener",t:"VE & hybrides : la haute tension",src:"GDO ch.1 §3-4 · FRO 51",
cle:"Jusqu’à 800 V, câbles orange (parfois sous gaine noire). Coupure du contact = ouverture des relais HT. Ne jamais toucher les éléments HT ; service plug seulement si la FAD le dit.",
b:[
 ["Système HT",["Batterie HT, inverseur/convertisseur, moteur électrique (boîte-pont), compresseur de clim, chargeur, câbles orange.","Sur la FAD, tous les composants HT sont en orange.","Carrosserie isolée de la HT en conditions normales : on peut la toucher sans danger.","Désactivation auto sur détection de choc (airbag) ou de fuite HT.","Câbles : compartiment moteur, tunnel central ou de chaque côté des bas de caisse."]],
 ["Batteries",["Modules de cellules (souples, cylindriques, prismatiques) dans un casing acier/alu, sous plancher, sièges, console ou coffre.","Li-ion majoritaire ; Ni-MH (hybrides) ; LMP (60-80 °C, feu violent) ; Zebra (270-350 °C, ex. La Poste) ; Ni-Cd interdite.","Remplacée sous 70 % de capacité (8-10 ans).","Fireman access (Renault) : trappe thermo-fusible pour noyer le pack."]],
 ["Types",["Mild hybrid : batterie 48 V, alterno-démarreur.","HEV : hybride non rechargeable.","PHEV : rechargeable, 20 à 60 km en électrique.","EV : 100 % électrique ; pile à combustible (FCV) : voir H2."]],
 ["Règles SR (GDO / FRO 51 / référentiel)",["Interdit : toucher, sectionner, comprimer batterie ou câbles HT.","Zone de 20 cm sur le bas de caisse des VEA : interdiction d’y toucher (pas d’écrasement de bas de caisse sur le toit).","Pour les VEA, vérifier qu’aucun système ne passe dans le bas de caisse avant une coupe ; en cas de doute, autre technique.","La méthode 12 V « réflexe » ne s’applique pas aux circuits HT : sur VE/VHE, les actions d’isolement électrique sont prioritaires.","Calage : localiser le pack batterie (centre de gravité modifié, zones d’interdiction de calage sur la FAD)."]],
 ["Fuite d’électrolyte",["Possible en cas de rupture de l’enveloppe ; certaines batteries à électrolyte gélifié ou sec limitent ce risque.","Un emballement thermique en accident impose un dégagement d’urgence des occupants."]]
],
o:["« Contact coupé, la carte à plus de 5 m. On ne touche pas au service plug, j’attends la FAD. »","« Attention, VEA : interdiction de travailler dans les 20 cm du bas de caisse. »"],
p:["Sans FAD : pas de service plug ni de boucle d’isolement.","Rétrofit : un véhicule connu comme thermique peut être électrique ou H2."]},

{id:"gpl",ch:"ener",t:"GPL-c",src:"GDO ch.1 §3 · ch.2 §1.1.1",
cle:"10 bar max, remplissage limité à 80 %, soupape tarée à 27 bar, thermo-fusible à 110 °C. Torchère jusqu’à 15 m ; BLEVE possible.",
b:[
 ["Système",["Propane/butane, en bicarburation essence-GPL surtout sur VL.","Orifice de remplissage avec bille de sécurité, souvent masqué (près de la plaque ou de la trappe essence).","Réservoir acier 3-4 mm, cylindrique, torique (roue de secours) ou polyforme, 30 à 150 L, coffre ou sous châssis.","Acheminé en phase liquide jusqu’au vapodétendeur ; les canalisations ne passent pas dans l’habitacle sauf en sortie de réservoir.","Polyvanne : limite le remplissage à 80 %, limite le débit en cas de rupture, clapet anti-retour, jauge.","Soupape à 27 bar ; deux électrovannes (vapodétendeur et sortie réservoir) fermées à la coupure du contact ; parfois thermo-fusible 110 °C."]],
 ["Torchères",["Soupape, véhicule sur ses roues → torchère en phase gazeuse, cyclée.","Soupape, véhicule sur le toit → torchère en phase liquide, continue.","Thermo-fusible → torchère continue, phase gazeuse.","Orientée vers l’arrière en général, entre -45° et +45°."]],
 ["BLEVE (réservoir 50 L)",["Éclats jusqu’à 100 m (avant/arrière).","Boule de feu jusqu’à 30 m de diamètre pendant 3 s.","Surpression ressentie jusqu’à 120 m.","PL : effets létaux jusqu’à 750 m à l’air libre.","Les dispositifs de sécurité n’excluent pas totalement le risque."]],
 ["Feu de véhicule gaz",["Périmètre interdisant les zones dans l’axe du véhicule.","ARI coiffé par le personnel d’attaque.","Approche par l’avant, hors axe et hors côtés.","Deux lances (si possible additivées) : rabattre de loin en jet droit, puis jet diffusé d’attaque, une lance refroidit le réservoir. Jet ≤ 250 L/min sur le réservoir ne le fragilise pas.","Avant de quitter : relevés explosimétriques."]]
],
o:["« Véhicule GPL : on attaque par l’avant, hors axe, ARI capelé et coiffé, deux lances. Personne dans l’axe arrière. »"],
p:["Sur le toit, la soupape est dans la phase liquide : torchère liquide continue.","Réservoir en espace clos (coffre, utilitaire) : rupture d’enveloppe possible."]},

{id:"gnv",ch:"ener",t:"GNV : GNC et GNL",src:"GDO ch.1 §3 · ch.5 §5.2",
cle:"GNC : 200-250 bar, ~97 % méthane, odorisé, canalisations inox grises, fusible 110 °C. GNL : -160 °C, moteur à -130 °C / 8 bar, soupapes 16 et 24 bar, volume x600.",
b:[
 ["GNC",["Stocké 200-250 bar en réservoirs alu, polyéthylène, carbone ou acier, cylindriques.","Surtout flottes captives (bus) ; réservoirs sur le toit (bus), derrière la cabine (PL), sur les côtés du tracteur (semi).","Sécurités : disque de rupture, fusible thermique 110 °C, électrovanne, TPRD, vanne manuelle.","TPRD : déclenchement non instantané (quelques minutes), définitif ; empêche l’éclatement. Réservoir vidé en ~3 min (torchère continue).","Carte grise P3 : « GN » pour GNC comme pour GNL."]],
 ["GNL",["Gaz condensé à -160 °C, volume réduit d’environ 600 fois ; parfois non odorisé.","Réservoirs cryogéniques inox ; moteur alimenté en GNL saturé ~ -130 °C, 8 bar.","Soupape principale 16 bar, secondaire 24 bar, électrovanne, 2 vannes manuelles, manomètre.","PL et autocars (longues distances).","Eau d’extinction sur GNL : vaporisation quasi instantanée, « explosion froide » (surpression sans combustion)."]]
],
o:[],
p:["La position du véhicule n’influe pas sur le comportement des dispositifs GNC.","Ne pas confondre GNL (-160 °C stockage) et GNL saturé moteur (-130 °C)."]},

{id:"h2",ch:"ener",t:"Hydrogène",src:"GDO ch.1 §3 · ch.2 §1.1.1 · ch.5 §5.1",
cle:"350 ou 700 bar, TPRD vers ~110 °C, rejet orienté vers le bas, très bruyant. Flamme invisible de jour : caméra thermique.",
b:[
 ["Véhicules",["Pile à combustible (FCV) : produit l’électricité (full power ou range extender) ; composants HT 200 à 650 V.","Réservoirs composite à liner métal ou plastique, VL : arrière et sous les sièges ; parfois toit (bus, Master H2).","Canalisations HP parfois rouges ; détecteur H2 qui isole les réservoirs en cas de fuite.","Moteur thermique H2 : encore à l’étude, à ne pas confondre avec la pile.","Carte grise P3 : HH = pile à combustible ; HE = pile rechargeable (rare) ; H2 = moteur thermique hydrogène."]],
 ["Remorques H2 (TMD)",["Ancienne génération : cigares métal 200 bar, pas d’arrêt d’urgence, vanne manuelle à l’arrière.","Nouvelle génération : bouteilles composite type IV 300 bar, bouton d’arrêt d’urgence.","Ne pas intervenir sur la semi en cas de fuite/feu sauf dégagement de personne ; zone d’exclusion 50 m ; imagerie thermique.","TPRD enflammé : flamme 10 m, 3 kW/m² à ~15 m, LIE (4 %) à 20 m. Camion couché : rejet possiblement horizontal vers les intervenants."]],
 ["Stations",["Livraison 200/300 bar, stockage tampon ~550 bar (MP) ou 975 bar (HP).","Borne d’appel d’urgence pompiers : astreinte 24/24 et arrêt d’urgence général."]]
],
o:["« Fuite H2 possible : caméra thermique avant toute approche, on ne passe pas sous le véhicule. »"],
p:["Un réservoir H2 ou GNC se vide en ~3 min quand le fusible a fondu.","HH ≠ H2 sur la carte grise."]},

{id:"cartegrise",ch:"ener",t:"Carte grise P3 & logos énergie",src:"GDO ch.1 §3 · annexe C",
cle:"Rubrique P3 du certificat d’immatriculation. Les SP peuvent obtenir les infos d’immatriculation (art. R.330-3 code de la route).",
b:[
 ["Codes P3 utiles",["ES essence · GO gazole · EL électricité · GN gaz naturel · FE superéthanol.","EG essence-GPL · EN essence-gaz naturel.","EE essence-électricité hybride rechargeable · EH essence-électricité non rechargeable.","GL gazole-électricité rechargeable · GH gazole-électricité non rechargeable.","H2 hydrogène (moteur thermique) · HE hydrogène-électricité rechargeable · HH hydrogène-électricité non rechargeable (pile)."]],
 ["Logos carburant (UE, 2018)",["Essences : E dans un cercle (E5 = SP95/SP98, E10, E85 superéthanol).","Gazoles : B dans un carré (B7 standard, B10, XTL synthèse).","Gaz : H2, LPG (GPL-c), CNG (GNC), LNG (GNL).","Norme ISO 17840-4 : symboles et couleurs des énergies de propulsion (ne couvre pas la cargaison d’un camion)."]]
],
o:[],
p:["Sans carte grise : demander aux forces de l’ordre via l’immatriculation."]},

{id:"feux",ch:"ener",t:"Feux de véhicules",src:"GDO ch.2 §1 · ch.5 §3",
cle:"Attaque offensive de l’habitacle + refroidissement massif et rapide de la source d’énergie. Lance ≥ 250 L/min, progression dans l’axe 3/4 avant, derrière des écrans. Zonage a priori 50 m.",
b:[
 ["VL",["Efficacité recherchée dès l’ouverture à distance en jet droit.","Remorque poudre ou mousse si l’hydrocarbure se répand ; barrages contre les écoulements.","Pente : protection d’abord en contrebas ; caler le véhicule tôt.","Couverture d’extinction : utile en feu naissant, à proscrire en emballement de batterie (gaz piégés).","Le COS peut laisser brûler sans enjeu ou si risque majeur (guet-apens)."]],
 ["VE / hybride",["Interdit de toucher les éléments HT tout au long de l’opération.","Après extinction de l’habitacle sans emballement : caméra thermique pour vérifier l’absence de remontée de température.","Emballement : eau par le dispositif constructeur (trappe thermo-fusible) ; sinon intégrer l’eau dans le casing par les déformations ou parties fondues, jamais en ouvrant avec un outil de forcement.","Si inefficace : s’abstenir (combustion plus longue, fumées, métal en fusion, eau, reprise de feu, pollution). Seules la sécurité des tiers et la protection de l’environnement.","Après extinction : quarantaine sur sol inerte (lit de sable), informer FDO et dépanneur.","Petites mobilités : immersion possible.","LMP : feu très violent ~15 min, ne faire que stopper les propagations (projection d’eau = réaction violente).","Signes d’emballement : crépitements, bruit de gaz sous pression, fumées épaissies, flammes plus claires et vives, hausse de température, feu entretenu, flux rayonné. Délai 20 à 30 min ; réignition possible au-delà de 24 h.","Gaz toxiques (HF, HCl) ; HF très soluble dans l’eau ; attention à la désorption des tenues."]],
 ["PL, TC, bornes",["PL/TC : risque de rupture du réservoir gazole/essence pendant l’attaque ; ne pas oublier le tracteur.","Véhicule en charge : isoler la borne (arrêt d’urgence ou coupure générale) ; sans confirmation de coupure, protéger l’environnement seulement."]],
 ["Alliages",["Aluminium, magnésium (carters, jantes…) : l’eau peut provoquer des projections de métal en fusion."]]
],
o:["« Binôme, lance en jet droit, progression trois-quarts avant, abrités derrière le FPT. »"],
p:["Sur une batterie, jamais d’ouverture au Halligan pour faire entrer l’eau.","Couverture anti-feu : jamais sur un emballement thermique."]},

{id:"tmd",ch:"ener",t:"TMD : plaques et dangers",src:"GDO ch.1 §5 · ch.5 §5.1",
cle:"Plaque orange 40 x 30 cm : code danger en haut, numéro ONU (4 chiffres) en bas. Chiffre doublé = danger renforcé. X = réagit violemment avec l’eau.",
b:[
 ["Code danger",["1 explosibles · 2 gaz · 3 liquides inflammables · 4 solides inflammables · 5 comburants/peroxydes · 6 toxiques · 7 radioactifs · 8 corrosifs · 9 divers (réaction violente spontanée).","Exceptions au doublement : 22 gaz réfrigéré · 44 solide inflammable fondu à chaud · 99 matières diverses transportées à chaud (goudron) · 333 liquide pyrophorique.","Un seul chiffre suffisant → complété par 0.","Dérogation : citerne multi-cuves de station-service peut porter 33/1203."]],
 ["Autres",["Étiquette de danger 25 x 25 cm.","Colis : plaque orange vierge (+ étiquette si > 3 t d’une même classe).","Marques QL (quantités limitées) si chargement > 8 t de QL et PTAC > 12 t.","Document de transport : n° ONU, désignation, étiquettes, colis, quantité, origine/destination, consignes écrites."]],
 ["Conduite à tenir",["Se renseigner sur le produit (conducteur, CODIS).","Caler le véhicule, périmètre de sécurité, moyens en tenant compte de la pente et du vent.","Barrages au sol, extinction adaptée ; citerne non atteinte : jet diffusé ou mousse."]]
],
o:[],
p:["33 = très inflammable ; X423 = réagit dangereusement avec l’eau, dégage des gaz inflammables (lecture typique)."]},

/* ============ GESTES DE BASE ============ */
{id:"batt",ch:"gen",t:"Gestion de la batterie 12 V",src:"Référentiel 1.4 · GDO ch.5 §4.2.5",
cle:"Pas une réaction immédiate (sauf début d’incendie ou risque électrique), mais obligatoire avant toute désincarcération. Démonter les deux cosses : le – d’abord, puis le +.",
b:[
 ["Matériel",["Clé de 10, coupe-câble, coupe-boulon, clé à molette, FAD."]],
 ["Déroulé",["Avant : réaliser toutes les actions qui demandent l’énergie (portes, coffre, vitres, sièges, toit panoramique, volant…).","Couper selon la méthodologie de la FAD.","Démonter systématiquement les 2 cosses en commençant par le – puis le +."]],
 ["Limites",["Ne s’applique pas aux VHE/VE : l’isolement électrique y est prioritaire.","Ne s’applique pas aux circuits HT : la coupure 12 V (VL) / 24 V (PL) est une démarche réflexe de sécurisation."]]
],
o:["« Équipier : vitres en bas, sièges reculés, coffre ouvert… c’est fait ? Alors batterie : moins puis plus, les deux cosses. »"],
p:["L’ordre est – puis +, et on démonte les DEUX cosses.","PL = 24 V."]},

{id:"ceint",ch:"gen",t:"Neutralisation des ceintures",src:"Référentiel 1.5",
cle:"Pendant le dégarnissage, supprimer les ceintures pour faciliter les coupes. Retenir côté enrouleur, ne pas exagérer le geste, jamais vers la victime.",
b:[["Règles",["Coupe-ceinture, outil multifonction, couteau ou cutter sécurisé.","Retenir la ceinture côté enrouleur (coup de fouet).","Ne pas exagérer le geste, ne pas le faire vers la victime."]]],
o:["« Coupe la ceinture en la retenant côté enrouleur, lame vers l’extérieur. »"],p:[]},

{id:"sieges",ch:"gen",t:"Gestion des sièges",src:"Référentiel 1.6",
cle:"Gagner de l’espace vite. Prioriser le réglage électrique ou mécanique, à tester AVANT de couper le contact et la batterie.",
b:[
 ["Sièges avant",["Possible d’engager un ACT avant de baisser le siège, puis de le gérer au moment opportun.","Poignée mécanique HS : démonter celle d’un autre siège.","Mécanisme HS ou assise électrique sans batterie : couper ou forcer les dossiers."]],
 ["Technique 1 : découpe du fauteuil",["Efficace sur sièges ancienne génération.","Découper le tissu du dossier (juste le nécessaire) ; vérifier l’absence de pyrotechnie (chauffage, motorisation…).","Bouclier dans le dos de la victime ; couper la partie basse du cadre du dossier sans toucher le dos avec la cisaille.","Plier ou retirer le siège ; protéger les parties saillantes.","Dégagement d’urgence : ne couper qu’un côté du dossier puis le pivoter."]],
 ["Technique 2 : compression du fauteuil",["Efficace sur sièges nouvelle génération ; à éviter sur les anciens (risque de lever l’assise des jambes).","Retirer l’appui-tête si besoin ; appui haut stable et solide (rail de toit, cadre de porte, points de fixation de ceinture) après dégarnissage.","Basculer le siège, ne pas l’écraser en force ; appui au milieu du siège (sur le côté, il vrille).","Pas de cales en partie supérieure ni inférieure (projection, chute).","Écarteur puis relais au vérin possible ; peut se faire en plusieurs fois ; sangles à cliquet possibles.","VL sur le toit : une boucle autour du bas de caisse gère les deux sièges."]],
 ["Banquette arrière",["Gérer le hayon, actionner les leviers.","Démonter la partie basse et rabattre l’assise ; dévisser, couper ; monospaces : retirer le siège.","Écrasement : un bec en haut de la banquette, l’autre sous les rails du toit ; angle suffisant pour faire descendre et non écraser ; maintenir ou sangler l’écarteur.","Banquette trop reculée : vérin, base sur l’angle du montant B, tête en haut de la banquette."]]
],
o:["« Avant la batterie : recule le siège conducteur et incline le dossier au maximum. »","« Écarteur au milieu du dossier, appui sur le rail de toit dégarni. Tu bascules, tu n’écrases pas. »"],
p:["Compression : pas de cale au-dessus ni en dessous.","Appui sur le côté du siège = il vrille."]},

{id:"feuillete",ch:"gen",t:"Vitrage feuilleté (pare-brise)",src:"Référentiel 1.7",
cle:"Accès rapide ou prérequis d’une découpe. Réduire au maximum débris et poussières : bouclier + couverture, scie à petite vitesse, eau, film.",
b:[
 ["Matériel",["Masques FFP3, scie sabre, outils de découpe pare-brise, bouteilles d’eau, bouclier et kit gestion du verre."]],
 ["Déroulé",["Identifier le pare-brise collé (ronds noirs sur les bandes noires).","Masque pour les intervenants à proximité (équipe médicale comprise) et pour la ou les victimes.","Protéger la victime : bouclier + drap ou couverture (protection mécanique et physique).","Perforer pour introduire la lame de scie sabre ou la scie manuelle, à la plus petite vitesse.","Asperger avec une bouteille d’eau percée.","Filmer intérieur et extérieur (−70 % de poussière) ou emballer en englobant les deux montants A sans plaquer la partie collante.","Un seul trait de coupe suffit souvent (pavillon…). Couper la partie haute et/ou les côtés ; la scie à pare-brise coupe au retrait de la lame.","Ne couper le bas que si nécessaire : on peut rabattre le pare-brise sur le capot.","Découpe horizontale : perforer de préférence au milieu et en partie basse, sans se coller à la base (tableau de bord).","Lames usagées possibles (verre très abrasif).","Protéger toutes les parties saillantes."]]
],
o:["« Bouclier et couverture sur la victime, masques pour tout le monde. Tu perfores au milieu, scie à petite vitesse, et ton équipier arrose. »"],
p:["Le bas du pare-brise ne se coupe que si nécessaire.","Toits panoramiques : feuilleté (même méthode) ou polycarbonate."]},

{id:"trempe",ch:"gen",t:"Vitrage trempé",src:"Référentiel 1.8",
cle:"D’abord essayer de descendre la vitre (avant la batterie). Sinon filmer, puis casser au pointeau dans un angle, de l’intérieur vers l’extérieur, en commençant par le vitrage le plus éloigné de la victime.",
b:[["Déroulé",["Filmer le vitrage (raclette pour chasser l’air) ; kit : rouleau 1 partie collante contre la vitre vers le bas, rouleau 2 en maroufle, coup sec vers le bas pour détacher.","Le film peut rester en place pour sécuriser les techniques.","Si le raisonnement tactique oblige à enlever la vitre : couper les bords au cutter.","Briser au pointeau en commençant par un angle, de l’intérieur vers l’extérieur.","Le premier vitrage (le plus éloigné de la victime) sert d’accès : décoller le film de l’angle choisi.","Déposer le vitrage dans une caisse avec protections de coupe ; retirer les débris ; protéger l’accès.","Glisser le bouclier dans le véhicule.","Pluie : raclette puis chiffon ; possible de filmer à l’intérieur."]]],
o:["« Vitre arrière gauche en premier, c’est la plus loin de la victime. Film, puis pointeau dans l’angle. »"],
p:["On commence par le vitrage le plus ÉLOIGNÉ de la victime."]},

{id:"jointe",ch:"gen",t:"Vitrage jointé",src:"Référentiel 1.9",
cle:"Déposer sans casse : retirer l’agrafe, couper le joint en partie supérieure, déposer le joint, pousser le vitrage de l’intérieur vers l’extérieur. À deux SP.",
b:[["Déroulé",["Véhicule sécurisé et calé.","Retirer l’agrafe de jonction du joint.","Couper le joint sur la partie supérieure, déposer le joint.","Extraire le vitrage en le repoussant de l’intérieur vers l’extérieur ; un outil de dégarnissage peut faire levier.","Vigilance lors de la découpe du joint ; opération à deux SP."]]],
o:[],p:[]},

/* ============ STABILISATION ============ */
{id:"stabgen",ch:"stab",t:"Stabilisation : généralités",src:"Référentiel 2.1 · GDO ch.3 §3.2",
cle:"Blocage (primaire) → Calage (secondaire) → Étaiement si nécessaire (tertiaire). Concept 4 ou 5 points. La stabilisation est un processus dynamique.",
b:[
 ["Principes",["Un véhicule instable (côté, toit, pente) ne doit pas être déplacé ; les secours n’y pénètrent pas. Abordage par l’extérieur possible.","Sur décision du COS, un personnel peut entrer (homme d’intérieur, « écureuil ») pour le bilan d’urgence vitale après un calage d’urgence réalisé par les personnels qui maintiennent le véhicule.","Buts : éviter mouvements longitudinaux, verticaux, latéraux ; immobiliser ; mieux diffuser l’énergie des coupes ; limiter tout mouvement préjudiciable.","Vérifier régulièrement : modification de structure, entrée de personnel, manœuvres de force.","L’oubli d’une étape peut avoir des conséquences dramatiques."]],
 ["Les 3 étapes",["Étape 1 – Blocage (calage primaire) : limiter les mouvements avant/arrière.","Étape 2 – Calage (calage secondaire) : limiter tous les mouvements préjudiciables à la victime.","Étape 3 – Étaiement (calage tertiaire) si nécessaire : limiter le balancement (sangles à cliquet, tire-câble, cales coins, étais à sangle).","L’écureuil peut entrer après le calage primaire."]],
 ["Selon la position",["Sur 4 roues : caler une roue non directrice, puis calage 4 points en moins de 5 minutes pour créer l’accès. Un 5e point possible pour appuyer les outils.","Sur le côté : stabiliser dans le sens du basculement, côté pavillon au niveau des montants ; étais au 1/3 avant et au 1/3 arrière.","Sur le toit (cas le plus fréquent) : le moteur fait pencher vers l’avant ; caler l’arrière et de part et d’autre à la base du montant A ; étais de chaque côté. Moteur arrière ou VEA : adapter."]],
 ["Règles",["L’utilisation des cales n’est pas normée (ex. cales escalier à l’envers, mais résistance diminuée).","Pas besoin de soulever : cales coins et cales d’ajustement font le travail.","Calage d’urgence : une fois l’écureuil en place, il ne bouge plus ; les équipiers maintiennent jusqu’au calage primaire.","Critères : le véhicule n’oscille plus ; calage contrôlé dès qu’une partie est découpée ou retirée."]]
],
o:["« Calage primaire roue arrière, puis 4 points sous les bas de caisse. Je veux ça en moins de 5 minutes. »","« Écureuil, tu rentres maintenant. Une fois en place, tu ne bouges plus. »"],
p:["Sur roues : caler une roue NON directrice.","Immobilisation des suspensions (GDO) : non systématique, au plus tôt ou juste avant l’extraction."]},

{id:"calroues",ch:"stab",t:"Calage d’un véhicule sur ses roues",src:"Référentiel 2.2",
cle:"Frein à main, cale de roue arrière (primaire), cales jusqu’au bas de caisse + cale coin enfoncée à la massette (secondaire). Ne pas lever : soulager les suspensions.",
b:[
 ["Déroulé",["Actionner le frein à main.","Caler l’une des roues arrière (calage primaire).","Empiler une hauteur de cales égale à la hauteur bas de caisse/sol ou engager des cales escalier/crantées.","Combler le reste avec une cale coin entre le sol et les cales, l’enfoncer à la massette (à défaut au pied) = calage secondaire."]],
 ["Conseils",["Calage 5 points recommandé pour une sortie arrière ou un travail sur le coffre (breaks, 4x4).","Privilégier les cales empilables au niveau de la victime.","Cales escalier/crantées : ne pas gêner l’ouverture des portes.","Parfois le calage se résume à combler les espaces creux.","Vérifier régulièrement."]],
 ["Méthodes alternatives",["Avec un équipier : il soulage le poids au passage de roue, on place les cales à l’avant (montant A) et à l’arrière (montant C).","Avec l’écarteur sous le montant B mis en tension, sans décoller les roues (cale coin au sol sous le bec pour une levée droite).","Inconvénient : on lève un côté et on modifie l’autre (ajuster avec des cales coins)."]]
],
o:["« Frein à main, cale roue arrière droite. Ensuite cales sous les bas de caisse aux montants A et C, et cale coin à la massette. »"],
p:["On ne lève pas le véhicule : on comble le vide entre bas de caisse et sol."]},

{id:"calcote",ch:"stab",t:"Calage d’un véhicule sur le côté",src:"Référentiel 2.3",
cle:"Cales côté pavillon aux montants A et C (primaire et secondaire), étais côté roues au 1/3 avant et 1/3 arrière (tertiaire), tension simultanée aux ordres du CA.",
b:[
 ["Déroulé",["Insérer des cales côté pavillon : chercher les montants A et C, combler (cales coins, cales escalier à l’envers + cale coin).","Le calage ne doit pas dépasser du pavillon (futures techniques).","Côté roues : étais au 1/3 avant et 1/3 arrière, sur des parties non mobiles.","Sangle face à l’étai ; crochet fixé sous la moitié de la hauteur déployée de l’étai.","Manchon de protection sur parties chaudes ou coupantes.","Tension des étais en simultané aux ordres du CA, verrouiller.","À la fin, plus d’oscillation ; l’entrée d’un équipier ne crée pas de mouvement préjudiciable."]],
 ["Alternatives",["Points de stabilisation déportés si un côté est inaccessible ; point fixe déporté avec les ceintures (vérifier l’intégrité).","Un seul étai en position centrale si 3 points de calage côté toit.","Étai sur capot ou coffre si très instable côté toit (couteau crochet ou cale réglable).","Parfois arrimer côté roues."]],
 ["Risques",["Qualité des 3 points d’ancrage de l’étai : sol, appui de la tête, point de fixation du crochet.","Basculement lors de la pose des cales primaires ; mouvement lors de la pose des étais.","Risque thermique (échappement, bloc moteur) ; pincement, écrasement."]]
],
o:["« Cales côté pavillon aux montants A et C. Étais côté roues, un au tiers avant, un au tiers arrière. À mon top, tension ensemble… top ! Verrouillez. »"],
p:["Crochet SOUS la moitié de la hauteur déployée de l’étai.","La tension des étais se fait simultanément, aux ordres du CA."]},

{id:"caltoit",ch:"stab",t:"Calage d’un véhicule sur le toit",src:"Référentiel 2.4",
cle:"Calage primaire sous les rails du toit (points durs sous les montants), cales à l’avant contre le tangage, étais si toit déformé ou demi-pavillon inversé prévu.",
b:[
 ["Déroulé",["Cales escalier/crantées ou coins sous les rails du toit, sur les points durs (sous les montants).","Cales à l’avant de chaque côté contre le tangage.","Toit déformé, tangage important ou demi-pavillon inversé prévu : étais de part et d’autre, en tenant compte du PU, du PC et des accès latéraux.","Après gestion des vitrages : crochet de l’étai dans le cadre de vitre, de chaque côté.","Tension simultanée sous la responsabilité du CA, en maintenant le pied de l’étai avec le pied.","Accès aux portes à garder : étais au niveau des montants arrière.","Crochet jamais au-dessus de la moitié de la hauteur déployée."]],
 ["Variantes",["Ceintures découpées comme points d’accroche ; relier les 2 crochets par une ceinture (bloque les sièges) ou sous le pavillon (limite l’abaissement).","Crochets joints ; sangles croisées (Stab Fast Weber) : sangle de A au pied de B et inversement.","Les sangles doivent laisser passer la victime sur plan dur."]],
 ["Nota",["Tête de l’étai bien en place ; ne pas donner trop d’angle (sangle près du sol, dans l’axe).","Protéger les angles saillants, verrouiller les cliquets.","L’étai ne doit pas gêner l’idée de manœuvre du CA ; la sangle ne doit pas forcer sur la structure.","Pas de stabilité pavillonnaire sur certains VL (nouvelle Twingo) ou VEA : localiser le pack batterie."]]
],
o:["« Cales escalier sous les rails, montants A et C. Étais dans les cadres de vitre arrière pour garder les portes avant. Tension ensemble, pied sur le pied d’étai. »"],
