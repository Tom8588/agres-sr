{th:"cmd",ty:"qcm",q:"Sortie latérale à 90° : l’axe tête-cou-tronc n’est préservé que…",o:["Avec un plan dur glissé sous le bassin","Avec l’ACT combinée au collier cervical","Avec deux équipiers au maintien tête","Il ne peut jamais être préservé"],a:1,x:"Référentiel 1.1 : uniquement par l’emploi de l’ACT combinée avec le collier cervical.",s:"Référentiel 1.1"},
{th:"cmd",ty:"multi",q:"Les 3 réactions immédiates primordiales du CA SR (FMPA 2026) :",o:["Faire assurer la sécurité de la zone (zonage opérationnel)","Faire assurer la sécurité du ou des véhicules et de leur chargement","Faire assurer la sécurité et la survie des victimes (stop compression, stop hémorragie, DU)","Faire réaliser la charte graphique","Demander un médecin"],a:[0,1,2],x:"Zonage, sécurité des véhicules (5i), sécurité/survie des victimes.",s:"FMPA SR 2026"},
{th:"cmd",ty:"qcm",q:"D’après le schéma de l’heure d’or du référentiel, la phase « prise en charge et dégagement » représente…",o:["10-15 min","15-20 min","20-30 min","30-40 min"],a:2,x:"Trajet 15-20 min, prise en charge et dégagement 20-30 min, transport 15-20 min.",s:"Référentiel 1.1"},
{th:"cmd",ty:"qcm",q:"Quel choc est décrit par le GDO comme le plus létal pour les passagers ?",o:["Frontal","Latéral","Arrière","Retournement"],a:1,x:"Le choc latéral (sauf pour les enfants dans leur siège auto) : c’est là que l’habitacle subit le plus de déformation. Abord du côté opposé si possible.",s:"GDO ch.2 §2.1.2"},
{th:"cmd",ty:"qcm",q:"L’Energy Equivalent Speed (EES) est…",o:["La vitesse réelle au moment de l’impact, mesurée par l’ECU","La vitesse à laquelle il faudrait projeter le véhicule contre un obstacle fixe indéformable pour observer les mêmes déformations","La différence de vitesse entre les deux véhicules d’une collision","La vitesse minimale de déclenchement des airbags"],a:1,x:"Définition de l’annexe F. Impossible à déterminer précisément sur le terrain ; l’analyse des montants et longerons oriente.",s:"GDO annexe F"},
{th:"cmd",ty:"qcm",q:"Un chef de détachement spécialisé (ex. VSR en renfort) arrive. Que doit-il recueillir auprès du COS ?",o:["Le bilan de chaque victime","La nature de la mission, ses intentions, le temps imparti, les spécificités","Le nombre d’engins et les points d’eau","La liste du matériel déjà engagé"],a:1,x:"GDO ch.5 §2 : puis il expose l’étude de faisabilité, propose son idée de manœuvre et exprime ses besoins ; le COS la valide.",s:"GDO ch.5 §2"},
{th:"cmd",ty:"vf",q:"Pour le GDO, la notion de victime éjectée doit être associée à un critère de gravité.",a:true,x:"Oui, contrairement à l’incarcération qui est dissociée de la gravité.",s:"GDO ch.2 §2.2.1"},
{th:"cmd",ty:"qcm",q:"Plan complet : quel risque principal est cité dans la FMPA 2026 ?",o:["Suraccident","Déséquilibre et blessures secondaires","Allongement des délais","Aggravation des lésions voire mort"],a:2,x:"Plan complet : risque = allongement des délais ; efficacité = sécurité maximale. « Déséquilibre – blessures secondaires » = plan d’urgence ; « suraccident – aggravation » = plan immédiat.",s:"FMPA SR 2026"},

/* ---------- SÉCURITÉ & ZONAGE ---------- */
{th:"secu",ty:"qcm",q:"Zone de travail du chantier SR (FRO 50 / référentiel) :",o:["Rayon de 1 à 3 m","Rayon d’environ 3 à 5 m autour des véhicules","Rayon de 5 à 10 m","Rayon de 50 m"],a:1,x:"Zone de travail ≈ 3-5 m, zone logistique 5-10 m, zone de dépôt des structures juste à l’extérieur.",s:"FRO 50 §5"},
{th:"secu",ty:"qcm",q:"Où se trouve la zone de dépôt des structures (débris) ?",o:["Dans la zone de travail, côté opposé à la victime","Juste à l’extérieur de la zone logistique, jamais dans l’axe de sortie des victimes","Derrière le VSAV","Dans la zone tampon du balisage"],a:1,x:"Juste à l’extérieur de la 2e zone (logistique), non située dans l’axe de sortie.",s:"FRO 50 · Référentiel 1.1"},
{th:"secu",ty:"qcm",q:"Tenue réglementaire d’un équipier SR selon la FRO 50 :",o:["TSI/F1 manches baissées + chasuble HV","Tenue de feu + chasuble haute visibilité","Tenue de feu seule, la bande rétroréfléchissante suffit","Tenue de feu + ARI capelé"],a:1,x:"Chef de groupe, personnels SR, VPB, VBU : tenue de feu + chasuble HV. SUAP : TSI/F1 manches baissées + chasuble.",s:"FRO 50 §2"},
{th:"secu",ty:"qcm",q:"Engin arrêté sur les lieux : comment le conducteur braque-t-il les roues ?",o:["Vers la zone de l’accident, pour la protéger","Dans la direction opposée à la zone de flux","Roues droites","Vers le terre-plein central"],a:1,x:"GDO : roues braquées à l’opposé de la zone de flux, pour éviter qu’en cas de choc arrière l’engin soit projeté vers l’accident.",s:"GDO ch.3 §1.1"},
{th:"secu",ty:"qcm",q:"Zonage opérationnel réflexe du GDO (exemple à l’échelle) :",o:["Exclusion 20 m, contrôlée 50 m","Exclusion 50 m, contrôlée 100 m","Exclusion 100 m, contrôlée 200 m","Exclusion 5 m, contrôlée 10 m"],a:1,x:"Zone d’exclusion 50 m de rayon, zone contrôlée 100 m.",s:"GDO ch.5 §1.1"},
{th:"secu",ty:"qcm",q:"Combien de FLU peuvent être utilisées simultanément sur un même chantier ?",o:["Une seule","Deux au maximum, gestionnaires de voirie et SP compris","Deux par service (SIS et gestionnaire)","Sans limite si la voie est fermée"],a:1,x:"Interdit d’utiliser plus de 2 FLU en simultané, gestionnaires et SP compris.",s:"GDO ch.3 §1.2"},
{th:"secu",ty:"qcm",q:"La FLU peut être utilisée…",o:["Sur toutes les routes","Uniquement sur les voies des routes à chaussées séparées","Uniquement sur autoroute concédée","Uniquement de nuit"],a:1,x:"En remplacement ou complément du biseau, uniquement sur routes à chaussées séparées.",s:"GDO ch.3 §1.2"},
{th:"secu",ty:"ordre",q:"Remets dans l’ordre, de l’amont vers l’aval, les zones du balisage d’urgence.",o:["Zone d’approche / présignalisation","Zone tampon","Zone de travail","Zone de stationnement"],x:"L’ordre peut être modifié selon l’intervention (produit chimique, vent) ; les zones de travail et de stationnement peuvent être interverties.",s:"GDO ch.3 §1.2"},
{th:"secu",ty:"qcm",q:"Distance de freinage à 80 km/h sur route mouillée (annexe G) :",o:["64 m","80 m","96 m","120 m"],a:2,x:"80 km/h : 64 m sec, 96 m mouillé. 50 km/h : 25/38 m. 130 km/h : 169/254 m.",s:"GDO annexe G"},
{th:"secu",ty:"qcm",q:"Distance de freinage à 130 km/h, route sèche (annexe G) :",o:["130 m","169 m","210 m","254 m"],a:1,x:"169 m sec, 254 m mouillé.",s:"GDO annexe G"},
{th:"secu",ty:"vf",q:"La régulation de la circulation est une mission des sapeurs-pompiers lorsque les forces de l’ordre ne sont pas encore arrivées.",a:false,x:"Le GDO est explicite : la régulation incombe aux forces de l’ordre et non aux SP. Les SP posent une signalisation temporaire d’urgence.",s:"GDO ch.3 §1.2"},
{th:"secu",ty:"qcm",q:"Sur un réseau autoroutier concédé, la signalisation temporaire posée par le SIS…",o:["Reste en place jusqu’à la fin de l’intervention","Doit être remplacée dans son intégralité et au plus vite par la société concessionnaire","Est complétée par le concessionnaire sans être retirée","Est retirée par les FDO"],a:1,x:"Remplacée intégralement et dans les plus brefs délais (arrêté du 13 juillet 2022).",s:"GDO ch.3 §1.2"},
{th:"secu",ty:"qcm",q:"Le retrait du matériel de signalisation se fait…",o:["Dans le même sens que la pose","Dans le sens inverse de la pose, si possible sous la protection d’un véhicule","Par les FDO uniquement","Du plus proche au plus éloigné du chantier, à pied"],a:1,x:"Sens inverse de la pose, sous protection d’un véhicule, en respectant le code de la route.",s:"GDO ch.3 §1.3"},
{th:"secu",ty:"multi",q:"Règles d’utilisation des outils hydrauliques (référentiel / GDO). Coche les affirmations justes.",o:["Becs de l’écarteur engagés au moins à moitié avant la pleine puissance","Couper au plus près de l’axe de la cisaille, lames perpendiculaires à la tôle","Utiliser la pointe des becs pour forcer à pleine puissance","Au-dessus de la ceinture, porter l’outil avec l’avant-bras, comme un enfant","Se placer entre l’outil et le véhicule pour mieux le contrôler"],a:[0,1,3],x:"La pointe des becs sert seulement à agrandir une fente. Jamais entre l’outil et le véhicule.",s:"Référentiel 1.3 · GDO ch.3 §3.5"},
{th:"secu",ty:"qcm",q:"La cisaille « chasse » et tu sens que tu luttes contre l’outil. Que fais-tu ?",o:["Tu forces en t’appuyant sur la poignée","Tu demandes à l’équipier de tenir la tôle","Tu arrêtes et repositionnes : cisaille plus près de l’axe (ou écarteur replacé dans un interstice)","Tu termines à la scie sabre à pleine vitesse"],a:2,x:"Ne jamais lutter contre la force des outils.",s:"Référentiel 1.3"},
{th:"secu",ty:"qcm",q:"Qui dessine la charte graphique dans le SDIS 88 ?",o:["Le CA SR ou un équipier SR qualifié","Uniquement le CA SR","Le COS","L’équipier qui a dégarni"],a:1,x:"« La charte graphique est dessinée uniquement par le CA SR. » Le dégarnissage, lui, peut être partagé.",s:"Référentiel 1.2"},
{th:"secu",ty:"multi",q:"Charte graphique SDIS 88 : quels éléments sont OBLIGATOIRES ?",o:["Zone dangereuse coupe interdite (hachures rouges)","Endroit de coupe (trait)","Limite supérieure de la zone de coupe","Limite inférieure de la zone de coupe"],a:[0,1],x:"Les limites supérieure/inférieure de la zone de coupe sont optionnelles.",s:"Référentiel 1.2"},
{th:"secu",ty:"qcm",q:"Dans le SDIS 88, la carburation est notée…",o:["En rouge sur le capot","En jaune, à proximité du réservoir, de manière visible, sur les parties non mobiles","En blanc sur la lunette arrière","Uniquement sur la fiche bilan"],a:1,x:"Couleur adaptée à la couleur de la voiture si besoin. Le GDO propose capot avant ou montant arrière gauche.",s:"Référentiel 1.2"},
{th:"secu",ty:"qcm",q:"Abréviation SDIS 88 pour un véhicule hybride électrique :",o:["HY","HE","PHEV","EH"],a:1,x:"Référentiel : EL, HE, H2, GNV, GPL, GO, ESS. « HY » est l’abréviation du GDO ; « EH » est un code de carte grise.",s:"Référentiel 1.2"},
{th:"secu",ty:"vf",q:"Le GDO autorise à inscrire l’état des victimes sur le véhicule pour faciliter le travail du SMUR.",a:false,x:"Proscrit : dignité des victimes et risque de fausses informations sur les réseaux sociaux.",s:"GDO ch.3 §3.4"},
{th:"secu",ty:"qcm",q:"Dégarnissage : quelle consigne est juste ?",o:["Tout dégarnir pour ne rien rater","Dégarnir uniquement la zone où l’on va utiliser un outil","Dégarnir après la découpe pour vérifier","Le dégarnissage est facultatif si la FAD est disponible"],a:1,x:"Ne pas tout dégarnir (perte de temps, équipier mobilisé). GDO : dégarnissage obligatoire avant toute désincarcération sur la zone travaillée.",s:"Référentiel 1.2 · GDO ch.3 §3.3"},
{th:"secu",ty:"qcm",q:"Masque exigé par la FRO 50 lors de la découpe des vitrages et des montants en fibre de carbone :",o:["Aucun, les lunettes suffisent","FFP2 pour les sauveteurs seulement","FFP3 obligatoire pour les sauveteurs et les victimes","ARI pour le sauveteur, FFP2 pour la victime"],a:2,x:"FRO 50 : FFP3 obligatoire, sauveteurs ET victimes. GDO : a minima FFP2. Le SDIS 88 est plus exigeant.",s:"FRO 50 §4"},
{th:"secu",ty:"qcm",q:"Application Rescue Code : quelle affirmation est vraie ?",o:["Elle nécessite une connexion pour afficher une FAD","Elle fonctionne sans réseau, y compris par lecture des QR codes collés sur pare-brise et lunette","Elle n’existe qu’en anglais","Elle remplace la lecture de la carte grise"],a:1,x:"Appli française gratuite (2012, accord DGSCGC), ≈ 3 611 FAD, sans connexion. Euro Rescue : QR code avec connexion.",s:"GDO annexe B"},
{th:"secu",ty:"vf",q:"La couverture d’extinction est recommandée sur un VE en emballement thermique car elle coupe le rayonnement.",a:false,x:"À proscrire face à un emballement : les gaz inflammables et toxiques restent piégés dessous (danger au retrait).",s:"GDO ch.5 §3.1"},
{th:"secu",ty:"qcm",q:"Avant de descendre de l’engin à l’arrivée…",o:["Le CA descend en premier pour baliser","On vérifie que la circulation le permet et on descend, si possible, côté opposé à la circulation","On attend les FDO","On descend côté chaussée pour être vu"],a:1,x:"FRO 50 §3.2 et GDO ch.3.",s:"FRO 50"},
{th:"secu",ty:"qcm",q:"Zone de stationnement des engins : en règle générale…",o:["En épi","En file indienne dans le sens de la circulation","Sur la BAU à contresens","Devant la zone de travail pour la protéger"],a:1,x:"File indienne ; en cas de nombreuses victimes, le COS peut décider d’un stationnement en épi.",s:"GDO ch.3 §1.2"},

/* ---------- VÉHICULES & ORGANES ---------- */
{th:"veh",ty:"qcm",q:"Règle des 30-60-90 : à quoi correspond 60 ?",o:["60 cm de l’airbag latéral","60 cm de l’airbag frontal conducteur","60 cm de l’airbag frontal passager","60 cm de l’airbag rideau"],a:1,x:"30 cm airbags latéraux, 60 cm frontal conducteur, 90 cm frontal passager.",s:"FRO 50 §3.4 · FRO 51"},
{th:"veh",ty:"qcm",q:"Dans quel délai un airbag se gonfle-t-il ?",o:["Moins de 30 ms","Environ 100 ms","Environ 0,5 s","1 à 2 s"],a:0,x:"Moins de 30 millisecondes.",s:"GDO ch.1 §2.3.2"},
{th:"veh",ty:"qcm",q:"À partir de quelle vitesse d’impact les airbags peuvent-ils se déclencher (selon le type de choc) ?",o:["15 km/h","25 km/h","40 km/h","50 km/h"],a:1,x:"Égale ou supérieure à 25 km/h selon le type de choc.",s:"GDO ch.1 §2.3.2"},
{th:"veh",ty:"vf",q:"Couper le contact OU débrancher la batterie 12 V rend le système airbag inerte.",a:true,x:"GDO : « Couper le contact ou débrancher la batterie 12 V du véhicule rend le système airbag inerte. » Attention : le référentiel impose quand même la coupure batterie avant toute désincarcération.",s:"GDO ch.1 §2.3.2"},
{th:"veh",ty:"qcm",q:"Batterie encore branchée : tu coupes un faisceau qui contient les fils d’un générateur de gaz. Risque ?",o:["Aucun, l’ECU est protégé","Déclenchement du générateur par court-circuit","Coupure définitive de la HT","Mise en sécurité automatique de l’airbag"],a:1,x:"GDO : peut provoquer son déclenchement par un phénomène de court-circuit.",s:"GDO ch.1 §2.3.2"},
{th:"veh",ty:"qcm",q:"L’ECU déclenche les airbags quand…",o:["Un capteur dépasse le seuil de décélération","Deux capteurs envoient simultanément un signal « crash »","Le conducteur n’a pas bouclé sa ceinture","La vitesse dépasse 25 km/h"],a:1,x:"Uniquement quand deux capteurs envoient simultanément un signal de type crash.",s:"GDO ch.1 §2.3.2"},
{th:"veh",ty:"qcm",q:"Dans un feu de véhicule, les générateurs de gaz ont une sécurité intrinsèque qui les déclenche vers…",o:["80-110 °C","110-150 °C","180-220 °C","300-350 °C"],a:2,x:"Autour de 180-220 °C.",s:"GDO ch.1 §2.3.2"},
{th:"veh",ty:"qcm",q:"Ratio de protection ceinture / airbag cité par le GDO :",o:["50/50","70/30","80/20","90/10"],a:2,x:"80 % ceinture / 20 % airbag.",s:"GDO ch.1 §2.3.2"},
{th:"veh",ty:"qcm",q:"Un véhicule Start & Stop écrasé au niveau de son « système ultra-capacité » peut dégager…",o:["De l’hydrogène","De l’acétonitrile, toxique et inflammable","Du fluorure d’hydrogène","De l’argon"],a:1,x:"Système souvent dans l’aile avant gauche ou près du plancher. D’où l’interdiction d’écraser l’aile au passage de roue sur Start & Stop.",s:"GDO ch.2 §1.1.4 · Référentiel 3.2"},
{th:"veh",ty:"qcm",q:"Nomenclature des vitrages (FRO 50) : le polycarbonate correspond à…",o:["I","II","III","IV"],a:3,x:"Trempé : I · Feuilleté : II ou III · Polycarbonate : IV (pas de casse possible).",s:"FRO 50 §4"},
{th:"veh",ty:"qcm",q:"Élasticité du feuilleté indiquée par la FRO 50 :",o:["40 %","120 %","240 %","400 %"],a:2,x:"Feuille plastique, élasticité de 240 %, maintien de l’occupant dans le véhicule.",s:"FRO 50 §4"},
{th:"veh",ty:"qcm",q:"Résistances des aciers HLE, THLE, UHLE par rapport à un acier doux :",o:["2 à 3 fois","4 à 5 fois","7 à 10 fois","15 à 20 fois"],a:2,x:"Résistance mécanique 7 à 10 fois supérieure. À couper avec le cœur de l’outil et à faible vitesse.",s:"GDO ch.1 §2.1.1"},
{th:"veh",ty:"qcm",q:"Sur un PL, la zone renforcée en H de la cabine est reliée par…",o:["2 points de fixation","4 points de fixation","6 points de fixation","Une soudure continue"],a:1,x:"Elle correspond à la traverse de TdB des VL et contraint la poussée du tableau de bord.",s:"GDO ch.1 §2.1.2"},
{th:"veh",ty:"qcm",q:"L’eCall 112 est obligatoire sur les nouveaux modèles homologués après le…",o:["1er janvier 2015","31 mars 2018","12 octobre 2018","1er janvier 2020"],a:1,x:"VL et VUL homologués après le 31 mars 2018. Le MSD transmet notamment le VIN, l’énergie, la position, la direction et les 2 dernières positions.",s:"GDO ch.1 §2.3.3"},
{th:"veh",ty:"multi",q:"Éléments de sécurité TERTIAIRE (post-accident) :",o:["eCall","QR code secours","Fireman access","Prétensionneur de ceinture","Étiquette d’isolement de l’énergie","ESP"],a:[0,1,2,4],x:"Prétensionneur = passive. ESP = active.",s:"GDO ch.1 §2.3"},
{th:"veh",ty:"qcm",q:"Pare-brise collé : comment l’identifier selon le référentiel ?",o:["Marquage LAMISAFE","Présence de ronds noirs au niveau des bandes noires","Joint caoutchouc apparent","Code E2"],a:1,x:"Ronds noirs sur les bandes noires. LAMISAFE indique le type (feuilleté), pas le collage.",s:"Référentiel 1.7"},
{th:"veh",ty:"vf",q:"Le déploiement d’un airbag pyrotechnique libère de la fumée : c’est un signe de départ d’incendie à traiter immédiatement.",a:false,x:"La fumée n’est pas le signe d’un départ d’incendie (GDO).",s:"GDO ch.1 §2.3.2"},
{th:"veh",ty:"qcm",q:"Vérins de capot ou de hayon : que préconise le GDO ?",o:["Les couper en premier pour dégager le coffre","D’une manière générale, éviter de les sectionner (projection, huile)","Les chauffer pour les vider","Les percer au pointeau"],a:1,x:"Risque de projectiles (effets missiles) et de projection d’huile. Le référentiel rappelle aussi de ne pas couper les vérins de coffre quand on garde le coffre.",s:"GDO ch.2 §1.1.6"},

/* ---------- ÉNERGIES, FEUX, TMD ---------- */
{th:"ener",ty:"qcm",q:"Tension maximale citée par le GDO pour les systèmes HT des VE/hybrides :",o:["400 V","650 V","800 V","1 000 V"],a:2,x:"Jusqu’à 800 V. Les composants des véhicules H2 : 200 à 650 V.",s:"GDO ch.1 §4"},
{th:"ener",ty:"qcm",q:"Effet de la coupure du contact sur un VE ou hybride :",o:["Aucun, il faut le service plug","Ouverture des relais HT (1er niveau de sécurité)","Décharge complète de la batterie HT","Coupure de la 12 V"],a:1,x:"Et fermeture des électrovannes sur GPL, GNC, H2.",s:"GDO ch.5 §4.2.5"},
{th:"ener",ty:"qcm",q:"Tu n’as pas la FAD d’un hybride. Le service plug est accessible sous le siège arrière. Que fais-tu ?",o:["Tu le retires : c’est la meilleure garantie","Tu le retires seulement après la coupure 12 V","Aucune manipulation du service plug ni de la boucle d’isolement sans connaissance des préconisations de la FAD","Tu demandes à l’équipier de le retirer avec des gants isolants"],a:2,x:"FRO 51 et GDO : pas de manipulation sans la FAD.",s:"FRO 51 · GDO ch.5 §4.2.5"},
{th:"ener",ty:"qcm",q:"Smart key (carte main libre) : à quelle distance l’éloigner ?",o:["1 m","3 m","Au moins 5 m","10 m"],a:2,x:"FRO 50 et GDO : au moins 5 mètres.",s:"FRO 50 §3.3 · GDO"},
{th:"ener",ty:"qcm",q:"Sur un VEA, quelle zone du bas de caisse ne doit pas être touchée (écrasement, coupe) ?",o:["10 cm","20 cm","30 cm","50 cm"],a:1,x:"Référentiel : interdiction de toucher au bas de caisse dans une zone de 20 cm (et couper au-dessus de la charnière basse pour la fenêtre/décharge : point de renfort et zone 20 cm VEA).",s:"Référentiel 3.1 · 4.3"},
{th:"ener",ty:"qcm",q:"Délai d’emballement thermique d’une batterie soumise à un incendie (GDO) :",o:["Moins de 5 min","Entre 20 et 30 min selon la technologie","1 à 2 h","Plus de 24 h"],a:1,x:"30 min pour les nouvelles technologies, 20 min pour les plus anciennes. Réignition possible au-delà de 24 h.",s:"GDO ch.2 §1.1.2"},
{th:"ener",ty:"multi",q:"Signes d’un emballement thermique de batterie :",o:["Crépitements","Bruit de gaz sous pression (comme une torchère)","Épaississement des fumées","Flammes plus claires et plus vives","Baisse de la température"],a:[0,1,2,3],x:"Aussi : élévation de température, feu entretenu, flux rayonné important.",s:"GDO ch.2 §1.1.2"},
{th:"ener",ty:"qcm",q:"VE en feu, batterie emballée, aucun dispositif constructeur (pas de trappe). Que fais-tu ?",o:["Tu perces le casing au Halligan pour y faire entrer l’eau","Tu cherches à intégrer l’eau par les déformations ou parties fondues ; si c’est inefficace, tu t’abstiens d’éteindre et tu protèges tiers et environnement","Tu noies le véhicule en continu jusqu’à extinction","Tu poses une couverture d’extinction"],a:1,x:"Jamais d’ouverture à l’outil de forcement. Si inefficace : s’abstenir (combustion plus longue, fumées, métal en fusion, reprise de feu, pollution).",s:"GDO ch.5 §3.1.1.2"},
{th:"ener",ty:"qcm",q:"Après extinction d’un VE dont la batterie n’est pas totalement détruite :",o:["On le remet au dépanneur sans consigne particulière","Quarantaine sur sol inerte (lit de sable) et information des FDO et du dépanneur sur l’énergie et le risque de ré-ignition","Immersion obligatoire en benne","Refroidissement continu 24 h"],a:1,x:"Transport : benne avec lit de matériau inerte plutôt que benne d’immersion (retex FDNY). L’immersion est envisageable pour les petites mobilités.",s:"GDO ch.5 §3.1.1.2"},
{th:"ener",ty:"qcm",q:"Feu de VL : débit minimum de la lance et axe de progression ?",o:["150 L/min, axe latéral","250 L/min, axe 3/4 avant","250 L/min, axe arrière","500 L/min, axe frontal"],a:1,x:"Lance ≥ 250 L/min, binôme dans l’axe 3/4 avant, derrière des écrans si possible.",s:"GDO ch.5 §3.1"},
{th:"ener",ty:"qcm",q:"Zonage a priori lors d’un feu de véhicule :",o:["10 m","25 m","50 m","100 m"],a:2,x:"Fixé à 50 mètres.",s:"GDO ch.3 §2"},
{th:"ener",ty:"multi",q:"Feu d’un véhicule au gaz : mesures du COS (GDO).",o:["Interdire prioritairement les zones dans l’axe du véhicule","ARI coiffé par le personnel d’attaque","Approche par l’avant du véhicule, en dehors de son axe et des côtés","Deux lances si possible, dont une refroidit le réservoir","Approche par l’arrière pour atteindre vite le réservoir"],a:[0,1,2,3],x:"La torchère est généralement orientée vers l’arrière.",s:"GDO ch.5 §3.1.1.1"},
{th:"ener",ty:"qcm",q:"GPL-c : pression maximale de stockage et tarage de la soupape ?",o:["5 bar / 10 bar","10 bar / 27 bar","27 bar / 110 bar","200 bar / 250 bar"],a:1,x:"10 bar max ; soupape tarée à 27 bar ; thermo-fusible éventuel à 110 °C ; remplissage limité à 80 % par la polyvanne.",s:"GDO ch.1 §3"},
{th:"ener",ty:"qcm",q:"Véhicule GPL sur le toit, la soupape s’ouvre. Type de torchère ?",o:["Phase gazeuse, cyclée","Phase liquide, continue","Phase gazeuse, continue","Aucune : la soupape est bloquée sur le toit"],a:1,x:"Sur le toit, la soupape est dans la phase liquide : torchère liquide continue. Sur ses roues : gazeuse cyclée. Thermo-fusible : continue, gazeuse.",s:"GDO ch.2 §1.1.1"},
{th:"ener",ty:"qcm",q:"Longueur possible d’une torchère de gaz enflammée (GDO) :",o:["3 m","5 m","15 m","50 m"],a:2,x:"Peut atteindre 15 mètres.",s:"GDO ch.2 §1.1.1"},
{th:"ener",ty:"qcm",q:"BLEVE d’un réservoir GPL de 50 L : portée des éclats dans les zones avant/arrière ?",o:["30 m","50 m","100 m","750 m"],a:2,x:"Éclats jusqu’à 100 m, boule de feu jusqu’à 30 m de diamètre pendant 3 s, surpression ressentie jusqu’à 120 m. PL : effets létaux jusqu’à 750 m.",s:"GDO ch.2 §1.1.1"},
{th:"ener",ty:"qcm",q:"GNC : pression de stockage ?",o:["10 bar","27 bar","200 à 250 bar","700 bar"],a:2,x:"200-250 bar, ~97 % méthane, odorisé. Canalisations inox grises.",s:"GDO ch.1 §3"},
{th:"ener",ty:"qcm",q:"Sur la carte grise (P3), un véhicule GNC ou GNL apparaît sous…",o:["GNV","GN","CNG / LNG","GZ"],a:1,x:"« GN » pour gaz naturel, quel que soit le mode.",s:"GDO ch.1 §3"},
{th:"ener",ty:"qcm",q:"GNL : soupapes de surpression principale et secondaire ?",o:["10 et 27 bar","16 et 24 bar","200 et 250 bar","8 et 16 bar"],a:1,x:"16 bar et 24 bar. Le moteur fonctionne au GNL saturé ~ -130 °C à 8 bar ; stockage -160 °C.",s:"GDO ch.1 §3"},
{th:"ener",ty:"qcm",q:"Pourquoi éviter l’eau directement sur une fuite de GNL ?",o:["Elle gèle et bouche la fuite","Vaporisation quasi instantanée, expansion ~600 fois : « explosion froide » (surpression sans combustion)","Réaction chimique toxique","Le GNL est soluble dans l’eau"],a:1,x:"Différence de température entre GNL (-160 °C) et eau.",s:"GDO ch.5 §5.2"},
{th:"ener",ty:"qcm",q:"Hydrogène : pressions des réservoirs des véhicules ?",o:["200 ou 300 bar","350 ou 700 bar","550 ou 975 bar","10 ou 27 bar"],a:1,x:"350 ou 700 bar. 200/300 bar = remorques ; 550/975 bar = stockages tampons de station.",s:"GDO ch.1 §1.5.3 & §3"},
{th:"ener",ty:"qcm",q:"Comment repérer une flamme d’hydrogène de jour ?",o:["À sa couleur jaune","À l’odeur","À la caméra thermique (flamme invisible), et au bruit très fort du TPRD","Au détecteur de CO"],a:2,x:"Flamme invisible à l’œil nu de jour sans particules.",s:"GDO ch.2 §1.1.1"},
{th:"ener",ty:"qcm",q:"Le TPRD d’un réservoir H2 s’ouvre vers…",o:["60 °C","110 °C","180 °C","430 °C"],a:1,x:"Environ 110 °C ; rejet orienté vers le bas, sous le véhicule. Un réservoir H2 ou GNC se vide en ~3 min.",s:"GDO ch.1 §3"},
{th:"ener",ty:"qcm",q:"Code carte grise d’un véhicule à pile à combustible (hydrogène-électricité non rechargeable) :",o:["H2","HE","HH","EL"],a:2,x:"HH = pile à combustible ; HE = pile rechargeable (rare) ; H2 = moteur thermique à hydrogène.",s:"GDO ch.1 §3 · annexe C"},
{th:"ener",ty:"qcm",q:"Remorque H2 accidentée en feu : zone d’exclusion préconisée ?",o:["20 m","50 m","100 m","200 m"],a:1,x:"Zone d’exclusion de 50 m ; ne pas intervenir sur la semi sauf dégagement nécessaire ; imagerie thermique. TPRD enflammé : flamme 10 m, 3 kW/m² à ~15 m, LIE à 20 m.",s:"GDO ch.5 §5.1"},
{th:"ener",ty:"qcm",q:"Véhicule électrique en charge sur une borne, en feu, sans confirmation de coupure électrique :",o:["Attaque offensive classique","On se limite à protéger l’environnement","On débranche le câble de charge à la main","On coupe le câble à la cisaille isolée"],a:1,x:"Isoler la borne (arrêt d’urgence ou coupure générale) ; sans confirmation : protéger l’environnement.",s:"GDO ch.5 §3.3"},
{th:"ener",ty:"qcm",q:"Plaque orange TMD : signification du X devant le code danger ?",o:["Matière explosive","Danger renforcé","Réagit violemment avec l’eau","Transport en quantité limitée"],a:2,x:"Le produit présente une réaction violente avec l’eau.",s:"GDO ch.1 §5"},
{th:"ener",ty:"qcm",q:"Code danger « 22 » :",o:["Gaz très inflammable","Gaz réfrigéré","Gaz toxique","Gaz comburant"],a:1,x:"Exceptions au doublement : 22 gaz réfrigéré, 44 solide inflammable fondu à chaud, 99 matières diverses transportées à chaud, 333 liquide pyrophorique.",s:"GDO ch.1 §5"},
{th:"ener",ty:"qcm",q:"Dimensions de la plaque orange TMD :",o:["30 x 30 cm","40 x 30 cm","25 x 25 cm","50 x 40 cm"],a:1,x:"40 cm x 30 cm. L’étiquette de danger fait 25 x 25 cm.",s:"GDO ch.1 §5"},
{th:"ener",ty:"qcm",q:"Le numéro ONU (bas de la plaque orange) comporte…",o:["2 chiffres","3 chiffres","4 chiffres","Lettres et chiffres"],a:2,x:"Toujours 4 chiffres.",s:"GDO ch.1 §5"},
{th:"ener",ty:"vf",q:"Lors d’une intervention sur un véhicule immergé, l’énergie embarquée est la priorité absolue avant toute action de sauvetage.",a:false,x:"Le type d’énergie ne sera pas la priorité des sauveteurs ; la FAD est un préalable avant le dégagement du véhicule.",s:"GDO ch.5 §5.3"},
{th:"ener",ty:"qcm",q:"Pneumatiques en feu : à quelle température les vapeurs de pyrolyse peuvent-elles exploser ?",o:["180 °C","250 °C","430 °C","800 °C"],a:2,x:"≈ 430 °C. Éclatement possible à retardement, même après extinction.",s:"GDO ch.2 §1.1.5"},
{th:"ener",ty:"qcm",q:"Feu de batteries LMP pleinement développé :",o:["Attaque massive à l’eau","Uniquement stopper les propagations en attendant la baisse d’intensité (~15 min)","Mousse haut foisonnement","Poudre BC"],a:1,x:"Puissance très élevée sur un temps court ; risque de réaction violente si projection d’eau.",s:"GDO ch.5 §3.1 note 86"},

/* ---------- GESTES DE BASE ---------- */
{th:"gen",ty:"qcm",q:"Ordre de démontage des cosses de la batterie 12 V :",o:["+ puis –","– puis +","Uniquement le –","Uniquement le +"],a:1,x:"Démonter systématiquement les deux cosses en commençant par le –, puis le +.",s:"Référentiel 1.4"},
{th:"gen",ty:"multi",q:"Neutralisation de la batterie 12 V (référentiel). Coche ce qui est juste.",o:["Ce n’est pas une réaction immédiate, sauf début d’incendie ou risque électrique","Elle est obligatoire avant toute action de désincarcération, selon la FAD","On réalise d’abord les actions qui ont besoin d’énergie (vitres, sièges, coffre, volant…)","Elle s’applique aussi à la HT des VE","Sur PL, on coupe le 24 V"],a:[0,1,2,4],x:"Ne s’applique pas aux circuits HT ; sur VE/VHE l’isolement électrique est prioritaire.",s:"Référentiel 1.4"},
{th:"gen",ty:"qcm",q:"Vitrage trempé à casser : par où commencer ?",o:["Par le vitrage le plus proche de la victime, pour l’accès","Par le vitrage le plus éloigné de la victime, au pointeau dans un angle, de l’intérieur vers l’extérieur","Au centre de la vitre","Par le pare-brise"],a:1,x:"Le premier vitrage (le plus éloigné) sert d’accès : décoller le film de l’angle choisi.",s:"Référentiel 1.8"},
{th:"gen",ty:"qcm",q:"Kit gestion du verre sur vitre trempée : technique correcte ?",o:["Rouleau 1 partie collante contre le vitrage vers le bas, rouleau 2 en maroufle, coup sec vers le bas","Rouleau 1 partie non collante contre la vitre, puis découpe","Film posé à l’intérieur uniquement","Coller le film puis casser au centre"],a:0,x:"Puis coup sec vers le bas pour détacher la partie prédécoupée.",s:"Référentiel 1.8"},
{th:"gen",ty:"qcm",q:"Pare-brise : vitesse de la scie sabre et réduction de poussière ?",o:["Vitesse maximale, aspersion inutile","Plus petite vitesse, aspersion avec une bouteille d’eau percée, film possible (−70 % de poussière)","Vitesse moyenne, film interdit","Vitesse maximale avec lame neuve"],a:1,x:"Lames usagées possibles : le verre est très abrasif.",s:"Référentiel 1.7"},
{th:"gen",ty:"qcm",q:"Découpe horizontale d’un pare-brise : où perforer de préférence ?",o:["En haut à gauche","Au milieu et en partie basse, sans se coller à la base","Contre la base pour couper au ras","Dans un coin"],a:1,x:"Ne pas se coller à la base pour ne pas couper dans le tableau de bord.",s:"Référentiel 1.7"},
{th:"gen",ty:"vf",q:"La partie inférieure d’un pare-brise doit toujours être coupée pour le déposer.",a:false,x:"Seulement si nécessaire : on peut rabattre le pare-brise vers le capot.",s:"Référentiel 1.7"},
{th:"gen",ty:"ordre",q:"Vitrage jointé : remets les étapes dans l’ordre.",o:["Retirer l’agrafe de jonction du joint","Couper le joint sur la partie supérieure","Déposer le joint","Extraire le vitrage en le repoussant de l’intérieur vers l’extérieur"],x:"Opération à deux SP, vigilance lors de la découpe du joint.",s:"Référentiel 1.9"},
{th:"gen",ty:"qcm",q:"Couper une ceinture : quel geste ?",o:["Tirer la ceinture vers soi puis couper côté boucle","Retenir côté enrouleur (coup de fouet), geste mesuré, jamais vers la victime","Couper au plus près de la victime","Couper sans retenir : le prétensionneur est désactivé"],a:1,x:"Retenir côté enrouleur, ne pas exagérer, pas vers la victime.",s:"Référentiel 1.5"},
{th:"gen",ty:"qcm",q:"Compression du fauteuil (siège nouvelle génération) : où placer l’appui ?",o:["Sur le côté du dossier pour le faire pivoter","Au milieu du siège, appui supérieur résistant et stable","Avec une cale en partie supérieure pour répartir","Sur l’appui-tête"],a:1,x:"Sur le côté, le siège vrille. Pas de cale en partie supérieure ni inférieure. Basculer, ne pas écraser.",s:"Référentiel 1.6"},
{th:"gen",ty:"qcm",q:"Pourquoi éviter la compression du fauteuil sur les sièges anciens ?",o:["Risque de déclencher l’airbag","Risque de lever l’assise des jambes","Le dossier casse net","Les rails se déboîtent"],a:1,x:"Technique efficace sur nouvelle génération, à éviter sur anciens (risque de lever l’assise des jambes). Sur anciens : découpe du fauteuil.",s:"Référentiel 1.6"},
{th:"gen",ty:"qcm",q:"Dégagement d’urgence et dossier de siège : technique rapide ?",o:["Couper les deux côtés du dossier","Ne couper qu’un côté du dossier puis le pivoter","Écraser le dossier au vérin","Démonter le siège"],a:1,x:"Lors d’un dégagement d’urgence : ne couper qu’un côté du dossier puis le pivoter.",s:"Référentiel 1.6"},
{th:"gen",ty:"qcm",q:"Réglage électrique du siège : quand le tester ?",o:["Après la coupure batterie, sur batterie de secours","Avant de couper le contact et de gérer la batterie","Après le calage tertiaire","Jamais : risque d’airbag"],a:1,x:"Prioriser la gestion par le système électrique ou mécanique ; tester avant de couper le contact.",s:"Référentiel 1.6"},
{th:"gen",ty:"qcm",q:"Écrasement de banquette arrière à l’écarteur : appuis ?",o:["Un bec sur l’assise, l’autre sur le plancher","Un bec en haut de la banquette, l’autre sous les rails du toit","Un bec sur le montant B, l’autre sur le montant C","Un bec sur l’appui-tête, l’autre sur le hayon"],a:1,x:"Angle suffisant pour faire descendre la banquette, pas l’écraser ; maintenir ou sangler l’écarteur.",s:"Référentiel 1.6"},

/* ---------- STABILISATION ---------- */
{th:"stab",ty:"ordre",q:"Chronologie type de la stabilisation : remets dans l’ordre.",o:["Blocage (calage primaire) : limiter les mouvements avant/arrière","Calage (calage secondaire) : limiter les mouvements préjudiciables","Étaiement si nécessaire (calage tertiaire) : limiter le balancement"],x:"L’oubli d’une étape peut avoir des conséquences dramatiques.",s:"Référentiel 2.1"},
{th:"stab",ty:"qcm",q:"Quand l’homme d’intérieur (écureuil) peut-il pénétrer dans le véhicule ?",o:["Après l’étaiement complet","Après le calage primaire (ou un calage d’urgence sur décision du COS)","Dès l’arrivée","Après la coupure batterie"],a:1,x:"Après calage primaire ; calage d’urgence possible par les personnels qui maintiennent le véhicule.",s:"Référentiel 2.1"},
{th:"stab",ty:"qcm",q:"VL sur ses 4 roues : délai visé pour le calage 4 points ?",o:["Moins de 2 min","Moins de 5 min","Moins de 10 min","Pas de délai"],a:1,x:"Moins de 5 minutes, afin de créer un accès à la victime.",s:"Référentiel 2.1"},
{th:"stab",ty:"qcm",q:"Calage primaire d’un VL sur ses roues : quelle roue ?",o:["Une roue directrice","Une des roues non directrices (une roue arrière)","Les quatre roues","Aucune, frein à main seulement"],a:1,x:"Généralités : caler une des roues non directrices ; FT 2.2 : caler l’une des roues arrière.",s:"Référentiel 2.1 · 2.2"},
{th:"stab",ty:"qcm",q:"Calage sur roues : le but est…",o:["De soulever légèrement le véhicule pour décharger les pneus","De ne pas lever, simplement soulager les suspensions en comblant le vide entre bas de caisse et sol","De le lever de 5 cm pour glisser le plan dur","De bloquer les roues avant"],a:1,x:"Ne pas lever le véhicule.",s:"Référentiel 2.2"},
{th:"stab",ty:"qcm",q:"Quand faut-il préférer un calage 5 points sur un VL sur ses roues ?",o:["Toujours sur VE","Sortie arrière ou travail sur le coffre (breaks, 4x4)","Quand le véhicule est en pente","Quand deux victimes sont à l’avant"],a:1,x:"Améliore les ouvertures et la stabilité lors des extractions.",s:"Référentiel 2.2"},
{th:"stab",ty:"qcm",q:"VL sur le côté : position des étais côté roues ?",o:["Un au centre","Un au 1/3 avant et un au 1/3 arrière","Aux extrémités, pare-chocs","Sur les roues"],a:1,x:"Sur des parties non mobiles. Un seul étai central possible s’il y a 3 points de calage côté toit.",s:"Référentiel 2.3"},
{th:"stab",ty:"qcm",q:"Étai à sangle : où fixer le crochet ?",o:["Au-dessus de la moitié de la hauteur déployée de l’étai","En dessous de la moitié de la hauteur déployée de l’étai","Au sommet de l’étai","Peu importe, si la sangle est tendue"],a:1,x:"Côté et toit : crochet sous la moitié de la hauteur déployée. Sangle face à l’étai, au plus près du sol, dans l’axe.",s:"Référentiel 2.3 · 2.4"},
{th:"stab",ty:"qcm",q:"Tension des étais :",o:["Chaque équipier tend son étai dès qu’il est posé","En simultané, aux ordres du CA, puis verrouillage","Le plus en tension possible pour plaquer le véhicule","Par le CA seul"],a:1,x:"La tension se fait en simultané sous les ordres du C/A (verrouiller les étais).",s:"Référentiel 2.3"},
{th:"stab",ty:"multi",q:"Les 3 points d’ancrage de l’étai à sangle à vérifier :",o:["La nature du sol","L’appui de la tête","Le point de fixation du crochet","La pression des pneus","La position du frein à main"],a:[0,1,2],x:"Référentiel 2.3 – risques et contraintes.",s:"Référentiel 2.3"},
{th:"stab",ty:"qcm",q:"VL sur le toit, accès aux portes à maintenir : où positionner les étais ?",o:["Au niveau des montants A","Au niveau des montants arrière","Sur le capot","Sous le pavillon"],a:1,x:"Si les accès aux portières doivent être maintenus, étais au niveau des montants arrière.",s:"Référentiel 2.4"},
{th:"stab",ty:"qcm",q:"VL sur le toit : direction habituelle du basculement et calage associé ?",o:["Il penche vers l’arrière : caler l’avant","La masse du moteur le fait pencher vers l’avant : caler l’espace entre l’arrière et le sol et de part et d’autre à la base du montant A","Il est stable, pas de calage","Il penche sur le côté conducteur"],a:1,x:"Adapter si moteur arrière ou VEA (batterie centrale).",s:"Référentiel 2.1"},
{th:"stab",ty:"vf",q:"L’utilisation des cales est normée : une cale escalier ne doit jamais être utilisée à l’envers.",a:false,x:"Non normée : on peut les utiliser dans tous les sens. À l’envers, une cale escalier perd de la résistance.",s:"Référentiel 2.1 · 2.2"},
{th:"stab",ty:"qcm",q:"Arrimage : quel point fixe est à proscrire selon le GDO ?",o:["Un arbre","Un poteau","Un lampadaire","Un engin de secours calé"],a:2,x:"Les lampadaires présentent une faible résistance.",s:"GDO ch.3 §3.1"},
{th:"stab",ty:"qcm",q:"Arrimage : pourquoi rattraper l’excédent de sangle avant de cliqueter ?",o:["Pour gagner du temps au démontage","Sinon la bobine du cliquet se charge vite et ne fonctionne plus","Pour éviter que la sangle traîne au sol","Pour respecter la charge de rupture"],a:1,x:"Puis tension sur ordre du CA et vérification de la fermeture du cliquet.",s:"Référentiel 2.5"},
{th:"stab",ty:"vf",q:"Une roue qui peut tourner est considérée comme un point d’arrimage fiable.",a:false,x:"Une roue qui peut tourner n’est pas considérée comme fiable.",s:"Référentiel 2.5"},
{th:"stab",ty:"qcm",q:"Calage d’urgence pour faire entrer l’écureuil : quelle consigne ?",o:["L’écureuil peut se déplacer librement pour faire le bilan","Une fois en place, l’homme d’intérieur ne bouge plus ; les équipiers maintiennent jusqu’au calage primaire","Le calage d’urgence remplace le calage primaire","Il se fait uniquement avec des cales coins"],a:1,x:"Référentiel 2.1.",s:"Référentiel 2.1"},

/* ---------- OUVERTURES ---------- */
{th:"ouv",ty:"qcm",q:"Ouverture de porte à l’écarteur : position de l’outil ?",o:["À 90° du véhicule pour une poussée maximale","Angle inférieur à 90°, quasi parallèle au véhicule, pour ouvrir et non écraser","Perpendiculaire à la porte, becs sur la tôle fine","En diagonale vers le sol"],a:1,x:"Becs sur les parties dures (charnières, cadre intérieur).",s:"Référentiel 3.1"},
{th:"ouv",ty:"qcm",q:"Pour enlever une porte, quelle charnière en premier et pourquoi ?",o:["La supérieure, pour que la porte tombe au sol","L’inférieure, puis la supérieure, pour limiter le risque de modifier le calage par l’appui de l’angle de porte au sol","Les deux en même temps","Peu importe, si un équipier tient la porte"],a:1,x:"Charnière inférieure puis supérieure.",s:"Référentiel 3.1"},
{th:"ouv",ty:"qcm",q:"Méthode de l’écrasement de serrure : réglage ?",o:["Pincer en biais sous la poignée, à 20 cm de la serrure","Pincer en biais au-dessus de la poignée, dans les 10 cm de la serrure, angle ~45°","Pincer à plat au niveau de la charnière","Pincer au centre de la porte à 90°"],a:1,x:"Plus efficace sur les portes arrière. Airbag latéral dans la porte : dégarnir ou autre technique.",s:"Référentiel 3.1"},
{th:"ouv",ty:"qcm",q:"Méthode du travers de fenêtre : placement de l’écarteur ?",o:["Horizontal sur le bas de caisse","Vertical dans le cadre de la vitre, au plus près du montant B ou C","Dans la serrure","Entre l’aile et la porte"],a:1,x:"Sur l’épaule, l’angle est souvent bon. Applicable aussi aux charnières.",s:"Référentiel 3.1"},
{th:"ouv",ty:"qcm",q:"Pourquoi insérer une balle de tennis ou une cale dans la poignée de porte ?",o:["Pour protéger la poignée","Pour libérer le mécanisme de serrure (poignée maintenue tirée)","Pour marquer la porte du PU","Pour éviter le claquement"],a:1,x:"Règle commune ; en porte latérale « après avoir libéré le mécanisme de la serrure avec une balle ou une cale ».",s:"Référentiel 3.1 · 3.3"},
{th:"ouv",ty:"qcm",q:"La porte se déchire à l’ouverture. Que préconise le référentiel pour gagner du temps ?",o:["Couper la porte en deux","Couper l’arrêt de porte et sécuriser la porte avec une corde à cliquet","Passer par les charnières","Changer de côté"],a:1,x:"Nota de la FT 3.1.",s:"Référentiel 3.1"},
{th:"ouv",ty:"qcm",q:"VL sur le toit, ouverture de porte en écrasant le bas de caisse : sur quel véhicule est-ce interdit ?",o:["Les véhicules Start & Stop","Les VEA (zone de 20 cm du bas de caisse)","Les véhicules 3 portes","Les véhicules à portes coulissantes"],a:1,x:"Interdiction de toucher au bas de caisse dans une zone de 20 cm sur les VEA.",s:"Référentiel 3.1"},
{th:"ouv",ty:"qcm",q:"Ouverture par les charnières : quand la choisir ?",o:["Systématiquement","Si la serrure n’est pas accessible ou si le raisonnement tactique impose d’enlever la porte (ex. anticipation de levée de TdB)","Uniquement sur portes arrière","Uniquement si la victime est critique"],a:1,x:"Référentiel 3.2.",s:"Référentiel 3.2"},
{th:"ouv",ty:"qcm",q:"Créer un vide au niveau de l’aile avant en l’écrasant à l’écarteur au passage de roue :",o:["Toujours possible","Interdit si le véhicule dispose d’un Start & Stop","Interdit sur les VE uniquement","Interdit sur les ailes plastique"],a:1,x:"Technique interdite avec Start & Stop.",s:"Référentiel 3.2"},
{th:"ouv",ty:"qcm",q:"Ouverture par les charnières, première action physique sur l’aile :",o:["Écraser l’aile au passage de roue","Repérer et retirer le répétiteur de clignotant, puis engager la pointe du Halligan dans le trou et pousser","Couper l’aile à la cisaille","Dévisser le phare"],a:1,x:"À deux si nécessaire, sans à-coup ; un espace se crée au niveau des charnières.",s:"Référentiel 3.2"},
{th:"ouv",ty:"qcm",q:"Capot qui ne s’ouvre pas, serrure côté pare-choc. Le câble d’ouverture passe derrière l’optique dans…",o:["30 % des cas","50 % des cas","80 % des cas","100 % des cas"],a:2,x:"Retirer l’optique côté conducteur ; tirer sur le câble et sa gaine (80 % des cas). Chez Ford, le verrou est dans le logo.",s:"Référentiel 3.4"},
{th:"ouv",ty:"qcm",q:"Coffre sans accès intérieur : quel bloc optique déposer en priorité ?",o:["Côté conducteur","Côté passager, dans le sens d’ouverture de la serrure","Les deux","Le troisième feu stop"],a:1,x:"La gâche de la serrure s’ouvre généralement dans ce sens.",s:"Référentiel 3.6"},
{th:"ouv",ty:"qcm",q:"Écrous de fixation d’un hayon, accessibles sous le capitonnage :",o:["8 ou 10 mm","10 ou 13 mm","13 ou 17 mm","Torx T30"],a:1,x:"Diamètre 10 ou 13 mm.",s:"Référentiel 3.5"},

/* ---------- TABLEAU DE BORD ---------- */
{th:"tdb",ty:"qcm",q:"Compression qui vient contre les jambes de la victime (frontal) : technique de base ?",o:["Levée de tableau de bord à l’écarteur","Poussée de tableau de bord au vérin","Gestion des pédales","Demi-pavillon"],a:1,x:"Poussée (vérin) : compression contre les jambes. Levée (écarteur ou vérin) : compression du dessus.",s:"Référentiel 4.1"},
{th:"tdb",ty:"qcm",q:"Statistiques : entre combien de centimètres une victime incarcérée est-elle bloquée ?",o:["1 et 3 cm","3 et 7 cm","7 et 12 cm","10 et 20 cm"],a:1,x:"Au-delà de 7 cm, le membre est sectionné. L’espace apporté est adapté et non exagéré.",s:"Référentiel 4.1 · FMPA"},
{th:"tdb",ty:"qcm",q:"Poussée de TdB rapide : placement du vérin ?",o:["Tête sous le volant, pied sur le plancher","Tête à l’angle du montant A et du renfort de TdB, pied au pied du montant B","Tête sur le pavillon, pied sur le seuil","Tête sur la console centrale, pied sur le montant B"],a:1,x:"Avec un jeu de cales sous le pied et, si possible, le renfort de travellage.",s:"Référentiel 4.1"},
{th:"tdb",ty:"qcm",q:"Poussée de TdB : quel ordre est impératif ?",o:["Coupes de décharge, puis mise en tension du vérin","Mise en tension du vérin, puis coupes de décharge","Indifférent","Coupe du montant A en haut, puis tension, puis décharge basse"],a:1,x:"Le vérin est toujours en tension avant les coupes de décharge ; l’inverse accroît le risque de compression de la victime.",s:"Référentiel 4.4"},
{th:"tdb",ty:"qcm",q:"Coupe de décharge (fenêtre) du montant A lors d’une levée ou poussée complète : où ?",o:["Sous la charnière basse","Au-dessus de la charnière basse (point de renfort et zone 20 cm VEA)","Au milieu du montant","Au ras du pavillon"],a:1,x:"Il est impératif de couper au-dessus de la charnière basse ; la coupe doit traverser tout le montant et le bas de caisse.",s:"Référentiel 4.3 · 4.4"},
{th:"tdb",ty:"qcm",q:"Levée de TdB : plus la fenêtre découpée est grande…",o:["Plus on peut lever","Moins il sera possible de lever","Plus le calage est stable","Plus on protège la victime"],a:1,x:"Taille de la fenêtre selon la hauteur à obtenir.",s:"Référentiel 4.3"},
{th:"tdb",ty:"qcm",q:"Levée de TdB inefficace : quelle coupe de décharge réaliser ?",o:["Coupe du pavillon","Coupe de décharge droite sur la poutre de joue d’aile, entre la suspension et le montant A, puis charnière du capot","Coupe du montant B","Coupe du plancher"],a:1,x:"Poussée : décharge du longeron en biais vers le pare-brise entre suspension et montant A.",s:"Référentiel 4.3 · 4.4"},
{th:"tdb",ty:"qcm",q:"Deux victimes à l’avant lors d’une levée ou poussée de TdB :",o:["On traite la plus grave d’abord, sans précaution particulière","Un vérin est mis en place du côté opposé","On fait un demi-pavillon complet à la place","On utilise deux écarteurs du même côté"],a:1,x:"Critère d’efficacité commun aux FT 4.1, 4.3 et 4.4.",s:"Référentiel 4.x"},
{th:"tdb",ty:"qcm",q:"Couper le montant A et le pare-brise en partie haute lors d’une poussée : où couper ?",o:["Au milieu du montant","Au plus près du pavillon","Au ras du tableau de bord","À 10 cm sous le pavillon"],a:1,x:"Pour éviter que le volant pénètre le pare-brise et/ou que le montant coupé rentre dans le tableau de bord.",s:"Référentiel 4.3 · 4.4"},
{th:"tdb",ty:"qcm",q:"Gestion du volant avec sangle à cliquet : où placer le cliquet ?",o:["Sur le pare-brise avec une cale","Sur un montant, pas sur le pare-brise","Sur le capot","Sur le volant"],a:1,x:"Sur le pare-brise, une cale s’enfoncerait. Technique réalisable avec les portes mais elle bloquera leur ouverture.",s:"Référentiel 4.2"},
{th:"tdb",ty:"qcm",q:"Gestion du volant par le montant A : action sur l’écarteur ?",o:["On ouvre l’écarteur","On referme l’écarteur, ce qui comprime le volant vers le montant A","On le laisse en tension sans bouger","On l’utilise en pince à plat"],a:1,x:"Bec 1 contre l’extérieur du montant A (plus il est haut, plus le volant monte), bec 2 sur la branche la plus proche.",s:"Référentiel 4.2"},
{th:"tdb",ty:"qcm",q:"Couper l’axe à la base du volant :",o:["Technique de première intention sur véhicule récent","Uniquement si c’est identifié sur la FAD","Interdit dans tous les cas","Seulement à la scie sabre"],a:1,x:"Bien positionner la cisaille à l’axe ; tenir le volant (chute sur la victime).",s:"Référentiel 4.2"},
{th:"tdb",ty:"qcm",q:"Gestion du volant au vérin : condition côté victime ?",o:["Victime allongée","Place au niveau des jambes, jambe gauche mobilisable","Porte déposée","Pare-brise retiré"],a:1,x:"Plus efficace sur PL ou camionnette ; peut être couplée.",s:"Référentiel 4.2"},
{th:"tdb",ty:"qcm",q:"Gestion des pédales : quelle première action avant toute technique ?",o:["Couper la pédale au coupe-pédale","Essayer de retirer la ou les chaussures","Passer une sangle","Pousser le TdB"],a:1,x:"Souvent suffisant pour libérer les pieds.",s:"Référentiel 4.5"},
{th:"tdb",ty:"qcm",q:"Pédale avec deux boucles de sangle et écarteur :",o:["Les deux becs dans la même boucle pour répartir l’effort","Ne jamais passer les deux becs dans une même boucle (étirement, rupture)","Une boucle suffit toujours","Les boucles se font en nœud plat"],a:1,x:"Nœuds cités : nœud de sangle, nœud de huit double, boucles.",s:"Référentiel 4.5"},
{th:"tdb",ty:"qcm",q:"Pédales à l’écarteur : plus l’écarteur est éloigné du montant A…",o:["Plus la traction est efficace","Plus la sangle a tendance à s’enlever de la pédale","Plus la pédale casse vite","Moins il faut de force"],a:1,x:"Écarteur placé verticalement.",s:"Référentiel 4.5"},

/* ---------- REFORMATION & TUNNEL ---------- */
{th:"ref",ty:"qcm",q:"Quelle cale utiliser en tête de vérin pour une reformation ?",o:["N’importe quelle cale plate","Uniquement les cales prévues pour la reformation (les autres = effet missile) ; à défaut, autre solution","Une cale escalier à l’envers","Pas de cale, jamais"],a:1,x:"Référentiel 5.1 / FMPA.",s:"Référentiel 5.1"},
{th:"ref",ty:"qcm",q:"Reformation : avant d’avoir obtenu la forme souhaitée…",o:["On réalise les coupes de décharge pour faciliter","On ne coupe pas la structure, pour garder la force de la poussée","On relâche pour contrôler","On retire le vérin"],a:1,x:"FMPA 2026.",s:"FMPA SR 2026"},
{th:"ref",ty:"qcm",q:"Reformation : la poussée doit être prolongée mais le vérin est en fin de course. Que fais-tu ?",o:["Tu relâches, tu ajoutes une cale et tu repousses","Tu prépares un deuxième vérin avec une rallonge pour faire la substitution, sans relâcher la tension","Tu passes à l’écarteur","Tu coupes le montant"],a:1,x:"Attention à ne pas relâcher la tension.",s:"Référentiel 5.1"},
{th:"ref",ty:"qcm",q:"Appui de vérin sur le pavillon, puis retrait du vérin pour la sortie : que prévoir ?",o:["Rien, la tôle reste déformée","Le pavillon reviendra en arrière de quelques centimètres","Le pavillon s’effondre","Il faut couper le pavillon avant"],a:1,x:"Référentiel 5.1.",s:"Référentiel 5.1"},
{th:"ref",ty:"multi",q:"Reformation : sur quelles zones chercher à pousser ?",o:["Montants","Cadres de porte","Blocs ceintures","Tôle fine du pavillon","Panneau de porte"],a:[0,1,2],x:"Zones renforcées, souvent déconseillées à la coupe.",s:"Référentiel 5.1"},
{th:"ref",ty:"qcm",q:"Reformation : efficacité selon la FMPA ?",o:["Très efficace sur véhicules intacts","Très efficace sur véhicules déformés ; faible efficacité sur véhicules intacts","Efficace uniquement sur véhicules anciens","Efficace uniquement sur VL sur le toit"],a:1,x:"Succès si espace suffisant ; tester le passage avec le plan dur.",s:"FMPA SR 2026"},
{th:"ref",ty:"qcm",q:"Tunnel sur un VL sur ses roues : par où commencer la coupe ?",o:["Par l’avant","Par l’arrière","Par le côté victime","Par le centre"],a:1,x:"« L’action de coupe commencera par l’arrière. »",s:"Référentiel 5.2"},
{th:"ref",ty:"qcm",q:"Tunnel sur VL sur le toit : pourquoi supprimer impérativement l’habillage du plafond ?",o:["Il contient des airbags","Il agit comme un « pantalon de tronçonnage » et réduit l’efficacité de la lame","Il cache le marquage","Il est inflammable"],a:1,x:"Référentiel 5.2.",s:"Référentiel 5.2"},
{th:"ref",ty:"qcm",q:"Tunnel : à la scie sabre, que faut-il éviter ?",o:["Couper la tôle fine","Entamer les rails de toit","Faire des amorces","Couper par l’arrière"],a:1,x:"Amorces à la cisaille sur les parties renforcées, puis scie sabre sans entamer les rails.",s:"Référentiel 5.2"},

/* ---------- VL SUR SES ROUES ---------- */
{th:"roues",ty:"qcm",q:"Demi-pavillon : dans quel cas le privilégier ?",o:["Quand les dossiers avant ne fonctionnent pas","Quand les dossiers des fauteuils avant fonctionnent et que les montants A et B sont renforcés","Quand il y a 4 victimes sur un 3 portes","Quand le véhicule est sur le côté"],a:1,x:"Demi-pavillon complet : dossiers avant non fonctionnels, deux victimes à l’avant, montant A renforcé.",s:"Référentiel 6.2 · 6.3"},
{th:"roues",ty:"qcm",q:"Demi-pavillon : par quel montant commencer ?",o:["Le montant C le plus proche de la victime","Le montant C le plus éloigné de la victime","Le montant B côté conducteur","Les deux C en même temps"],a:1,x:"Annoncer la coupe de tous les montants ; faire maintenir le pavillon.",s:"Référentiel 6.2"},
{th:"roues",ty:"qcm",q:"Demi-pavillon complet : où réaliser les coupes de décharge ?",o:["Au niveau des rails du toit, à environ 10 cm du haut du pare-brise","Au milieu du pavillon","Au niveau du montant C","Sur le pare-brise"],a:0,x:"Demi-pavillon simple : décharges au niveau des rails avant le montant B.",s:"Référentiel 6.3"},
{th:"roues",ty:"ordre",q:"Demi-pavillon complet, victime côté conducteur (gauche) : remets l’ordre de coupe des montants.",o:["Montant B droit (le plus éloigné)","Montant C droit","Montant C gauche","Montant B gauche (le plus proche de la victime)"],x:"Commencer par le B le plus éloigné, puis le C, et ainsi de suite pour finir par le B le plus près de la victime.",s:"Référentiel 6.3"},
{th:"roues",ty:"qcm",q:"Technique du pavillon : par quel montant commencer ?",o:["Le montant C le plus éloigné","Le montant A le plus éloigné de la victime","Le montant B le plus proche","Le montant A côté victime"],a:1,x:"Ordre logique 1 à 6, toujours finir par le montant le plus proche de la victime.",s:"Référentiel 6.4"},
{th:"roues",ty:"qcm",q:"Pavillon : comment couper le pare-brise ?",o:["Deux traits en V","Un trait de coupe unique, au niveau des traits de coupe des montants","Le retirer entièrement d’abord","Ne pas le couper, il part avec le pavillon"],a:1,x:"Le CA peut dessiner la hauteur de coupe du pare-brise. Évacuer le pavillon si possible vers l’arrière.",s:"Référentiel 6.4"},
{th:"roues",ty:"qcm",q:"Troisième porte : dans quelle situation type ?",o:["Victime seule à l’arrière d’un 5 portes","4 victimes sur un véhicule à 3 portes","Véhicule sur le côté","Véhicule utilitaire à porte coulissante"],a:1,x:"Référentiel 6.5.",s:"Référentiel 6.5"},
{th:"roues",ty:"qcm",q:"Troisième porte : où placer le marquage de la découpe basse ?",o:["Au ras du bas de caisse","Légèrement au-dessus de la banquette","Au niveau de la poignée","Sous la banquette"],a:1,x:"Vérifier la hauteur de la banquette et marquer légèrement au-dessus.",s:"Référentiel 6.5"},
{th:"roues",ty:"qcm",q:"Troisième porte, latérale, voile : quelle coupe toujours en dernier ?",o:["La base du montant B","Le haut du montant B","Le cadre de glace","Le bas de caisse"],a:1,x:"Finir par le haut du B pour qu’il ne rentre pas dans l’habitacle pendant la coupe ; l’énergie de coupe part vers le sol.",s:"Référentiel 6.5 · 6.7 · 8.3"},
{th:"roues",ty:"qcm",q:"Voie américaine : où placer l’écarteur ?",o:["Entre la base du montant B et la structure de caisse (sous la banquette puis bas de caisse), sans appui direct sur l’enrouleur","Entre le montant A et le montant B","Sous le pavillon","Dans la charnière arrière"],a:0,x:"Un vérin peut remplacer l’écarteur. Ensuite couper le sommet du B et basculer vers l’avant.",s:"Référentiel 6.6"},
{th:"roues",ty:"qcm",q:"Latérale avec portière : où couper la base du montant B ?",o:["Au-dessus de la charnière basse","Sous la charnière basse","Au milieu du montant","Au niveau de l’enrouleur"],a:1,x:"Au-dessus de la charnière basse = on enlève la porte ; au-dessous = on laisse la porte.",s:"Référentiel 6.7"},
{th:"roues",ty:"vf",q:"Sur les véhicules récents, la technique latérale (coupe de base du B) peut être déconseillée voire interdite par la FAD.",a:true,x:"Base renforcée, volumineuse, pyrotechnie, support de ceinture, enrouleur…",s:"Référentiel 6.7"},
{th:"roues",ty:"qcm",q:"Quelle technique sur VL sur ses roues évite de gérer le pare-brise et le montant A (souvent renforcé) ?",o:["Pavillon","Tunnel / demi-pavillon","Troisième porte","Levée de TdB"],a:1,x:"Référentiel 6.1. Le pavillon est une alternative rapide sur anciens véhicules.",s:"Référentiel 6.1"},

/* ---------- CÔTÉ & TOIT ---------- */
{th:"cote",ty:"qcm",q:"Charnière (VL sur le côté) : où se fait la coupe de décharge ?",o:["Verticale au milieu du pavillon","Horizontale au plus bas du pavillon, au-dessus des rails de toit, au niveau des montants A et C","Sur le bas de caisse","Au niveau du montant B"],a:1,x:"Les coupes de décharge sont évolutives.",s:"Référentiel 7.2"},
{th:"cote",ty:"multi",q:"Charnière : avant et pendant le pivotement du pavillon…",o:["Préparer un lit de cales","Pivoter sans secousse aux ordres du CA","Prévenir l’équipe SUAP","Caler le pavillon au sol avant l’extraction","Faire marcher les équipiers sur le pavillon avec le plan dur"],a:[0,1,2,3],x:"Ne pas se déplacer avec la victime et le plan dur sur le pavillon.",s:"Référentiel 7.2"},
{th:"cote",ty:"qcm",q:"Charnière avec montants renforcés : quand couper le pare-brise ?",o:["En premier","En dernier, pour le rabattre et éviter qu’il tombe à l’intérieur","Jamais","Avant la découpe horizontale du toit"],a:1,x:"En diagonale si nécessaire ; il est aussi possible de le couper avant.",s:"Référentiel 7.2"},
{th:"cote",ty:"qcm",q:"Charnière : pourquoi couper les montants au ras du pavillon ?",o:["Pour économiser les lames","Pour qu’ils ne gênent pas une fois le pavillon à terre","Pour éviter les airbags rideaux","Pour mieux caler"],a:1,x:"Référentiel 7.2.",s:"Référentiel 7.2"},
{th:"toit",ty:"qcm",q:"VL sur le toit, demi-pavillon inversé : principe ?",o:["Lever le véhicule pour faire entrer un SP debout","Abaisser le pavillon et stabiliser le plancher","Basculer le véhicule sur le côté","Retirer le plancher"],a:1,x:"L’intérêt de lever est limité, la partie la plus lourde étant en haut.",s:"Référentiel 8.2"},
{th:"toit",ty:"qcm",q:"Demi-pavillon inversé : où ne jamais placer le vérin ?",o:["Sur des cales","Dans l’axe de sortie de la victime","Entre plancher et pavillon","Côté montant B"],a:1,x:"Surveiller l’aplomb du vérin et assurer le contre-calage.",s:"Référentiel 8.2"},
{th:"toit",ty:"qcm",q:"Voile : distance de coupe de part et d’autre de la base du montant B ?",o:["5 cm","10 cm (davantage sur les véhicules récents)","20 cm","30 cm"],a:1,x:"Vérifier que tout le bas de caisse est sectionné.",s:"Référentiel 8.3"},
{th:"toit",ty:"qcm",q:"La voile équivaut, sur un véhicule sur le toit, à quelle technique sur roues ?",o:["Demi-pavillon","Latérale","Pavillon","Voie américaine"],a:1,x:"Enchaînement de techniques simples, limitant les coupes.",s:"Référentiel 8.3"},
{th:"toit",ty:"qcm",q:"Voile : après les coupes, que fait-on du montant B ?",o:["On le retire au sol","On le relève par-dessus le véhicule et on le sécurise à la corde à cliquet","On le laisse pendre","On le plie vers l’intérieur"],a:1,x:"Puis protection des parties saillantes.",s:"Référentiel 8.3"},
{th:"toit",ty:"qcm",q:"Demi-pavillon inversé : quel montant n’est pas toujours nécessaire de couper ?",o:["Montant C","Montant B (une coupe de décharge en biais ou droite avant les montants suffit alors)","Montant A","Aucun"],a:1,x:"Selon la configuration, l’espace à gagner et la voiture.",s:"Référentiel 8.2"},

/* ---------- SPÉCIFIQUES ---------- */
{th:"spe",ty:"qcm",q:"Déplacer un véhicule d’un obstacle : distance maximale ?",o:["20 cm","50 cm","1 m","Jusqu’à libérer complètement l’accès"],a:1,x:"1) déplacer de 50 cm max ; 2) reprendre le volume ; 3) extraire.",s:"Référentiel 9.3"},
{th:"spe",ty:"multi",q:"Véhicule utilisé comme point fixe : mesures obligatoires.",o:["Caler le véhicule","Frein à main","Retirer les clés","Engager une vitesse","Laisser le moteur tourner pour la pression hydraulique"],a:[0,1,2,3],x:"Référentiel 9.2 et 9.3.",s:"Référentiel 9.2 · 9.3"},
{th:"spe",ty:"qcm",q:"Remise sur roues : longueur utile de câble à prévoir ?",o:["La distance au véhicule","Distance au véhicule + hauteur du pavillon","Deux fois la largeur du véhicule","10 m"],a:1,x:"Référentiel 9.2.",s:"Référentiel 9.2"},
{th:"spe",ty:"ordre",q:"Remettre un véhicule sur ses roues : remets dans l’ordre.",o:["Caler le véhicule et fixer 2 sangles sous le châssis","Attacher les sangles au crochet du treuil ou du tirefort","Basculer en douceur au vérin grande longueur jusqu’au point d’équilibre","Le treuil accompagne le véhicule au sol","Stabiliser en 4 ou 5 points et débuter la désincarcération"],x:"Un écureuil maintient la tête pendant toute la manœuvre.",s:"Référentiel 9.2"},
{th:"spe",ty:"qcm",q:"Coussins de levage superposés : règle ?",o:["Le plus petit en dessous pour la stabilité","Le plus gros toujours en dessous ; pas plus de deux (selon fabricant)","Trois maximum","Une cale entre les deux"],a:1,x:"Plus le coussin est déployé, plus il perd de puissance et moins il est stable.",s:"Référentiel 9.5"},
{th:"spe",ty:"qcm",q:"À quoi est raccordé le pupitre de commande des coussins de levage ?",o:["Au groupe hydraulique","À une bouteille d’ARI","Au compresseur de l’engin","À une pompe manuelle"],a:1,x:"Garder un visuel sur l’ensemble de la manœuvre ; robinets de fermeture en place.",s:"Référentiel 9.5"},
{th:"spe",ty:"qcm",q:"Levage, victime sous une roue : pourquoi sangler la suspension ?",o:["Pour éviter le rebond","Pour gagner la hauteur de la suspension et obtenir une levée plus droite","Pour arrimer le véhicule","Pour protéger la victime des débris"],a:1,x:"Sangle à cliquet.",s:"Référentiel 9.5"},
{th:"spe",ty:"vf",q:"Les techniques de relocalisation sont des techniques de première intention, rapides à mettre en œuvre.",a:false,x:"Elles demandent une grande maîtrise et ne doivent être réalisées qu’en dernier recours.",s:"Référentiel 9.1"},
{th:"spe",ty:"qcm",q:"Pendant une remise sur roues, quel est le rôle de l’écureuil ?",o:["Il guide le treuil","Il maintient la tête de la victime pendant toute la manœuvre et sert de « sonnette »","Il cale l’intérieur","Il sort avant la bascule"],a:1,x:"Position stable, anticiper la descente, communiquer en permanence.",s:"Référentiel 9.2"},

/* ---------- CONTEXTE ---------- */
{th:"ctx",ty:"qcm",q:"Autoroute : numérotation opérationnelle de la voie de droite ?",o:["V0","V1","VD","V4"],a:1,x:"V1 = voie de droite ; V4 = voie de gauche (de la plus lente à la plus rapide).",s:"GDO ch.1 §1.1"},
{th:"ctx",ty:"qcm",q:"Hauteur libre sous un pont d’autoroute :",o:["4,00 m","4,30 m","4,75 m","5,10 m"],a:2,x:"4,75 m ; 4,30 m pour les autres routes (sauf exception matérialisée).",s:"GDO ch.1 §1.3.1"},

<script>

  return Math.round((b-a)/86400000);
}
function updateChip(){

}

function statsFor(list){
  let seen=0, ok=0, mastered=0;
  list.forEach(q=>{ const r=S.q[q.id]; if(r){ seen++; if(r.last) ok++; if(r.ok>=2 && r.last) mastered++; } });
  return {total:list.length, seen, ok, mastered};
}
function errorsList(){ return QUIZ.filter(q=>S.q[q.id] && S.q[q.id].last===false); }

  cur = Object.assign({tab}, extra||{});

  if(location.hash !== "#"+tab){ try{ history.replaceState(null,"","#"+tab); }catch(e){ location.hash = tab; } }
  render(); window.scrollTo(0,0);
}
window.addEventListener("hashchange", ()=>{ const t=location.hash.slice(1); if(TABS.includes(t) && t!==cur.tab) go(t); });
document.querySelectorAll("nav.tabs button").forEach(b=>b.addEventListener("click",()=>go(b.dataset.tab)));

function render(){

/* ---------- Quiz : réglages ---------- */
let setup = {mode:"training", themes:[], n:20};
const MODES = {
  training:["Entraînement","Correction immédiate"],

  errors:["Mes erreurs","Ce que tu as raté"],

function vQuizSetup(){

  if(setup.mode==="training" || setup.mode==="exam"){
    html += `<section class="card"><div class="qhead"><div class="eyebrow">Thèmes</div><button class="btn ghost" style="min-height:34px;padding:4px 10px" data-act="all-themes">${setup.themes.length?"Tous":"Tous sélectionnés"}</button></div>
    <div class="chips" style="margin-top:8px">${CHAPITRES.filter(([k])=>QUIZ.some(q=>q.th===k)).map(([k,n])=>`<button data-theme="${k}" aria-pressed="${setup.themes.includes(k)}">${esc(n)} <span class="muted">${QUIZ.filter(q=>q.th===k).length}</span></button>`).join("")}</div>
    <p class="muted" style="font-size:13px;margin:10px 0 0">Aucun thème coché = toute la banque.</p></section>`;
  }
  if(setup.mode==="training"){
    html += `<section class="card"><div class="eyebrow" style="margin-bottom:8px">Nombre de questions</div><div class="chips">${[10,20,40,0].map(n=>`<button data-n="${n}" aria-pressed="${setup.n===n}">${n||"Toutes"}</button>`).join("")}</div>
    <p class="muted" style="font-size:13px;margin:10px 0 0">Les questions jamais vues et celles que tu as ratées passent en priorité.</p></section>`;
  }
  html += `<button class="btn primary" data-act="start" style="min-height:52px;font-size:18px">Lancer</button>`;
  return html;
}
function poolFor(mode){
  const th = setup.themes;
  let base = QUIZ.filter(q=>!th.length || th.includes(q.th));
  if(mode==="errors") return shuffle(errorsList());
  if(mode==="sudden") return shuffle(QUIZ);
  if(mode==="exam") return shuffle(base).slice(0,30);
  const score = q => { const r=S.q[q.id]; if(!r) return 0; if(r.last===false) return 1; return 2 + Math.min(r.ok,5); };
  const sorted = shuffle(base).sort((a,b)=>score(a)-score(b));
  return shuffle(setup.n ? sorted.slice(0,setup.n) : sorted);
}
function startQuiz(mode, themes){
  if(themes) setup.themes = themes;
  setup.mode = mode;
  const list = poolFor(mode);
  if(!list.length){ toast("Aucune question pour ce choix"); return; }
  cur = {tab:"quiz", run:{mode, list:list.map(prep), i:0, answers:[], t0:Date.now()}};
  try{ history.replaceState(null,"","#quiz"); }catch(e){}
  render(); window.scrollTo(0,0);
}
function prep(q){
  const p = {q, picked:[], done:false};
  if(q.ty==="qcm"||q.ty==="multi"){ p.order = shuffle(q.o.map((_,i)=>i)); }
  else if(q.ty==="vf"){ p.order=[0,1]; }
  else if(q.ty==="ordre"){ p.order = shuffle(q.o.map((_,i)=>i)); if(p.order.every((v,i)=>v===i)) p.order.reverse(); p.seq=[]; }
  return p;
}

/* ---------- Quiz : question ---------- */
let timerId=null, timeLeft=0;
function stopTimer(){ if(timerId){ clearInterval(timerId); timerId=null; } }
function startTimer(){
  stopTimer(); timeLeft = 40;
  timerId = setInterval(()=>{
    timeLeft--; const el=$("#timer"); if(el){ el.textContent = timeLeft+" s"; el.classList.toggle("low", timeLeft<=10); }
    if(timeLeft<=0){ stopTimer(); answer(null,true); }
  },1000);
}
const TYPES = {qcm:"Une seule réponse", multi:"Plusieurs réponses possibles", vf:"Vrai ou faux", ordre:"Remets dans l’ordre"};
function vQuestion(){
  const R = cur.run; const P = R.list[R.i]; const q = P.q; const exam = R.mode==="exam";
  const n = R.list.length;
  let html = `<div class="qhead"><span class="pill">${esc(MODES[R.mode][0])} · ${R.mode==="sudden" ? "série "+R.i : (R.i+1)+" / "+n}</span>${exam?`<span class="timer" id="timer">40 s</span>`:""}<button class="btn ghost" style="min-height:36px;padding:4px 10px" data-act="quit">Arrêter</button></div>
  <div class="prog" aria-hidden="true"><i style="width:${R.mode==="sudden"?0:Math.round(R.i/n*100)}%"></i></div>
  <section class="qcard"><div class="row" style="justify-content:space-between;align-items:center"><span class="typetag">${TYPES[q.ty]}</span><span class="pill">${esc(CHAP[q.th]||"")}</span></div><div class="q">${esc(q.q)}</div>`;
  const keys = "ABCDEFGH";
  if(q.ty==="ordre"){
    html += `<div class="eyebrow">Ta séquence</div><div class="seq">${P.seq.length?P.seq.map((oi,k)=>`<div class="it"><span class="n">${k+1}.</span><span>${esc(q.o[oi])}</span></div>`).join(""):`<div class="muted" style="font-size:14px">Touche les étapes dans l’ordre.</div>`}</div>
    <div class="opts">${P.order.filter(oi=>!P.seq.includes(oi)).map(oi=>`<button class="opt ${P.done?"locked":""}" data-seq="${oi}" ${P.done?"disabled":""}><span class="k">+</span><span>${esc(q.o[oi])}</span></button>`).join("")}</div>
    ${!P.done?`<div class="row"><button class="btn" data-act="undo" ${P.seq.length?"":"disabled"}>Annuler la dernière</button><button class="btn primary" data-act="validate" ${P.seq.length===q.o.length?"":"disabled"}>Valider</button></div>`:""}`;
    if(P.done){
      html += `<div class="eyebrow">Bon ordre</div><div class="seq">${q.o.map((t,k)=>`<div class="it" style="border-style:solid;border-color:${P.seq[k]===k?"var(--ok)":"var(--bad)"}"><span class="n">${k+1}.</span><span>${esc(t)}</span></div>`).join("")}</div>`;
    }
  } else {
    const labels = q.ty==="vf" ? ["Vrai","Faux"] : q.o;
    const correct = q.ty==="vf" ? [q.a?0:1] : (q.ty==="multi"? q.a : [q.a]);
    html += `<div class="opts">${P.order.map((oi,k)=>{
      let cls = "";
      if(P.done && !exam){ if(correct.includes(oi)) cls="good"; else if(P.picked.includes(oi)) cls="wrong"; }
      const pressed = P.picked.includes(oi);
      return `<button class="opt ${cls} ${P.done?"locked":""}" data-opt="${oi}" aria-pressed="${pressed}" ${P.done?"disabled":""}><span class="k">${keys[k]}</span><span>${esc(labels[oi])}</span></button>`;
    }).join("")}</div>`;
    if(q.ty==="multi" && !P.done) html += `<button class="btn primary" data-act="validate" ${P.picked.length?"":"disabled"}>Valider ma sélection</button>`;
  }
  if(P.done && !exam){
    html += `<div class="fb ${P.ok?"ok":"ko"}"><b class="v">${P.ok?"Juste.":(P.timeout?"Temps écoulé.":"Raté.")}</b>${esc(q.x)}<div style="margin-top:6px"><span class="src">${esc(q.s)}</span></div></div>
    <button class="btn primary" data-act="next">${(R.mode==="sudden"&&!P.ok)?"Voir le résultat":(R.i+1<n?"Question suivante":"Voir le résultat")}</button>`;
  }
  html += `</section>`;
  return html;
}
function isCorrect(P){
  const q=P.q;
  if(q.ty==="ordre") return P.seq.length===q.o.length && P.seq.every((v,i)=>v===i);
  if(q.ty==="vf") return P.picked[0]===(q.a?0:1);
  if(q.ty==="qcm") return P.picked[0]===q.a;
  const a=[...q.a].sort().join(), b=[...P.picked].sort().join(); return a===b;
}
function answer(opt, timeout){
  const R=cur.run; const P=R.list[R.i]; if(P.done) return;
  if(opt!=null){ P.picked=[opt]; }
  P.done=true; P.timeout=!!timeout; P.ok = timeout ? false : isCorrect(P);
  const r = S.q[P.q.id] || {n:0,ok:0,last:null}; r.n++; if(P.ok) r.ok++; r.last=P.ok; S.q[P.q.id]=r; save();
  R.answers.push(P);
  stopTimer();
  if(R.mode==="exam"){ next(); return; }
  render();
  const fb=$(".fb"); if(fb) fb.scrollIntoView({behavior:"smooth",block:"nearest"});
}
function next(){
  const R=cur.run; const P=R.list[R.i];
  if(R.mode==="sudden" && P && P.done && !P.ok){ finish(); return; }
  R.i++;
  if(R.i>=R.list.length){ finish(); return; }
  render(); window.scrollTo(0,0);
}
function finish(){
  stopTimer();
  const R=cur.run; cur={tab:"quiz", result:{mode:R.mode, answers:R.answers, total:R.mode==="sudden"?R.answers.length:R.list.length, t:Math.round((Date.now()-R.t0)/1000)}};
  render(); window.scrollTo(0,0);
}
function vResult(){
  const Rr=cur.result; const good=Rr.answers.filter(a=>a.ok).length; const tot=Rr.total;
  const pct = tot?Math.round(good/tot*100):0;
  let verdict;
  if(Rr.mode==="sudden") verdict = `Série de ${good} bonne${good>1?"s":""} réponse${good>1?"s":""} d’affilée.`;
  else verdict = pct>=85?"Niveau chef d’agrès. Garde ce rythme.":pct>=70?"Solide. Reprends les erreurs ci-dessous.":pct>=50?"Des bases, mais trop de trous pour commander sereinement.":"À retravailler : relis les fiches du thème puis relance.";
  let html = `<section class="card" style="text-align:center"><div class="eyebrow">${esc(MODES[Rr.mode][0])}</div><div class="score">${Rr.mode==="sudden"?good:pct+" %"}</div><p style="margin:6px 0 0;font-weight:700">${verdict}</p><p class="muted" style="margin:4px 0 0">${good} / ${tot} · ${Math.floor(Rr.t/60)} min ${Rr.t%60} s</p></section>
  <div class="row"><button class="btn primary" data-act="restart">Relancer</button>${errorsList().length?`<button class="btn" data-act="errors">Revoir mes erreurs (${errorsList().length})</button>`:""}<button class="btn ghost" data-act="setup">Réglages</button></div>`;
  const wrong = Rr.answers.filter(a=>!a.ok);
  if(wrong.length){
    html += `<h2 class="sec-title">Corrigé de tes erreurs</h2><div class="review">${wrong.map(a=>{
      const q=a.q; let rep="";
      if(q.ty==="qcm") rep = q.o[q.a];
      else if(q.ty==="multi") rep = q.a.map(i=>q.o[i]).join(" · ");
      else if(q.ty==="vf") rep = q.a?"Vrai":"Faux";
      else rep = q.o.map((t,i)=>(i+1)+". "+t).join("  ");
      return `<div class="r"><b>${esc(q.q)}</b><div style="margin-top:4px"><span class="muted">Réponse :</span> ${esc(rep)}</div><div class="muted" style="margin-top:4px">${esc(q.x)}</div><div style="margin-top:6px"><span class="src">${esc(q.s)}</span></div></div>`;
    }).join("")}</div>`;
  } else if(Rr.answers.length){
    html += `<div class="card empty">Aucune erreur sur cette série.</div>`;
  }
  return html;
}
